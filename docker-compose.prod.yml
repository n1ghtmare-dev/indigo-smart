version: "3.9"

# Подключение к MySQL, установленному через FastPanel на хосте.
# Backend использует network_mode: host, поэтому DB_HOST=127.0.0.1
# и порт 8000 публикуется напрямую через хостовой сетевой стек.

services:
  backend:
    image: ghcr.io/n1ghtmare-dev/indigo-smart-backend:latest
    container_name: indigo_backend
    restart: unless-stopped
    network_mode: host
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      SIMULATOR_AUTOSTART: "true"

  frontend:
    image: ghcr.io/n1ghtmare-dev/indigo-smart-frontend:latest
    container_name: indigo_frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend

<style>
  /* &#1045;&#1076;&#1080;&#1085;&#1072;&#1103; &#1090;&#1105;&#1084;&#1085;&#1072;&#1103; &#1090;&#1077;&#1084;&#1072;: &#1089;&#1090;&#1088;&#1072;&#1085;&#1080;&#1094;&#1072; &#1085;&#1072;&#1084;&#1077;&#1088;&#1077;&#1085;&#1085;&#1086; &#1078;&#1080;&#1074;&#1105;&#1090; &#1074; &#1086;&#1076;&#1085;&#1086;&#1084; &#1074;&#1080;&#1079;&#1091;&#1072;&#1083;&#1100;&#1085;&#1086;&#1084; &#1084;&#1080;&#1088;&#1077;,
     &#1082;&#1072;&#1082; &#1080;&#1085;&#1078;&#1077;&#1085;&#1077;&#1088;&#1085;&#1072;&#1103; &#1082;&#1072;&#1088;&#1090;&#1072; &#1089;&#1082;&#1072;&#1085;&#1080;&#1088;&#1086;&#1074;&#1072;&#1085;&#1080;&#1103; &#1089;&#1077;&#1090;&#1080;. */
  :root {
    --void: #000000;
    --sheet: #080b10;
    --raise: #0e131a;
    --edge: #1c242e;
    --edge-soft: #131922;
    --ink: #e9eff6;
    --dim: #8a99ab;
    --faint: #5a6675;
    --focus: #3bbdff;
    --ok: #2fe08a;
    --bad: #ff5f56;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 14px;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  .shell {
    max-width: 1760px; margin: 0 auto;
    display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start;
  }
  @media (max-width: 900px) { .shell { grid-template-columns: minmax(0, 1fr); } }

  /* ---------- &#1082;&#1072;&#1088;&#1090;&#1072; ---------- */
  .canvas { background: var(--void); border: 1px solid var(--edge-soft); min-width: 0; }
  .scroller { overflow-x: auto; overscroll-behavior-x: contain; }
  svg.map { display: block; width: 100%; height: auto; min-width: 760px; }
  .cell { cursor: pointer; }
  .cell rect.fill { stroke: #000; stroke-width: .6; }
  .cell:hover rect.fill { stroke: var(--ink); stroke-width: 1.2; }
  .cell text { pointer-events: none; font-family: "IBM Plex Mono", monospace; font-weight: 500; text-anchor: middle; }
  .cell:focus { outline: none; }
  .cell:focus-visible rect.fill { stroke: var(--focus); stroke-width: 2; }
  .blk-line { fill: none; stroke: #2b3644; stroke-width: 1; pointer-events: none; }
  .blk-line.sel { stroke: var(--ink); stroke-width: 1.8; }
  .blk-label { font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 500; letter-spacing: .09em; fill: rgba(255,255,255,.78); text-transform: uppercase; pointer-events: none; }
  .blk-sub { font-family: "IBM Plex Mono", monospace; font-size: 8.5px; fill: rgba(255,255,255,.48); pointer-events: none; }
  .blk-bg { fill: rgba(0,0,0,.66); pointer-events: none; }
  .mark { pointer-events: none; }
  .mark rect { fill: none; stroke: rgba(255,255,255,.45); stroke-width: 1; }
  .cell.done .mark rect { fill: #fff; stroke: #fff; }
  .sub-pix { pointer-events: none; }

  /* ---------- &#1087;&#1072;&#1085;&#1077;&#1083;&#1100; ---------- */
  .panel { position: sticky; top: 14px; display: flex; flex-direction: column; gap: 22px; padding: 4px 2px 20px; }
  .title { text-align: right; }
  .title h1 { margin: 0; font-size: 25px; font-weight: 600; letter-spacing: -.015em; line-height: 1.1; }
  .title p { margin: 6px 0 0; font-size: 11px; color: var(--dim); letter-spacing: .05em; }

  .lg h2 { margin: 0 0 10px; font-size: 15px; font-weight: 500; letter-spacing: .01em; }
  .scale { display: flex; gap: 10px; }
  .scale .bar { width: 28px; border: 1px solid var(--edge); background: linear-gradient(to top,
      #060a12 0%, #0a1a52 8%, #1240ff 20%, #00a8ff 35%, #00ffb0 50%, #7dff2e 62%, #ffe000 75%, #ff8a00 86%, #ff2020 100%); }
  .scale .ticks { display: flex; flex-direction: column-reverse; justify-content: space-between; font-size: 10.5px; color: var(--dim); }

  .sizes { display: flex; flex-direction: column; gap: 9px; }
  .sizes div { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--dim); }
  .sizes i { display: inline-block; background: #1f6bff; flex: 0 0 auto; }

  .weeks { display: flex; flex-direction: column; gap: 1px; }
  .wk { appearance: none; border: 0; background: none; color: inherit; font: inherit; text-align: left;
        display: grid; grid-template-columns: 12px 1fr auto; gap: 9px; align-items: center;
        padding: 5px 6px; cursor: pointer; border-left: 2px solid transparent; }
  .wk:hover { background: var(--raise); }
  .wk[aria-pressed="true"] { border-left-color: var(--ink); background: var(--raise); }
  .wk i { width: 12px; height: 12px; }
  .wk span { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wk b { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 400; color: var(--faint); }
  .wk:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }

  .foot { margin: 0; font-size: 10.5px; line-height: 1.7; color: var(--faint); letter-spacing: .02em; }
  .foot b { color: var(--dim); font-weight: 500; }
  .sync { font-size: 10.5px; color: var(--faint); display: flex; align-items: center; gap: 7px; }
  .sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #2b3644; flex: 0 0 auto; }
  .sync.on::before { background: var(--ok); }
  .sync.err::before { background: var(--bad); }

  /* ---------- &#1095;&#1080;&#1090;&#1072;&#1083;&#1082;&#1072; ---------- */
  .reader { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: center; }
  .reader[hidden] { display: none; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.78); }
  .sheet { position: relative; background: var(--sheet); width: min(900px, 100%); max-height: 100%;
           display: flex; flex-direction: column; border: 1px solid var(--edge); }
  @media (min-width: 700px) { .sheet { margin-block: 20px; max-height: calc(100% - 40px); } }

  .sheet-head { position: sticky; top: 0; background: var(--sheet); border-bottom: 1px solid var(--edge);
                padding: 14px 18px 13px; display: flex; flex-direction: column; gap: 11px; z-index: 2; }
  .sheet-head .top { display: flex; align-items: flex-start; gap: 12px; }
  .crumb { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  .crumb i { width: 9px; height: 9px; flex: 0 0 auto; }
  .sheet-head h2 { margin: 7px 0 0; font-size: clamp(17px, 2.1vw, 21px); font-weight: 600; line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
  .x { appearance: none; border: 1px solid var(--edge); background: var(--raise); color: var(--dim);
       width: 32px; height: 32px; font-size: 15px; line-height: 1; cursor: pointer; flex: 0 0 auto; }
  .x:hover { color: var(--ink); border-color: var(--dim); }
  .x:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }
  .head-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .toggle { appearance: none; border: 1px solid var(--edge); background: var(--raise); color: var(--ink);
            font: inherit; font-size: 12.5px; font-weight: 500; padding: 7px 14px; cursor: pointer; }
  .toggle:hover { border-color: var(--dim); }
  .toggle.on { background: var(--tone, #1f6bff); border-color: transparent; color: #000; }
  .toggle:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }
  .pace { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--faint); }

  .sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 22px 18px 30px; }
  .sheet-body > * { max-width: 68ch; }
  .sec { margin-top: 28px; }
  .sec:first-child { margin-top: 0; }
  .sec > h3 { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 500; margin: 0 0 11px; }
  .lead { font-size: 16px; line-height: 1.6; margin: 0; }
  .keylist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 13px; }
  .keylist li { font-size: 15px; line-height: 1.62; padding-left: 16px; position: relative; color: #d6dee8; }
  .keylist li::before { content: ""; position: absolute; left: 0; top: .66em; width: 5px; height: 5px; background: var(--tone, #1f6bff); }
  code { font-family: "IBM Plex Mono", monospace; font-size: .86em; background: #101720; color: #b9e2ff; padding: .13em .4em; }
  pre { margin: 0; background: #05080c; border: 1px solid var(--edge); padding: 13px 15px; overflow-x: auto; }
  pre code { background: none; padding: 0; color: #c8d6e5; font-size: 12.5px; line-height: 1.65; display: block; }
  .code-title { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--faint); margin: 0 0 7px; letter-spacing: .04em; }

  .hw { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .hw li { border: 1px solid var(--edge-soft); background: var(--raise); padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .hw li.done { border-color: var(--tone, #1f6bff); background: #0a0f15; }
  .hw input[type="checkbox"] { appearance: none; width: 18px; height: 18px; flex: 0 0 auto; margin-top: 3px;
      border: 1px solid var(--dim); cursor: pointer; position: relative; background: #05080c; }
  .hw input[type="checkbox"]:checked { background: var(--tone, #1f6bff); border-color: var(--tone, #1f6bff); }
  .hw input[type="checkbox"]:checked::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #000; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .hw input[type="checkbox"]:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }
  .hw .t { font-weight: 600; font-size: 14px; display: block; }
  .hw li.done .t { color: var(--dim); text-decoration: line-through; }
  .hw.tight li { padding: 9px 12px; align-items: center; }
  .hw.tight .t { font-weight: 400; font-size: 14px; cursor: pointer; }
  .hw .d { font-size: 13.5px; margin: 5px 0 0; line-height: 1.55; color: #cbd5e1; }
  .hw .done-c { font-size: 12.5px; color: var(--faint); margin: 6px 0 0; line-height: 1.5; }
  .hw .done-c b { color: var(--dim); font-weight: 500; }

  .q { border: 1px solid var(--edge-soft); padding: 14px; margin-bottom: 9px; }
  .q .qt { font-weight: 500; font-size: 14.5px; margin: 0 0 11px; line-height: 1.5; }
  .q pre { margin-bottom: 11px; }
  .opts { display: flex; flex-direction: column; gap: 5px; }
  .opt { appearance: none; text-align: left; border: 1px solid var(--edge-soft); background: var(--raise); color: var(--ink);
         font: inherit; font-size: 13.5px; line-height: 1.45; padding: 9px 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
  .opt:hover:not(:disabled) { border-color: var(--dim); }
  .opt:disabled { cursor: default; }
  .opt .mk { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--faint); flex: 0 0 auto; margin-top: 1px; }
  .opt.correct { border-color: var(--ok); background: #071710; }
  .opt.correct .mk { color: var(--ok); }
  .opt.wrong { border-color: var(--bad); background: #1a0a09; }
  .opt.wrong .mk { color: var(--bad); }
  .opt:focus-visible { outline: 1px solid var(--focus); outline-offset: 1px; }
  .expl { margin: 11px 0 0; font-size: 13px; line-height: 1.6; color: #c3cedb; border-left: 2px solid var(--edge); padding-left: 12px; }
  .expl.ok { border-left-color: var(--ok); }
  .expl.bad { border-left-color: var(--bad); }
  .retry { appearance: none; border: 0; background: none; color: var(--faint); font: inherit; font-size: 12px; cursor: pointer; padding: 8px 0 0; text-decoration: underline; text-underline-offset: 3px; }
  .retry:hover { color: var(--ink); }
  .score { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--faint); margin: 0 0 11px; letter-spacing: .04em; }

  .checklist { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 9px; font-size: 14.5px; line-height: 1.55; color: #d6dee8; }
  .links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .links a { color: var(--focus); font-size: 14px; text-decoration: none; border-bottom: 1px solid transparent; }
  .links a:hover { border-bottom-color: currentColor; }
  .empty { color: var(--dim); font-size: 14.5px; line-height: 1.6; }
  .cta { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px; border: 1px dashed var(--tone, #1f6bff); }
  .cta p { margin: 0; font-size: 13.5px; flex: 1; min-width: 200px; color: #cbd5e1; }

  .sheet-foot { position: sticky; bottom: 0; background: var(--sheet); border-top: 1px solid var(--edge);
                padding: 10px 18px; display: flex; gap: 10px; justify-content: space-between; align-items: center; }
  .navbtn { appearance: none; border: 1px solid var(--edge); background: var(--raise); color: var(--dim);
            font: inherit; font-size: 12px; padding: 7px 11px; cursor: pointer; max-width: 44%;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .navbtn:hover:not(:disabled) { color: var(--ink); border-color: var(--dim); }
  .navbtn:disabled { opacity: .35; cursor: default; }
  .navbtn:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }
  .foot-hint { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--faint); text-align: center; flex: 1; letter-spacing: .06em; }
  @media (max-width: 560px) { .foot-hint { display: none; } }
</style>

<script>
(function () {
  const CONTENT = {"w1-asyncio": {"why": "\u042d\u0442\u043e \u043f\u0435\u0440\u0432\u044b\u0439 \u0432\u043e\u043f\u0440\u043e\u0441 \u043f\u043e\u0447\u0442\u0438 \u043d\u0430 \u043b\u044e\u0431\u043e\u043c Python-\u0441\u043e\u0431\u0435\u0441\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0438 \u0443\u0440\u043e\u0432\u043d\u044f middle+, \u0438 \u043f\u0435\u0440\u0432\u043e\u0435 \u043c\u0435\u0441\u0442\u043e, \u0433\u0434\u0435 \u043f\u0430\u0434\u0430\u0435\u0442 \u043f\u0440\u043e\u0434: \u043e\u0434\u043d\u0430 \u0431\u043b\u043e\u043a\u0438\u0440\u0443\u044e\u0449\u0430\u044f \u0441\u0442\u0440\u043e\u043a\u0430 \u043e\u0441\u0442\u0430\u043d\u0430\u0432\u043b\u0438\u0432\u0430\u0435\u0442 \u0432\u0435\u0441\u044c \u0441\u0435\u0440\u0432\u0438\u0441.", "key": ["Event loop \u044d\u0442\u043e \u043e\u0431\u044b\u0447\u043d\u044b\u0439 \u0446\u0438\u043a\u043b: \u0432\u044b\u043f\u043e\u043b\u043d\u0438\u0442\u044c \u0433\u043e\u0442\u043e\u0432\u044b\u0435 \u043a\u043e\u043b\u0431\u044d\u043a\u0438, \u043e\u043f\u0440\u043e\u0441\u0438\u0442\u044c \u0441\u043e\u043a\u0435\u0442\u044b \u0447\u0435\u0440\u0435\u0437 `selectors`, \u0440\u0430\u0437\u0431\u0443\u0434\u0438\u0442\u044c \u0442\u0430\u0439\u043c\u0435\u0440\u044b. \u041c\u0430\u0433\u0438\u0438 \u043d\u0435\u0442.", "`gather` \u043f\u0440\u0438 \u0438\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0438 \u0432 \u043e\u0434\u043d\u043e\u0439 \u0437\u0430\u0434\u0430\u0447\u0435 \u043d\u0435 \u043e\u0442\u043c\u0435\u043d\u044f\u0435\u0442 \u043e\u0441\u0442\u0430\u043b\u044c\u043d\u044b\u0435, \u043e\u043d\u0438 \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0430\u044e\u0442 \u0440\u0430\u0431\u043e\u0442\u0430\u0442\u044c \u0432 \u0444\u043e\u043d\u0435. `TaskGroup` \u043e\u0442\u043c\u0435\u043d\u044f\u0435\u0442 \u0432\u0441\u0435\u0445 \u0438 \u0441\u043e\u0431\u0438\u0440\u0430\u0435\u0442 \u043e\u0448\u0438\u0431\u043a\u0438 \u0432 `ExceptionGroup`."], "code": {"title": "\u041e\u0433\u0440\u0430\u043d\u0438\u0447\u0435\u043d\u0438\u0435 \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u0438\u0437\u043c\u0430 \u0441\u0435\u043c\u0430\u0444\u043e\u0440\u043e\u043c", "lang": "python", "body": "sem = asyncio.Semaphore(10)\n\nasync def fetch(url: str) -> str:\n    async with sem:\n        async with asyncio.timeout(5):\n            r = await client.get(url)\n            return r.text"}, "hw": [{"t": "\u0424\u0435\u0442\u0447\u0435\u0440 \u0441 \u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0435\u043d\u0438\u044f\u043c\u0438", "d": "\u041d\u0430\u043f\u0438\u0448\u0438 `fetch_all(urls, max_concurrency, timeout_s)` \u043d\u0430 `TaskGroup`, \u0447\u0442\u043e\u0431\u044b \u043e\u0448\u0438\u0431\u043a\u0430 \u043e\u0434\u043d\u043e\u0433\u043e \u0437\u0430\u043f\u0440\u043e\u0441\u0430 \u043d\u0435 \u0440\u043e\u043d\u044f\u043b\u0430 \u043e\u0441\u0442\u0430\u043b\u044c\u043d\u044b\u0435.", "done": "\u0422\u0435\u0441\u0442 \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442, \u0447\u0442\u043e \u043e\u0434\u043d\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u043e \u0432\u0438\u0441\u0438\u0442 \u043d\u0435 \u0431\u043e\u043b\u044c\u0448\u0435 `max_concurrency` \u0437\u0430\u043f\u0440\u043e\u0441\u043e\u0432, \u0430 \u0442\u0430\u0439\u043c\u0430\u0443\u0442 \u043f\u043e\u043f\u0430\u0434\u0430\u0435\u0442 \u0432 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u043a\u0430\u043a \u043e\u0448\u0438\u0431\u043a\u0430."}, {"t": "\u0421\u043b\u043e\u043c\u0430\u0442\u044c \u043e\u0442\u043c\u0435\u043d\u0443", "d": "\u041d\u0430\u043f\u0438\u0448\u0438 \u0437\u0430\u0434\u0430\u0447\u0443, \u043a\u043e\u0442\u043e\u0440\u0430\u044f \u043b\u043e\u0432\u0438\u0442 `except Exception` \u0438 \u043d\u0435 \u0437\u0430\u0432\u0435\u0440\u0448\u0430\u0435\u0442\u0441\u044f \u043f\u043e `cancel()`. \u041e\u0431\u044a\u044f\u0441\u043d\u0438 \u0432 \u043a\u043e\u043c\u043c\u0435\u043d\u0442\u0430\u0440\u0438\u0438, \u043f\u043e\u0447\u0435\u043c\u0443 \u0442\u0430\u043a \u0432\u044b\u0448\u043b\u043e.", "done": "\u0422\u0435\u0441\u0442 \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442, \u0447\u0442\u043e \u0437\u0430\u0434\u0430\u0447\u0430 \u043f\u0435\u0440\u0435\u0436\u0438\u043b\u0430 \u043e\u0442\u043c\u0435\u043d\u0443, \u0438 \u043a\u043e\u043c\u043c\u0435\u043d\u0442\u0430\u0440\u0438\u0439 \u043d\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u043f\u0440\u0438\u0447\u0438\u043d\u0443."}], "check": ["\u0427\u0442\u043e \u043f\u0440\u043e\u0438\u0437\u043e\u0439\u0434\u0451\u0442 \u0441 \u043e\u0441\u0442\u0430\u043b\u044c\u043d\u044b\u043c\u0438 \u0437\u0430\u0434\u0430\u0447\u0430\u043c\u0438 `gather`, \u0435\u0441\u043b\u0438 \u043f\u0435\u0440\u0432\u0430\u044f \u0443\u043f\u0430\u0434\u0451\u0442?", "\u041f\u043e\u0447\u0435\u043c\u0443 `task.cancel()` \u043d\u0435 \u0433\u0430\u0440\u0430\u043d\u0442\u0438\u0440\u0443\u0435\u0442 \u043d\u0435\u043c\u0435\u0434\u043b\u0435\u043d\u043d\u0443\u044e \u043e\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0443?"], "quiz": [{"q": "\u0427\u0442\u043e \u0432\u044b\u0432\u0435\u0434\u0435\u0442 \u044d\u0442\u043e\u0442 \u043a\u043e\u0434?", "code": "async with asyncio.TaskGroup() as tg:\n    tg.create_task(boom())   # \u0431\u0440\u043e\u0441\u0430\u0435\u0442 ValueError\n    tg.create_task(slow())   # \u0441\u043f\u0438\u0442 10 \u0441\u0435\u043a\u0443\u043d\u0434", "a": ["\u0421\u043a\u0440\u0438\u043f\u0442 \u043f\u043e\u0434\u043e\u0436\u0434\u0451\u0442 10 \u0441\u0435\u043a\u0443\u043d\u0434, \u0437\u0430\u0442\u0435\u043c \u043f\u043e\u0434\u043d\u0438\u043c\u0435\u0442 ValueError", "slow() \u0431\u0443\u0434\u0435\u0442 \u043e\u0442\u043c\u0435\u043d\u0435\u043d\u0430, \u043f\u043e\u0434\u043d\u0438\u043c\u0435\u0442\u0441\u044f ExceptionGroup \u0441 ValueError", "ValueError \u0431\u0443\u0434\u0435\u0442 \u043f\u0440\u043e\u0433\u043b\u043e\u0447\u0435\u043d, slow() \u0434\u043e\u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442", "\u041e\u0431\u0435 \u0437\u0430\u0434\u0430\u0447\u0438 \u0434\u043e\u0440\u0430\u0431\u043e\u0442\u0430\u044e\u0442, \u043e\u0448\u0438\u0431\u043a\u0430 \u043f\u043e\u043f\u0430\u0434\u0451\u0442 \u0432 \u043b\u043e\u0433\u0438"], "c": 1, "e": "TaskGroup \u0440\u0435\u0430\u043b\u0438\u0437\u0443\u0435\u0442 structured concurrency: \u043f\u0440\u0438 \u0438\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0438 \u0432 \u043e\u0434\u043d\u043e\u0439 \u0437\u0430\u0434\u0430\u0447\u0435 \u043e\u0441\u0442\u0430\u043b\u044c\u043d\u044b\u0435 \u043e\u0442\u043c\u0435\u043d\u044f\u044e\u0442\u0441\u044f, \u0430 \u043e\u0448\u0438\u0431\u043a\u0438 \u0441\u043e\u0431\u0438\u0440\u0430\u044e\u0442\u0441\u044f \u0432 ExceptionGroup. \u041f\u0435\u0440\u0432\u044b\u0439 \u0432\u0430\u0440\u0438\u0430\u043d\u0442 \u043e\u043f\u0438\u0441\u044b\u0432\u0430\u0435\u0442 \u043f\u043e\u0432\u0435\u0434\u0435\u043d\u0438\u0435 gather \u0431\u0435\u0437 return_exceptions, \u0433\u0434\u0435 \u043e\u0441\u0442\u0430\u043b\u044c\u043d\u044b\u0435 \u0437\u0430\u0434\u0430\u0447\u0438 \u043d\u0435 \u043e\u0442\u043c\u0435\u043d\u044f\u044e\u0442\u0441\u044f."}], "links": [{"t": "asyncio: coroutines and tasks", "u": "https://docs.python.org/3/library/asyncio-task.html"}]}, "w4-project": {"why": "\u0417\u0434\u0435\u0441\u044c \u0441\u0445\u043e\u0434\u044f\u0442\u0441\u044f RAG (\u043d\u0435\u0434\u0435\u043b\u0438 1-2), production API (\u043d\u0435\u0434\u0435\u043b\u044f 3) \u0438 \u0430\u0433\u0435\u043d\u0442\u043d\u044b\u0439 \u0446\u0438\u043a\u043b \u044d\u0442\u043e\u0439 \u043d\u0435\u0434\u0435\u043b\u0438 - \u043d\u0430 \u0441\u043e\u0431\u0435\u0441\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0438 senior+ \u043f\u0440\u043e\u0441\u044f\u0442 \u043d\u0435 '\u0440\u0430\u0441\u0441\u043a\u0430\u0436\u0438 \u043f\u0440\u043e \u0430\u0433\u0435\u043d\u0442\u043e\u0432', \u0430 '\u0441\u043f\u0440\u043e\u0435\u043a\u0442\u0438\u0440\u0443\u0439 \u0430\u0433\u0435\u043d\u0442\u0430 \u0441 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430\u043c\u0438 \u043f\u043e\u0432\u0435\u0440\u0445 \u0441\u0438\u0441\u0442\u0435\u043c\u044b', \u0438 \u044d\u0442\u043e \u0440\u043e\u0432\u043d\u043e \u0442\u0430 \u0437\u0430\u0434\u0430\u0447\u0430. \u0412 \u043f\u0440\u043e\u0434\u0435 \u0437\u0434\u0435\u0441\u044c \u0447\u0430\u0449\u0435 \u0432\u0441\u0435\u0433\u043e \u043b\u043e\u043c\u0430\u0435\u0442\u0441\u044f \u043d\u0430\u0431\u043b\u044e\u0434\u0430\u0435\u043c\u043e\u0441\u0442\u044c: \u0431\u0435\u0437 \u0441\u0442\u0440\u0438\u043c\u0438\u043d\u0433\u0430 \u0448\u0430\u0433\u043e\u0432 \u0430\u0433\u0435\u043d\u0442\u0430 \u044e\u0437\u0435\u0440 15 \u0441\u0435\u043a\u0443\u043d\u0434 \u0441\u043c\u043e\u0442\u0440\u0438\u0442 \u043d\u0430 \u0441\u043f\u0438\u043d\u043d\u0435\u0440, \u0430 \u0440\u0430\u0437\u0440\u0430\u0431\u043e\u0442\u0447\u0438\u043a \u0431\u0435\u0437 \u043b\u043e\u0433\u043e\u0432 \u043d\u0435 \u043f\u043e\u043d\u0438\u043c\u0430\u0435\u0442, \u043f\u043e\u0447\u0435\u043c\u0443 \u0430\u0433\u0435\u043d\u0442 \u0432\u044b\u0431\u0440\u0430\u043b \u043d\u0435 \u0442\u043e\u0442 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442.", "key": ["\u0427\u0435\u0442\u044b\u0440\u0435 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 \u043f\u043e\u0432\u0435\u0440\u0445 \u0442\u0432\u043e\u0435\u0433\u043e RAG: search_docs (\u043f\u043e\u0438\u0441\u043a \u043f\u043e pgvector \u0438\u0437 \u043d\u0435\u0434\u0435\u043b\u0438 2), web_search (\u0437\u0430\u0433\u043b\u0443\u0448\u043a\u0430 \u0438\u043b\u0438 \u0440\u0435\u0430\u043b\u044c\u043d\u044b\u0439 API), calculator (\u0431\u0435\u0437\u043e\u043f\u0430\u0441\u043d\u043e\u0435 \u0432\u044b\u0447\u0438\u0441\u043b\u0435\u043d\u0438\u0435 \u0432\u044b\u0440\u0430\u0436\u0435\u043d\u0438\u0439, \u043d\u0435 eval()), create_task (\u0437\u0430\u043f\u0438\u0441\u044c \u0432 \u0411\u0414). \u041a\u0430\u0436\u0434\u044b\u0439 - \u043e\u0431\u044b\u0447\u043d\u0430\u044f Python-\u0444\u0443\u043d\u043a\u0446\u0438\u044f plus JSON Schema \u0435\u0451 \u0430\u0440\u0433\u0443\u043c\u0435\u043d\u0442\u043e\u0432.", "\u042d\u043d\u0434\u043f\u043e\u0438\u043d\u0442 `/agent/chat` \u043d\u0435 \u0436\u0434\u0451\u0442 \u0444\u0438\u043d\u0430\u043b\u044c\u043d\u044b\u0439 \u043e\u0442\u0432\u0435\u0442 \u0430\u0433\u0435\u043d\u0442\u0430 \u0446\u0435\u043b\u0438\u043a\u043e\u043c: \u043e\u043d \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442 `StreamingResponse` \u0441 `media_type=\"text/event-stream\"`, \u0430 \u0441\u0430\u043c \u0446\u0438\u043a\u043b \u0430\u0433\u0435\u043d\u0442\u0430 - \u044d\u0442\u043e `async def` \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0447\u0435\u0440\u0435\u0437 `yield` \u043e\u0442\u0434\u0430\u0451\u0442 \u0441\u043e\u0431\u044b\u0442\u0438\u044f \u043f\u043e \u043c\u0435\u0440\u0435 \u0432\u044b\u0437\u043e\u0432\u043e\u0432 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432.", "\u0421\u043e\u0431\u044b\u0442\u0438\u0435 - \u044d\u0442\u043e \u043d\u0435 \u0442\u043e\u043a\u0435\u043d \u043e\u0442\u0432\u0435\u0442\u0430. \u041d\u0443\u0436\u043d\u043e \u043c\u0438\u043d\u0438\u043c\u0443\u043c 4 \u0442\u0438\u043f\u0430: `tool_call` (\u0430\u0433\u0435\u043d\u0442 \u0440\u0435\u0448\u0438\u043b \u0432\u044b\u0437\u0432\u0430\u0442\u044c \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442), `tool_result` (\u043f\u0440\u0438\u0448\u0451\u043b \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442), `token` (\u043a\u0443\u0441\u043e\u043a \u0444\u0438\u043d\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0442\u0435\u043a\u0441\u0442\u0430), `done`. \u0424\u0440\u043e\u043d\u0442\u0435\u043d\u0434 \u0440\u0438\u0441\u0443\u0435\u0442 \u043f\u043e \u043d\u0438\u043c '\u0430\u0433\u0435\u043d\u0442 \u0438\u0449\u0435\u0442 \u0432 \u0431\u0430\u0437\u0435...' \u0432\u043c\u0435\u0441\u0442\u043e \u0433\u043e\u043b\u043e\u0433\u043e \u0441\u043f\u0438\u043d\u043d\u0435\u0440\u0430.", "\u0416\u0451\u0441\u0442\u043a\u0438\u0439 `max_iterations` \u0432 \u0446\u0438\u043a\u043b\u0435 (\u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440 8) - \u043d\u0435 \u043e\u043f\u0442\u0438\u043c\u0438\u0437\u0430\u0446\u0438\u044f, \u0430 \u0437\u0430\u0449\u0438\u0442\u0430 \u043e\u0442 \u0441\u0447\u0451\u0442\u0430 \u0437\u0430 \u0442\u043e\u043a\u0435\u043d\u044b: \u0431\u0435\u0437 \u043d\u0435\u0433\u043e \u0430\u0433\u0435\u043d\u0442, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u043f\u0443\u0442\u0430\u0435\u0442 \u0430\u0440\u0433\u0443\u043c\u0435\u043d\u0442\u044b \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430, \u0431\u0443\u0434\u0435\u0442 \u0434\u043e\u043b\u0431\u0438\u0442\u044c LLM API, \u043f\u043e\u043a\u0430 \u043d\u0435 \u043a\u043e\u043d\u0447\u0438\u0442\u0441\u044f \u0431\u044e\u0434\u0436\u0435\u0442 \u0438\u043b\u0438 \u0442\u0430\u0439\u043c\u0430\u0443\u0442 gateway.", "\u041e\u0442\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435 \u043a\u043b\u0438\u0435\u043d\u0442\u0430 (`await request.is_disconnected()`) \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u044e\u0442 \u043c\u0435\u0436\u0434\u0443 \u0448\u0430\u0433\u0430\u043c\u0438 \u0446\u0438\u043a\u043b\u0430, \u0430 \u043d\u0435 \u0432\u043d\u0443\u0442\u0440\u0438 \u0432\u044b\u0437\u043e\u0432\u0430 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430: \u043e\u0431\u043e\u0440\u0432\u0430\u043d\u043d\u044b\u0439 SSE \u043d\u0435 \u0434\u043e\u043b\u0436\u0435\u043d \u043e\u0431\u0440\u044b\u0432\u0430\u0442\u044c \u0443\u0436\u0435 \u043d\u0430\u0447\u0430\u0432\u0448\u0438\u0439\u0441\u044f tool call \u043d\u0430 \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0435 (\u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440, \u043d\u0435\u0437\u0430\u043a\u043e\u043c\u043c\u0438\u0447\u0435\u043d\u043d\u0443\u044e \u0437\u0430\u043f\u0438\u0441\u044c \u0432 \u0411\u0414), \u043d\u043e \u0434\u043e\u043b\u0436\u0435\u043d \u043e\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0443\u044e \u0438\u0442\u0435\u0440\u0430\u0446\u0438\u044e.", "\u041e\u0448\u0438\u0431\u043a\u0430 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 - \u044d\u0442\u043e data, \u043d\u0435 exception: search_docs, \u0443\u043f\u0430\u0432\u0448\u0438\u0439 \u043f\u043e \u0442\u0430\u0439\u043c\u0430\u0443\u0442\u0443 \u043a Postgres, \u0434\u043e\u043b\u0436\u0435\u043d \u0432\u0435\u0440\u043d\u0443\u0442\u044c `tool_result` \u0441 \u043f\u043e\u043b\u0435\u043c error, \u0430 \u043d\u0435 \u0443\u0440\u043e\u043d\u0438\u0442\u044c \u0432\u0435\u0441\u044c HTTP-\u0437\u0430\u043f\u0440\u043e\u0441 500-\u0439 - \u0443 \u0430\u0433\u0435\u043d\u0442\u0430 \u0434\u043e\u043b\u0436\u0435\u043d \u0431\u044b\u0442\u044c \u0448\u0430\u043d\u0441 \u043f\u043e\u043f\u0440\u043e\u0431\u043e\u0432\u0430\u0442\u044c \u0438\u043d\u0430\u0447\u0435 \u0438\u043b\u0438 \u0447\u0435\u0441\u0442\u043d\u043e \u0441\u043a\u0430\u0437\u0430\u0442\u044c '\u043d\u0435 \u0441\u043c\u043e\u0433'.", "\u0422\u0440\u0435\u0439\u0441\u0438\u043d\u0433 \u043f\u043e turn_id \u043d\u0430 \u043a\u0430\u0436\u0434\u044b\u0439 tool call - \u0431\u0435\u0437 \u043d\u0435\u0433\u043e \u043e\u0442\u043b\u0430\u0434\u043a\u0430 '\u043f\u043e\u0447\u0435\u043c\u0443 \u0430\u0433\u0435\u043d\u0442 \u0442\u0440\u0438 \u0440\u0430\u0437\u0430 \u0434\u0451\u0440\u043d\u0443\u043b \u043e\u0434\u043d\u0443 \u0438 \u0442\u0443 \u0436\u0435 \u0444\u0443\u043d\u043a\u0446\u0438\u044e' \u0437\u0430\u043d\u0438\u043c\u0430\u0435\u0442 \u0447\u0430\u0441\u044b \u0432\u043c\u0435\u0441\u0442\u043e \u043c\u0438\u043d\u0443\u0442; \u0442\u043e\u0442 \u0436\u0435 \u043f\u0440\u0438\u043d\u0446\u0438\u043f, \u0447\u0442\u043e structured logging \u0438\u0437 \u043d\u0435\u0434\u0435\u043b\u0438 3, \u043f\u0440\u043e\u0441\u0442\u043e \u043d\u0430 \u0443\u0440\u043e\u0432\u043d\u0435 \u0448\u0430\u0433\u043e\u0432 \u0430\u0433\u0435\u043d\u0442\u0430, \u0430 \u043d\u0435 HTTP-\u0437\u0430\u043f\u0440\u043e\u0441\u043e\u0432."], "code": {"title": "SSE-\u044d\u043d\u0434\u043f\u043e\u0438\u043d\u0442 \u0441\u043e \u0441\u0442\u0440\u0438\u043c\u0438\u043d\u0433\u043e\u043c \u0441\u043e\u0431\u044b\u0442\u0438\u0439 \u0430\u0433\u0435\u043d\u0442\u0430", "lang": "python", "body": "from fastapi import FastAPI, Request\nfrom fastapi.responses import StreamingResponse\nimport json\n\napp = FastAPI()\n\n@app.post(\"/agent/chat\")\nasync def agent_chat(body: ChatRequest, request: Request):\n    async def events():\n        async for ev in run_agent(body.message, tools=TOOLS, max_iters=8):\n            if await request.is_disconnected():\n                break\n            yield f\"data: {json.dumps(ev)}\\n\\n\"\n        yield \"data: [DONE]\\n\\n\"\n    return StreamingResponse(events(), media_type=\"text/event-stream\")\n"}, "hw": [{"t": "4 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 \u0441 JSON Schema", "d": "\u0412 project/agent/tools.py \u0440\u0435\u0430\u043b\u0438\u0437\u043e\u0432\u0430\u0442\u044c 4 \u0444\u0443\u043d\u043a\u0446\u0438\u0438: search_docs \u0447\u0435\u0440\u0435\u0437 pgvector-\u043f\u043e\u0438\u0441\u043a \u0438\u0437 \u043d\u0435\u0434\u0435\u043b\u0438 2, web_search-\u0437\u0430\u0433\u043b\u0443\u0448\u043a\u0443, calculator \u0431\u0435\u0437 eval() \u0447\u0435\u0440\u0435\u0437 ast, create_task, \u043f\u0438\u0448\u0443\u0449\u0438\u0439 \u0441\u0442\u0440\u043e\u043a\u0443 \u0432 \u0442\u0430\u0431\u043b\u0438\u0446\u0443. \u0414\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0439 - \u0441\u043b\u043e\u0432\u0430\u0440\u044c input_schema \u0432 \u0444\u043e\u0440\u043c\u0430\u0442\u0435 JSON Schema.", "done": "python -c \"from agent.tools import TOOLS; import json; print(json.dumps(TOOLS, indent=2))\" \u043f\u0435\u0447\u0430\u0442\u0430\u0435\u0442 4 \u0432\u0430\u043b\u0438\u0434\u043d\u044b\u0435 \u0441\u0445\u0435\u043c\u044b, \u043a\u0430\u0436\u0434\u0430\u044f \u0444\u0443\u043d\u043a\u0446\u0438\u044f \u043f\u043e\u043a\u0440\u044b\u0442\u0430 \u043c\u0438\u043d\u0438\u043c\u0443\u043c \u043e\u0434\u043d\u0438\u043c unit-\u0442\u0435\u0441\u0442\u043e\u043c \u043d\u0430 happy path \u0438 \u043d\u0430 \u043e\u0448\u0438\u0431\u043a\u0443."}, {"t": "\u0410\u0433\u0435\u043d\u0442-\u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440 \u0441\u043e\u0431\u044b\u0442\u0438\u0439", "d": "\u041e\u0431\u0435\u0440\u043d\u0443\u0442\u044c \u0446\u0438\u043a\u043b \u0430\u0433\u0435\u043d\u0442\u0430 \u0438\u0437 w4-fc \u0432 async def run_agent(...) -> AsyncIterator[dict], \u043a\u043e\u0442\u043e\u0440\u044b\u0439 yield-\u0438\u0442 \u0441\u043e\u0431\u044b\u0442\u0438\u044f tool_call/tool_result/token/done, \u0441 max_iterations.", "done": "\u0422\u0435\u0441\u0442 \u0441 mock LLM-\u043a\u043b\u0438\u0435\u043d\u0442\u043e\u043c (\u0431\u0435\u0437 \u0440\u0435\u0430\u043b\u044c\u043d\u043e\u0433\u043e API) \u043f\u0440\u043e\u0433\u043e\u043d\u044f\u0435\u0442 \u0441\u0446\u0435\u043d\u0430\u0440\u0438\u0439 \u0438\u0437 3 \u0448\u0430\u0433\u043e\u0432 \u0438 \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442 \u0442\u043e\u0447\u043d\u0443\u044e \u043f\u043e\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c \u0442\u0438\u043f\u043e\u0432 \u0441\u043e\u0431\u044b\u0442\u0438\u0439."}, {"t": "SSE-\u044d\u043d\u0434\u043f\u043e\u0438\u043d\u0442 /agent/chat", "d": "FastAPI-\u044d\u043d\u0434\u043f\u043e\u0438\u043d\u0442, \u043e\u0442\u0434\u0430\u044e\u0449\u0438\u0439 run_agent \u043a\u0430\u043a text/event-stream, \u0441 \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u043e\u0439 request.is_disconnected() \u043c\u0435\u0436\u0434\u0443 \u0448\u0430\u0433\u0430\u043c\u0438 \u0446\u0438\u043a\u043b\u0430.", "done": "curl -N \u043a \u044d\u043d\u0434\u043f\u043e\u0438\u043d\u0442\u0443 \u043f\ 3\u0440\u043e\u0432\u043d\u044f '\u043f\u0440\u0438\u0448\u0451\u043b \u0442\u043e\u043a\u0435\u043d \u043e\u0442\u0432\u0435\u0442\u0430'? \u0417\u0430\u0447\u0435\u043c \u043a\u043b\u0438\u0435\u043d\u0442\u0443 \u043e\u0431\u0430?", "\u041f\u043e\u0447\u0435\u043c\u0443 max_iterations - \u044d\u0442\u043e \u043d\u0435 \u043a\u043e\u0441\u0442\u044b\u043b\u044c, \u0430 \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u0447\u0430\u0441\u0442\u044c \u0430\u0440\u0445\u0438\u0442\u0435\u043a\u0442\u0443\u0440\u044b \u043b\u044e\u0431\u043e\u0433\u043e production-\u0430\u0433\u0435\u043d\u0442\u0430?", "\u0427\u0442\u043e \u0434\u043e\u043b\u0436\u043d\u043e \u043f\u0440\u043e\u0438\u0437\u043e\u0439\u0442\u0438 \u0441 \u0443\u0436\u0435 \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u044e\u0449\u0438\u043c\u0441\u044f tool call, \u0435\u0441\u043b\u0438 \u043a\u043b\u0438\u0435\u043d\u0442 \u0440\u0430\u0437\u043e\u0440\u0432\u0430\u043b SSE-\u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u0435 \u043d\u0430 \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0435 \u0448\u0430\u0433\u0430?", "\u041a\u0430\u043a \u0442\u044b \u0431\u0443\u0434\u0435\u0448\u044c \u043e\u0442\u043b\u0438\u0447\u0430\u0442\u044c \u0432 \u043b\u043e\u0433\u0430\u0445 '\u0430\u0433\u0435\u043d\u0442 \u043d\u0435 \u043d\u0430\u0448\u0451\u043b \u043e\u0442\u0432\u0435\u0442 \u0432 \u0431\u0430\u0437\u0435' \u043e\u0442 '\u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u0443\u043f\u0430\u043b \u0441 \u043e\u0448\u0438\u0431\u043a\u043e\u0439'? \u041f\u043e\u0447\u0435\u043c\u0443 \u044d\u0442\u043e \u0440\u0430\u0437\u043d\u044b\u0435 \u0432\u0435\u0442\u043a\u0438?", "\u041f\u043e\u0447\u0435\u043c\u0443 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0439 tool_result \u0441 \u043f\u043e\u043b\u0435\u043c error \u043b\u0443\u0447\u0448\u0435, \u0447\u0435\u043c \u0438\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435, \u0432\u0441\u043f\u043b\u044b\u0432\u0430\u044e\u0449\u0435\u0435 \u0434\u043e \u0443\u0440\u043e\u0432\u043d\u044f HTTP-\u043e\u0431\u0440\u0430\u0431\u043e\u0442\u0447\u0438\u043a\u0430?"], "quiz": [{"q": "\u041a\u043b\u0438\u0435\u043d\u0442 \u0437\u0430\u043a\u0440\u044b\u043b \u0432\u043a\u043b\u0430\u0434\u043a\u0443 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0430, \u043f\u043e\u043a\u0430 \u0430\u0433\u0435\u043d\u0442 \u0432\u043d\u0443\u0442\u0440\u0438 /agent/chat \u0436\u0434\u0430\u043b \u043e\u0442\u0432\u0435\u0442\u0430 \u043e\u0442 search_docs (\u0437\u0430\u043f\u0440\u043e\u0441 \u043a \u0411\u0414 \u0443\u0436\u0435 \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u0435\u0442\u0441\u044f). \u0427\u0442\u043e \u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u043e \u0441\u0434\u0435\u043b\u0430\u0442\u044c?", "a": ["\u041d\u0435\u043c\u0435\u0434\u043b\u0435\u043d\u043d\u043e \u043e\u0442\u043c\u0435\u043d\u0438\u0442\u044c \u0442\u0435\u043a\u0443\u0449\u0438\u0439 await \u043d\u0430 tool call, \u0447\u0442\u043e\u0431\u044b \u043d\u0435 \u0442\u0440\u0430\u0442\u0438\u0442\u044c \u0440\u0435\u0441\u0443\u0440\u0441\u044b", "\u0414\u0430\u0442\u044c \u0442\u0435\u043a\u0443\u0449\u0435\u043c\u0443 tool call \u0434\u043e\u0438\u0433\u0440\u0430\u0442\u044c \u0434\u043e \u043a\u043e\u043d\u0446\u0430 (\u043e\u043d \u0443\u0436\u0435 \u0441\u0442\u0430\u0440\u0442\u043e\u0432\u0430\u043b), \u043d\u043e \u043d\u0435 \u043d\u0430\u0447\u0438\u043d\u0430\u0442\u044c \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0443\u044e \u0438\u0442\u0435\u0440\u0430\u0446\u0438\u044e \u0446\u0438\u043a\u043b\u0430 \u0438 \u0437\u0430\u043a\u0440\u044b\u0442\u044c \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440", "\u0418\u0433\u043d\u043e\u0440\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u043e\u0442\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435 \u0438 \u0434\u043e\u0441\u0447\u0438\u0442\u0430\u0442\u044c \u0432\u0435\u0441\u044c \u0434\u0438\u0430\u043b\u043e\u0433 \u0430\u0433\u0435\u043d\u0442\u0430 \u0434\u043e \u043a\u043e\u043d\u0446\u0430, \u043a\u0430\u043a \u0431\u0443\u0434\u0442\u043e \u043a\u043b\u0438\u0435\u043d\u0442 \u043d\u0430 \u0441\u0432\u044f\u0437\u0438", "\u041f\u0435\u0440\u0435\u0437\u0430\u043f\u0443\u0441\u0442\u0438\u0442\u044c \u0446\u0438\u043a\u043b \u0430\u0433\u0435\u043d\u0442\u0430 \u0441 \u043d\u0430\u0447\u0430\u043b\u0430 \u043f\u0440\u0438 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u043c \u0437\u0430\u043f\u0440\u043e\u0441\u0435 \u0442\u043e\u0433\u043e \u0436\u0435 \u043a\u043b\u0438\u0435\u043d\u0442\u0430"], "c": 1, "e": "\u041e\u0442\u043c\u0435\u043d\u044f\u0442\u044c \u0443\u0436\u0435 \u0441\u0442\u0430\u0440\u0442\u043e\u0432\u0430\u0432\u0448\u0438\u0439 side-effect (\u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440, \u0437\u0430\u043f\u0438\u0441\u044c \u0432 \u0411\u0414 \u0432\u043d\u0443\u0442\u0440\u0438 tool) \u043e\u043f\u0430\u0441\u043d\u043e - \u043c\u043e\u0436\u043d\u043e \u043e\u0441\u0442\u0430\u0432\u0438\u0442\u044c \u0441\u0438\u0441\u0442\u0435\u043c\u0443 \u0432 \u043d\u0435\u043a\u043e\u043d\u0441\u0438\u0441\u0442\u0435\u043d\u0442\u043d\u043e\u043c \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u0438. \u041f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u043e - \u0434\u0430\u0442\u044c \u0442\u0435\u043a\u0443\u0449\u0435\u043c\u0443 \u0448\u0430\u0433\u0443 \u0437\u0430\u0432\u0435\u0440\u0448\u0438\u0442\u044c\u0441\u044f, \u0430 \u0440\u0435\u0448\u0435\u043d\u0438\u0435 '\u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0430\u0442\u044c \u043b\u0438 \u0446\u0438\u043a\u043b' \u043f\u0440\u0438\u043d\u0438\u043c\u0430\u0442\u044c \u043f\u0435\u0440\u0435\u0434 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u0439 \u0438\u0442\u0435\u0440\u0430\u0446\u0438\u0435\u0439. \u041d\u0435\u043c\u0435\u0434\u043b\u0435\u043d\u043d\u0430\u044f \u043e\u0442\u043c\u0435\u043d\u0430 \u0440\u0438\u0441\u043a\u0443\u0435\u0442 \u0433\u043e\u043d\u043a\u043e\u0439 \u043c\u0435\u0436\u0434\u0443 cancel \u0438 \u0437\u0430\u043f\u0438\u0441\u044c\u044e \u0432 \u0411\u0414, \u0430 \u0438\u0433\u043d\u043e\u0440\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u043e\u0442\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u044f \u0432\u043f\u0443\u0441\u0442\u0443\u044e \u0442\u0440\u0430\u0442\u0438\u0442 \u0442\u043e\u043a\u0435\u043d\u044b \u043d\u0430 \u0443\u0436\u0435 \u043d\u0438\u043a\u043e\u043c\u0443 \u043d\u0435 \u043d\u0443\u0436\u043d\u044b\u0439 \u043e\u0442\u0432\u0435\u0442."}, {"q": "\u0417\u0430\u0447\u0435\u043c \u0432 \u0446\u0438\u043a\u043b\u0435 \u0430\u0433\u0435\u043d\u0442\u0430 \u043f\u043e\u0432\u0435\u0440\u0445 RAG \u043d\u0443\u0436\u0435\u043d \u0438\u043c\u0435\u043d\u043d\u043e max_iterations, \u0430 \u043d\u0435 \u0442\u043e\u043b\u044c\u043a\u043e \u044f\u0432\u043d\u044b\u0439 '\u0441\u0442\u043e\u043f-\u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442' \u0432\u0440\u043e\u0434\u0435 final_answer?", "a": ["max_iterations \u043d\u0435 \u043d\u0443\u0436\u0435\u043d, \u0435\u0441\u043b\u0438 \u0443 \u043c\u043e\u0434\u0435\u043b\u0438 \u0435\u0441\u0442\u044c \u044f\u0432\u043d\u044b\u0439 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u0434\u043b\u044f \u0444\u0438\u043d\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u043e\u0442\u0432\u0435\u0442\u0430", "\u041c\u043e\u0434\u0435\u043b\u044c \u043c\u043e\u0436\u0435\u0442 \u043d\u0435 \u0432\u044b\u0437\u0432\u0430\u0442\u044c \u0444\u0438\u043d\u0430\u043b\u044c\u043d\u044b\u0439 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u0432\u043e\u0432\u0441\u0435 (\u043e\u0448\u0438\u0431\u043b\u0430\u0441\u044c, \u0437\u0430\u0446\u0438\u043a\u043b\u0438\u043b\u0430\u0441\u044c \u043d\u0430 \u043f\u0430\u0440\u0435 \u0434\u0440\u0443\u0433\u0438\u0445 \u0432\u044b\u0437\u043e\u0432\u043e\u0432) - \u0431\u0435\u0437 \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e\u0433\u043e \u043f\u043e\u0442\u043e\u043b\u043a\u0430 \u0438\u0442\u0435\u0440\u0430\u0446\u0438\u0439 \u044d\u0442\u043e \u043d\u0438\u0447\u0435\u043c \u043d\u0435 \u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0435\u043d\u043e \u043f\u043e \u0434\u0435\u043d\u044c\u0433\u0430\u043c \u0438 \u0432\u0440\u0435\u043c\u0435\u043d\u0438", "max_iterations \u043d\u0443\u0436\u0435\u043d \u0442\u043e\u043b\u044c\u043a\u043e \u0434\u043b\u044f \u043b\u043e\u043a\u0430\u043b\u044c\u043d\u044b\u0445 \u043c\u043e\u0434\u0435\u043b\u0435\u0439, \u0443 OpenAI \u0438 Anthropic API \u0435\u0441\u0442\u044c \u0432\u0441\u0442\u0440\u043e\u0435\u043d\u043d\u044b\u0439 \u043b\u0438\u043c\u0438\u0442 \u043d\u0430 \u0447\u0438\u0441\u043b\u043e tool calls \u0432 \u0434\u0438\u0430\u043b\u043e\u0433\u0435", "\u042d\u0442\u043e \u043d\u0443\u0436\u043d\u043e \u0438\u0441\u043a\u043b\u044e\u0447\u0438\u0442\u0435\u043b\u044c\u043d\u043e \u0447\u0442\u043e\u0431\u044b \u0443\u043b\u043e\u0436\u0438\u0442\u044c\u0441\u044f \u0432 \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442\u043d\u043e\u0435 \u043e\u043a\u043d\u043e \u043c\u043e\u0434\u0435\u043b\u0438"], "c": 1, "e": "'\u0421\u0442\u043e\u043f-\u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442' - \u044d\u0442\u043e \u0441\u043e\u0433\u043b\u0430\u0448\u0435\u043d\u0438\u0435, \u043a\u043e\u0442\u043e\u0440\u043e\u0435 \u043c\u043e\u0434\u0435\u043b\u044c \u043c\u043e\u0436\u0435\u0442 \u043d\u0435 \u0441\u043e\u0431\u043b\u044e\u0441\u0442\u0438. \u0412\u043d\u0435\u0448\u043d\u0438\u0439 \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u044b\u0439 \u043f\u0440\u0435\u0434\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u0435\u043b\u044c \u043d\u0443\u0436\u0435\u043d \u0438\u043c\u0435\u043d\u043d\u043e \u043f\u043e\u0442\u043e\u043c\u0443, \u0447\u0442\u043e \u043d\u0435\u043b\u044c\u0437\u044f \u043f\u043e\u043b\u0430\u0433\u0430\u0442\u044c\u0441\u044f \u043d\u0430 \u0442\u043e, \u0447\u0442\u043e LLM \u0432\u0441\u0435\u0433\u0434\u0430 \u0434\u043e\u0432\u0435\u0434\u0451\u0442 \u0441\u0435\u0431\u044f \u0434\u043e \u0444\u0438\u043d\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u043e\u0442\u0432\u0435\u0442\u0430. \u0423 API \u043d\u0435\u0442 \u043c\u0430\u0433\u0438\u0447\u0435\u0441\u043a\u043e\u0433\u043e \u043b\u0438\u043c\u0438\u0442\u0430 \u043d\u0430 \u0447\u0438\u0441\u043b\u043e \u0448\u0430\u0433\u043e\u0432 \u0434\u0438\u0430\u043b\u043e\u0433\u0430 - \u044d\u0442\u043e \u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0441\u0442\u044c \u0432\u044b\u0437\u044b\u0432\u0430\u044e\u0449\u0435\u0433\u043e \u043a\u043e\u0434\u0430."}, {"q": "\u0418\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 search_docs \u0443\u043f\u0430\u043b \u0441 TimeoutError \u043f\u0440\u0438 \u043e\u0431\u0440\u0430\u0449\u0435\u043d\u0438\u0438 \u043a Postgres. \u0427\u0442\u043e \u0434\u043e\u043b\u0436\u043d\u043e \u043f\u0440\u043e\u0438\u0437\u043e\u0439\u0442\u0438 \u0441 \u0446\u0438\u043a\u043b\u043e\u043c \u0430\u0433\u0435\u043d\u0442\u0430?", "a": ["\u0418\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435 \u043f\u0440\u043e\u0431\u0440\u0430\u0441\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u043d\u0430\u0432\u0435\u0440\u0445, \u044d\u043d\u0434\u043f\u043e\u0438\u043d\u0442 \u043e\u0442\u0434\u0430\u0451\u0442 500, \u0430\u0433\u0435\u043d\u0442 \u043f\u0440\u0435\u043a\u0440\u0430\u0449\u0430\u0435\u0442 \u0440\u0430\u0431\u043e\u0442\u0443", "\u041e\u0448\u0438\u0431\u043a\u0430 \u043b\u043e\u0433\u0438\u0440\u0443\u0435\u0442\u0441\u044f, \u0430\u0433\u0435\u043d\u0442\u0443 \u043f\u0435\u0440\u0435\u0434\u0430\u0451\u0442\u0441\u044f tool_result \u0441 \u043f\u043e\u043b\u0435\u043c error, \u0438 \u0446\u0438\u043a\u043b \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0430\u0435\u0442\u0441\u044f - \u043c\u043e\u0434\u0435\u043b\u044c \u0432\u0438\u0434\u0438\u0442 \u043e\u0448\u0438\u0431\u043a\u0443 \u0438 \u0440\u0435\u0448\u0430\u0435\u0442, \u0447\u0442\u043e \u0434\u0435\u043b\u0430\u0442\u044c \u0434\u0430\u043b\u044c\u0448\u0435", "\u0418\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u043f\u043e\u0432\u0442\u043e\u0440\u044f\u0435\u0442\u0441\u044f 3 \u0440\u0430\u0437\u0430 \u0431\u0435\u0437 \u0432\u0435\u0434\u043e\u043c\u0430 \u043c\u043e\u0434\u0435\u043b\u0438, \u043e\u0448\u0438\u0431\u043a\u0430 \u043e\u0442 \u043d\u0435\u0451 \u0441\u043a\u0440\u044b\u0432\u0430\u0435\u0442\u0441\u044f", "\u0426\u0438\u043a\u043b \u0430\u0433\u0435\u043d\u0442\u0430 \u043c\u043e\u043b\u0447\u0430 \u0437\u0430\u0432\u0435\u0440\u0448\u0430\u0435\u0442\u0441\u044f \u0441 \u043f\u0443\u0441\u0442\u044b\u043c \u043e\u0442\u0432\u0435\u0442\u043e\u043c \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044e"], "c": 1, "e": "\u041e\u0448\u0438\u0431\u043a\u0430 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 - \u0432\u0430\u043b\u0438\u0434\u043d\u044b\u0439 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u0448\u0430\u0433\u0430, \u0430 \u043d\u0435 \u043f\u043e\u0432\u043e\u0434 \u043f\u0440\u0435\u0440\u044b\u0432\u0430\u0442\u044c \u0432\u0435\u0441\u044c HTTP-\u0437\u0430\u043f\u0440\u043e\u0441: \u043c\u043e\u0434\u0435\u043b\u044c \u0434\u043e\u043b\u0436\u043d\u0430 \u0435\u0451 \u0443\u0432\u0438\u0434\u0435\u0442\u044c \u0438 \u043c\u043e\u0436\u0435\u0442 \u043f\u043e\u043f\u0440\u043e\u0431\u043e\u0432\u0430\u0442\u044c \u0434\u0440\u0443\u0433\u043e\u0439 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u0438\u043b\u0438 \u0447\u0435\u0441\u0442\u043d\u043e \u0441\u043a\u0430\u0437\u0430\u0442\u044c, \u0447\u0442\u043e \u043d\u0435 \u0441\u043c\u043e\u0433\u043b\u0430. \u041e\u0442\u0432\u0435\u0442 500 \u0443\u0431\u0438\u0432\u0430\u0435\u0442 \u0432\u0435\u0441\u044c \u043e\u0442\u0432\u0435\u0442 \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044e \u0431\u0435\u0437 \u043e\u0431\u044a\u044f\u0441\u043d\u0435\u043d\u0438\u044f, \u0430 \u0441\u043a\u0440\u044b\u0442\u044b\u0439 \u0440\u0435\u0442\u0440\u0430\u0439 \u043f\u0440\u044f\u0447\u0435\u0442 \u043e\u0442 \u043c\u043e\u0434\u0435\u043b\u0438 \u0432\u0430\u0436\u043d\u044b\u0439 \u0441\u0438\u0433\u043d\u0430\u043b."}], "links": [{"t": "Anthropic: Tool use overview", "u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"}, {"t": "Anthropic: Streaming Messages", "u": "https://platform.claude.com/docs/en/build-with-claude/streaming"}]}, "w4-fc": {"why": "\u042d\u0442\u043e \u043a\u043b\u044e\u0447\u0435\u0432\u043e\u0439 \u043c\u0435\u0445\u0430\u043d\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u0432\u043e\u043f\u0440\u043e\u0441 \u0430\u0433\u0435\u043d\u0442\u043d\u043e\u0433\u043e \u0441\u043e\u0431\u0435\u0441\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u044f: '\u043a\u0442\u043e \u0438\u0441\u043f\u043e\u043b\u043d\u044f\u0435\u0442 \u0444\u0443\u043d\u043a\u0446\u0438\u044e - \u043c\u043e\u0434\u0435\u043b\u044c \u0438\u043b\u0438 \u0442\u0432\u043e\u0439 \u043a\u043e\u0434' - \u0438 \u043f\u043e\u043b\u043e\u0432\u0438\u043d\u0430 \u043c\u0438\u0434\u0434\u043b\u043e\u0432 \u043e\u0442\u0432\u0435\u0447\u0430\u0435\u0442 \u043d\u0435\u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u043e. \u0412 \u043f\u0440\u043e\u0434\u0435 \u0437\u0434\u0435\u0441\u044c \u043b\u043e\u043c\u0430\u0435\u0442\u0441\u044f \u0432\u0441\u0451: \u0437\u0430\u0431\u044b\u0442\u044b\u0439 tool_result \u043d\u0430 \u043e\u0434\u0438\u043d \u0438\u0437 parallel tool_calls \u0432\u0430\u043b\u0438\u0442 \u0437\u0430\u043f\u0440\u043e\u0441 \u043e\u0448\u0438\u0431\u043a\u043e\u0439 400, \u0430 json.loads \u0431\u0435\u0437 try/except \u043d\u0430 \u0430\u0440\u0433\u0443\u043c\u0435\u043d\u0442\u0430\u0445 \u0440\u043e\u043d\u044f\u0435\u0442 \u043f\u0440\u043e\u0434 \u043f\u0440\u0438 \u043f\u0435\u0440\u0432\u043e\u0439 \u0436\u0435 \u043a\u0440\u0438\u0432\u043e\u0439 \u0433\u0435\u043d\u0435\u0440\u0430\u0446\u0438\u0438 \u043c\u043e\u0434\u0435\u043b\u0438.", "key": ["\u041c\u043e\u0434\u0435\u043b\u044c \u041d\u0415 \u0438\u0441\u043f\u043e\u043b\u043d\u044f\u0435\u0442 \u0444\u0443\u043d\u043a\u0446\u0438\u044e. \u041a\u043e\u0433\u0434\u0430 \u0435\u0439 \u044d\u0442\u043e \u043d\u0443\u0436\u043d\u043e, \u043e\u043d\u0430 \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442 \u043d\u0435 \u0442\u0435\u043a\u0441\u0442, \u0430 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0439 \u0437\u0430\u043f\u0440\u043e\u0441 \u043d\u0430 \u0432\u044b\u0437\u043e\u0432: \u0432 OpenAI-\u0441\u043e\u0432\u043c\u0435\u0441\u0442\u0438\u043c\u043e\u043c API \u044d\u0442\u043e \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435 assistant \u0441 \u043c\u0430\u0441\u0441\u0438\u0432\u043e\u043c tool_calls, \u0432 Anthropic Messages API - \u0431\u043b\u043e\u043a tool_use \u0432\u043d\u0443\u0442\u0440\u0438 content. \u0424\u0443\u043d\u043a\u0446\u0438\u044e \u0440\u0435\u0430\u043b\u044c\u043d\u043e \u0437\u0430\u043f\u0443\u0441\u043a\u0430\u0435\u0442 \u0442\u0432\u043e\u0439 \u043a\u043e\u0434.", "\u0422\u044b \u043f\u0430\u0440\u0441\u0438\u0448\u044c \u0437\u0430\u043f\u0440\u043e\u0441, \u0432\u044b\u0437\u044b\u0432\u0430\u0435\u0448\u044c \u043d\u0430\u0441\u0442\u043e\u044f\u0449\u0443\u044e Python-\u0444\u0443\u043d\u043a\u0446\u0438\u044e \u0438 \u043a\u043b\u0430\u0434\u0451\u0448\u044c \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u043e\u0431\u0440\u0430\u0442\u043d\u043e \u0432 \u0438\u0441\u0442\u043e\u0440\u0438\u044e \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0439: \u0432 OpenAI-\u0441\u043e\u0432\u043c\u0435\u0441\u0442\u0438\u043c\u043e\u043c API \u044d\u0442\u043e {\"role\": \"tool\", \"tool_call_id\": ..., \"content\": ...}, \u0432 Anthropic - \u0431\u043b\u043e\u043a {\"type\": \"tool_result\", \"tool_use_id\": ..., \"content\": ...} \u0432\u043d\u0443\u0442\u0440\u0438 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f \u0441 role: \"user\" (\u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u0439 \u0440\u043e\u043b\u0438 tool \u0443 Anthropic \u043d\u0435\u0442).", "\u0426\u0438\u043a\u043b: \u0432\u044b\u0437\u0432\u0430\u0442\u044c \u043c\u043e\u0434\u0435\u043b\u044c, \u0435\u0441\u043b\u0438 \u0432 \u043e\u0442\u0432\u0435\u0442\u0435 \u0435\u0441\u0442\u044c tool_calls/tool_use - \u0432\u044b\u043f\u043e\u043b\u043d\u0438\u0442\u044c \u0438\u0445 \u0432\u0441\u0435 \u0438 \u0434\u043e\u0431\u0430\u0432\u0438\u0442\u044c \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b, \u0432\u044b\u0437\u0432\u0430\u0442\u044c \u043c\u043e\u0434\u0435\u043b\u044c \u0441\u043d\u043e\u0432\u0430, \u043f\u043e\u0432\u0442\u043e\u0440\u044f\u0442\u044c, \u043f\u043e\u043a\u0430 \u043c\u043e\u0434\u0435\u043b\u044c \u043d\u0435 \u043e\u0442\u0432\u0435\u0442\u0438\u0442 \u043e\u0431\u044b\u0447\u043d\u044b\u043c \u0442\u0435\u043a\u0441\u0442\u043e\u043c \u0431\u0435\u0437 \u0437\u0430\u043f\u0440\u043e\u0441\u0430 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432. \u042d\u0442\u043e \u0443\u0441\u043b\u043e\u0432\u0438\u0435 \u043e\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0438, \u0430 \u043d\u0435 \u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0435 \u0447\u0438\u0441\u043b\u043e \u0448\u0430\u0433\u043e\u0432, \u0445\u043e\u0442\u044f \u0436\u0451\u0441\u0442\u043a\u0438\u0439 \u043f\u043e\u0442\u043e\u043b\u043e\u043a \u0438\u0442\u0435\u0440\u0430\u0446\u0438\u0439 \u0432\u0441\u0451 \u0440\u0430\u0432\u043d\u043e \u043d\u0443\u0436\u0435\u043d \u043a\u0430\u043a \u0441\u0442\u0440\u0430\u0445\u043e\u0432\u043a\u0430.", "\u0421\u0445\u0435\u043c\u0430 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 - \u044d\u0442\u043e JSON Schema \u043f\u0430\u0440\u0430\u043c\u0435\u0442\u0440\u043e\u0432 plus name \u0438 description. \u041c\u043e\u0434\u0435\u043b\u044c \u0432\u044b\u0431\u0438\u0440\u0430\u0435\u0442, \u0432\u044b\u0437\u044b\u0432\u0430\u0442\u044c \u043b\u0438 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u0438 \u0441 \u043a\u0430\u043a\u0438\u043c\u0438 \u0430\u0440\u0433\u0443\u043c\u0435\u043d\u0442\u0430\u043c\u0438, \u0422\u041e\u041b\u042c\u041a\u041e \u043f\u043e \u044d\u0442\u043e\u043c\u0443 \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u044e - \u0440\u0430\u0441\u043f\u043b\u044b\u0432\u0447\u0430\u0442\u044b\u0439 description \u0437\u043d\u0430\u0447\u0438\u0442 \u043d\u0435\u0432\u0435\u0440\u043d\u044b\u0435 \u0432\u044b\u0437\u043e\u0432\u044b \u043d\u0430 \u043f\u0440\u0430\u043a\u0442\u0438\u043a\u0435, \u0430 \u043d\u0435 \u0430\u0431\u0441\u0442\u0440\u0430\u043a\u0442\u043d\u044b\u0439 \u0440\u0438\u0441\u043a.", "\u0410\u0440\u0433\u0443\u043c\u0435\u043d\u0442\u044b \u043f\u0440\u0438\u0445\u043e\u0434\u044f\u0442 \u043a\u0430\u043a \u0442\u0435\u043a\u0441\u0442, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0441\u0433\u0435\u043d\u0435\u0440\u0438\u0440\u043e\u0432\u0430\u043b\u0430 \u043c\u043e\u0434\u0435\u043b\u044c, \u0430 \u043d\u0435 \u0433\u0430\u0440\u0430\u043d\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e \u0432\u0430\u043b\u0438\u0434\u043d\u044b\u0439 \u043e\u0431\u044a\u0435\u043a\u0442: \u0443 OpenAI-\u0441\u043e\u0432\u043c\u0435\u0441\u0442\u0438\u043c\u043e\u0433\u043e API function.arguments - \u044d\u0442\u043e JSON-\u0441\u0442\u0440\u043e\u043a\u0430, \u043a\u043e\u0442\u043e\u0440\u0430\u044f \u043c\u043e\u0436\u0435\u0442 \u0431\u044b\u0442\u044c \u043e\u0431\u0440\u0435\u0437\u0430\u043d\u0430 \u043b\u0438\u043c\u0438\u0442\u043e\u043c max_tokens \u0438\u043b\u0438 \u043f\u0440\u043e\u0441\u0442\u043e \u043d\u0435\u0432\u0430\u043b\u0438\u0434\u043d\u0430. json.loads \u0432\u0441\u0435\u0433\u0434\u0430 \u0432 try/except, \u0438\u043d\u0430\u0447\u0435 \u043e\u0434\u043d\u0430 \u043a\u0440\u0438\u0432\u0430\u044f \u0433\u0435\u043d\u0435\u0440\u0430\u0446\u0438\u044f \u0440\u043e\u043d\u044f\u0435\u0442 \u0432\u0435\u0441\u044c \u0446\u0438\u043a\u043b.", "\u041c\u043e\u0434\u0435\u043b\u044c \u043c\u043e\u0436\u0435\u0442 \u0437\u0430\u043f\u0440\u043e\u0441\u0438\u0442\u044c \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u043e \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432 \u043e\u0434\u043d\u0438\u043c \u0445\u043e\u0434\u043e\u043c (parallel tool calls) - \u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440 search_docs \u0438 get_current_date \u0440\u0430\u0437\u043e\u043c. \u041d\u0443\u0436\u043d\u043e \u0432\u044b\u043f\u043e\u043b\u043d\u0438\u0442\u044c \u043e\u0431\u0430 (\u043c\u043e\u0436\u043d\u043e \u043a\u043e\u043d\u043a\u0443\u0440\u0435\u043d\u0442\u043d\u043e \u0447\u0435\u0440\u0435\u0437 asyncio.gather) \u0438 \u0432\u0435\u0440\u043d\u0443\u0442\u044c \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u043f\u043e \u043a\u0430\u0436\u0434\u043e\u043c\u0443 id \u0434\u043e \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u0433\u043e \u0432\u044b\u0437\u043e\u0432\u0430 \u043c\u043e\u0434\u0435\u043b\u0438 - \u043f\u0440\u043e\u043f\u0443\u0441\u043a \u0445\u043e\u0442\u044f \u0431\u044b \u043e\u0434\u043d\u043e\u0433\u043e \u0434\u0430\u0451\u0442 \u043e\u0448\u0438\u0431\u043a\u0443 API.", "\u041e\u0448\u0438\u0431\u043a\u0430 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 - \u0442\u043e\u0436\u0435 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442, \u0430 \u043d\u0435 exception \u043d\u0430 \u0442\u0432\u043e\u0435\u0439 \u0441\u0442\u043e\u0440\u043e\u043d\u0435: \u0432\u0435\u0440\u043d\u0438 \u043c\u043e\u0434\u0435\u043b\u0438 \u0442\u0435\u043a\u0441\u0442 \u043e\u0448\u0438\u0431\u043a\u0438 (\u0443 Anthropic \u0435\u0441\u0442\u044c \u0444\u043b\u0430\u0433 is_error: true \u043d\u0430 \u0431\u043b\u043e\u043a\u0435 tool_result) \u0432\u043c\u0435\u0441\u0442\u043e \u0442\u043e\u0433\u043e, \u0447\u0442\u043e\u0431\u044b \u043b\u043e\u0432\u0438\u0442\u044c \u0438\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435 \u0438 \u0432\u0435\u0448\u0430\u0442\u044c \u0432\u0435\u0441\u044c \u0446\u0438\u043a\u043b - \u043c\u043e\u0434\u0435\u043b\u044c \u043e\u0431\u044b\u0447\u043d\u043e \u0443\u043c\u0435\u0435\u0442 \u0432\u043e\u0441\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c\u0441\u044f.", "'Structured output \u0447\u0435\u0440\u0435\u0437 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442' - \u0447\u0430\u0441\u0442\u044b\u0439 \u0442\u0440\u044e\u043a: \u043e\u0431\u044a\u044f\u0432\u043b\u044f\u0435\u0448\u044c \u043c\u043e\u0434\u0435\u043b\u0438 \u0444\u0435\u0439\u043a\u043e\u0432\u044b\u0439 tool, \u0447\u044c\u044f \u0441\u0445\u0435\u043c\u0430 - \u044d\u0442\u043e \u0436\u0435\u043b\u0430\u0435\u043c\u0430\u044f \u0444\u043e\u0440\u043c\u0430 JSON-\u043e\u0442\u0432\u0435\u0442\u0430, \u0438 \u0432\u043c\u0435\u0441\u0442\u043e \u0440\u0435\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0432\u044b\u0437\u043e\u0432\u0430 \u0447\u0438\u0442\u0430\u0435\u0448\u044c \u0435\u0433\u043e arguments/input. \u0420\u0430\u0431\u043e\u0442\u0430\u0435\u0442, \u043d\u043e \u0441 \u043f\u043e\u044f\u0432\u043b\u0435\u043d\u0438\u0435\u043c \u043d\u0430\u0442\u0438\u0432\u043d\u043e\u0433\u043e structured output \u044d\u0442\u043e \u0441\u043a\u043e\u0440\u0435\u0435 legacy-\u043f\u0430\u0442\u0442\u0435\u0440\u043d, \u0447\u0435\u043c \u043b\u0443\u0447\u0448\u0438\u0439 \u0441\u043f\u043e\u0441\u043e\u0431."], "code": {"title": "\u0426\u0438\u043a\u043b \u0430\u0433\u0435\u043d\u0442\u0430 \u0441 \u043d\u0443\u043b\u044f \u043d\u0430 OpenAI-\u0441\u043e\u0432\u043c\u0435\u0441\u0442\u0438\u043c\u043e\u043c API", "lang": "python", "body": "messages = [{\"role\": \"user\", \"content\": \"\u0421\u043a\u043e\u043b\u044c\u043a\u043e \u0431\u0443\u0434\u0435\u0442 12% \u043e\u0442 340?\"}]\nwhile True:\n    resp = client.chat.completions.create(model=\"gpt-4.1\", messages=mes

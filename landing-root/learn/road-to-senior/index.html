  function touch() { state.updatedAt = Date.now(); try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} scheduleCloudSave(); }
  function slot(bag, id, n, fill) {
    let e = state[bag][id];
    if (!e || !Array.isArray(e.v) || e.v.length !== n) { e = { v: new Array(n).fill(fill), t: e ? e.t || 0 : 0 }; state[bag][id] = e; }
    return e.v;
  }
  function subCount(id) { const t = byId[id]; return t && t.t.sub ? t.t.sub.length : 0; }
  function subOf(id) { return slot('sub', id, subCount(id), false); }
  function hwOf(id) { const c = CONTENT[id]; return slot('hw', id, c && c.hw ? c.hw.length : 0, false); }
  function quizOf(id) { const c = CONTENT[id]; return slot('quiz', id, c && c.quiz ? c.quiz.length : 0, null); }
  function stamp(bag, id) { if (state[bag][id]) state[bag][id].t = Date.now(); }
  function subDone(id) { const e = state.sub[id]; return e ? e.v.filter(Boolean).length : 0; }
  function hwDone(id) { const e = state.hw[id], c = CONTENT[id]; if (!c || !c.hw || !c.hw.length || !e) return 0; return e.v.filter(Boolean).length; }
  function quizRight(id) {
    const e = state.quiz[id], c = CONTENT[id];
    if (!c || !c.quiz || !e) return 0;
    let n = 0; c.quiz.forEach(function (q, i) { if (e.v[i] === q.c) n++; });
    return n;
  }
  // \u041e\u0441\u0432\u043e\u0435\u043d\u043d\u043e\u0441\u0442\u044c \u0442\u0435\u043c\u044b: \u0434\u043e\u043b\u044f \u043e\u0442\u043c\u0435\u0447\u0435\u043d\u043d\u044b\u0445 \u043f\u043e\u0434\u0442\u0435\u043c \u043f\u043b\u044e\u0441 \u0434\u043e\u043c\u0430\u0448\u043a\u0430 \u0438 \u0442\u0435\u0441\u0442, \u0435\u0441\u043b\u0438 \u043f\u043e \u0442\u0435\u043c\u0435 \u0435\u0441\u0442\u044c \u0440\u0430\u0437\u0431\u043e\u0440.
  function heat(id) {
    const c = CONTENT[id];
    const sN = subCount(id), hwN = c && c.hw ? c.hw.length : 0, qN = c && c.quiz ? c.quiz.length : 0;
    let num = 0, den = 0;
    if (sN) { num += (subDone(id) / sN) * 3; den += 3; }
    if (hwN) { num += (hwDone(id) / hwN) * 2; den += 2; }
    if (qN) { num += (quizRight(id) / qN) * 1; den += 1; }
    return den ? num / den : 0;
  }
  function passed(id) { const n = subCount(id); return n > 0 && subDone(id) === n; }
  function setPassed(id, on) {
    const a = subOf(id);
    for (let i = 0; i < a.length; i++) a[i] = on;
    stamp('sub', id); touch(); renderMap(); renderPanel(); if (openId === id) renderReader();
  }
  function weekHeat(w) { let s = 0; w.topics.forEach(function (t) { s += heat(t.id); }); return s / w.topics.length; }
  function weekPassed(w) { let n = 0; w.topics.forEach(function (t) { if (passed(t.id)) n++; }); return n; }

  // ---------- \u043f\u0430\u043b\u0438\u0442\u0440\u0430 ----------
  const STOPS = [
    [0.00, [6, 10, 18]], [0.08, [10, 26, 82]], [0.20, [18, 64, 255]], [0.35, [0, 168, 255]],
    [0.50, [0, 255, 176]], [0.62, [125, 255, 46]], [0.75, [255, 224, 0]], [0.86, [255, 138, 0]], [1.00, [255, 32, 32]]
  ];
  function colorAt(t) {
    t = Math.max(0, Math.min(1, t));
    for (let i = 1; i < STOPS.length; i++) {
      if (t <= STOPS[i][0]) {
        const a = STOPS[i - 1], b = STOPS[i];
        const k = (t - a[0]) / (b[0] - a[0] || 1);
        const c = [0, 1, 2].map(function (j) { return Math.round(a[1][j] + (b[1][j] - a[1][j]) * k); });
        return 'rgb(' + c.join(',') + ')';
      }
    }
    return 'rgb(255,32,32)';
  }
  // \u0426\u0432\u0435\u0442 \u043f\u043e\u0434\u043f\u0438\u0441\u0438 \u0432\u044b\u0431\u0438\u0440\u0430\u0435\u0442\u0441\u044f \u043f\u043e \u044f\u0440\u043a\u043e\u0441\u0442\u0438 \u0441\u0430\u043c\u043e\u0439 \u0437\u0430\u043b\u0438\u0432\u043a\u0438, \u0430 \u043d\u0435 \u043f\u043e \u043f\u043e\u0437\u0438\u0446\u0438\u0438 \u043d\u0430 \u0448\u043a\u0430\u043b\u0435:
  // \u0432 \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0435 \u0433\u0440\u0430\u0434\u0438\u0435\u043d\u0442\u0430 \u043b\u0435\u0436\u0438\u0442 \u043e\u0447\u0435\u043d\u044c \u0441\u0432\u0435\u0442\u043b\u044b\u0439 \u0437\u0435\u043b\u0451\u043d\u044b\u0439, \u043d\u0430 \u043d\u0451\u043c \u0431\u0435\u043b\u044b\u0439 \u0442\u0435\u043a\u0441\u0442 \u043d\u0435\u0447\u0438\u0442\u0430\u0435\u043c.
  function rgbAt(t) {
    t = Math.max(0, Math.min(1, t));
    for (let i = 1; i < STOPS.length; i++) {
      if (t <= STOPS[i][0]) {
        const a = STOPS[i - 1], b = STOPS[i];
        const k = (t - a[0]) / (b[0] - a[0] || 1);
        return [0, 1, 2].map(function (j) { return a[1][j] + (b[1][j] - a[1][j]) * k; });
      }
    }
    return [255, 32, 32];
  }
  function isBright(t) {
    const c = rgbAt(t);
    return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) > 128;
  }

  // ---------- squarified treemap ----------
  function worst(row, len, scale) {
    let s = 0, mx = 0, mn = Infinity;
    row.forEach(function (r) { const v = r.value * scale; s += v; if (v > mx) mx = v; if (v < mn) mn = v; });
    if (s === 0) return Infinity;
    return Math.max((len * len * mx) / (s * s), (s * s) / (len * len * mn));
  }
  function squarify(items, x, y, w, h) {
    const out = [];
    const list = items.slice().sort(function (a, b) { return b.value - a.value; });
    let total = 0; list.forEach(function (i) { total += i.value; });
    if (!total || w <= 0 || h <= 0) return out;
    const scale = (w * h) / total;
    let i = 0;
    while (i < list.length) {
      const len = Math.min(w, h);
      if (len <= 0) break;
      let row = [list[i]], j = i + 1;
      while (j < list.length && worst(row.concat([list[j]]), len, scale) <= worst(row, len, scale)) { row.push(list[j]); j++; }
      let rowSum = 0; row.forEach(function (r) { rowSum += r.value * scale; });
      const thick = rowSum / len;
      if (w >= h) {
        let cy = y;
        row.forEach(function (it) { const ih = (it.value * scale) / thick; out.push({ it: it, x: x, y: cy, w: thick, h: ih }); cy += ih; });
        x += thick; w -= thick;
      } else {
        let cx = x;
        row.forEach(function (it) { const iw = (it.value * scale) / thick; out.push({ it: it, x: cx, y: y, w: iw, h: thick }); cx += iw; });
        y += thick; h -= thick;
      }
      i = j;
    }
    return out;
  }

  // ---------- \u043e\u0442\u0440\u0438\u0441\u043e\u0432\u043a\u0430 \u043a\u0430\u0440\u0442\u044b ----------
  // \u0415\u0434\u0438\u043d\u0438\u0446\u0430 viewBox \u0434\u0435\u0440\u0436\u0438\u0442\u0441\u044f \u0431\u043b\u0438\u0437\u043a\u043e \u043a \u044d\u043a\u0440\u0430\u043d\u043d\u043e\u043c\u0443 \u043f\u0438\u043a\u0441\u0435\u043b\u044e, \u0438\u043d\u0430\u0447\u0435 \u043d\u0430 \u0443\u0437\u043a\u043e\u043c \u044d\u043a\u0440\u0430\u043d\u0435
  // \u043f\u043e\u0434\u043f\u0438\u0441\u0438 \u0443\u0436\u0438\u043c\u0430\u044e\u0442\u0441\u044f \u0432\u043c\u0435\u0441\u0442\u0435 \u0441 \u043a\u0430\u0440\u0442\u043e\u0439 \u0438 \u043f\u0435\u0440\u0435\u0441\u0442\u0430\u044e\u0442 \u0447\u0438\u0442\u0430\u0442\u044c\u0441\u044f.
  let VW = 1000, VH = 620;
  const GAPW = 4, GAPT = 1;
  const svg = document.getElementById('map');
  let narrow = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function inline(s) { return esc(s).replace(/`([^`]+)`/g, function (m, p) { return '<code>' + p + '</code>'; }); }
  function n2(v) { return v.toFixed(1); }

  // \u041f\u043e\u0434\u043f\u0438\u0441\u044c \u044f\u0447\u0435\u0439\u043a\u0438: \u0434\u0432\u0435 \u0441\u0442\u0440\u043e\u043a\u0438, \u0435\u0441\u043b\u0438 \u0435\u0441\u0442\u044c \u0432\u044b\u0441\u043e\u0442\u0430; \u043e\u0434\u043d\u0430 \u0441\u043a\u043b\u0435\u0435\u043d\u043d\u0430\u044f, \u0435\u0441\u043b\u0438 \u044f\u0447\u0435\u0439\u043a\u0430 \u043d\u0438\u0437\u043a\u0430\u044f;
  // \u043f\u043e\u0432\u0451\u0440\u043d\u0443\u0442\u0430\u044f, \u0435\u0441\u043b\u0438 \u044f\u0447\u0435\u0439\u043a\u0430 \u0443\u0437\u043a\u0430\u044f \u0438 \u0432\u044b\u0441\u043e\u043a\u0430\u044f. \u0428\u0438\u0440\u0438\u043d\u0430 \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442\u0441\u044f \u043f\u043e \u0448\u0438\u0440\u0438\u043d\u0435 \u0433\u043b\u0438\u0444\u0430 \u043c\u043e\u043d\u043e\u0448\u0438\u0440\u0438\u043d\u043d\u043e\u0433\u043e \u0448\u0440\u0438\u0444\u0442\u0430.
  const GLYPH = 0.62;
  function fits(s, fs, avail) { return s.length * fs * GLYPH <= avail; }
  function txt(x, y, fs, ink, s, rot) {
    return '<text' + (rot ? ' transform="rotate(-90 ' + n2(x) + ' ' + n2(y) + ')"' : '') +
      ' x="' + n2(x) + '" y="' + n2(y) + '" font-size="' + n2(fs) + '" fill="' + ink + '">' + esc(s) + '</text>';
  }
  function shrink(s, avail, max) {
    let fs = max;
    while (fs > 6.4 && !fits(s, fs, avail)) fs -= 0.3;
    return fits(s, fs, avail) ? fs : 0;
  }
  function label(t, cx, cy, cw, ch, ink) {
    const parts = [t.short[0]].concat(t.short[1] ? [t.short[1]] : []);
    const joined = parts.join(' \u00b7 ');
    const mx = cx + cw / 2, my = cy + ch / 2;
    if (cw < 52 && ch > 78) {
      const fs = shrink(joined, ch - 16, Math.min(10, cw / 4.4)) || shrink(parts[0], ch - 16, Math.min(10, cw / 4.4));
      if (!fs) return '';
      const s = fits(joined, fs, ch - 16) ? joined : parts[0];
      return txt(mx, my + fs * 0.35, fs, ink, s, true);
    }
    if (cw < 46 || ch < 20) return '';
    const max = Math.min(10.5, cw / 8.2);
    if (parts.length > 1 && ch >= 40) {
      const fs = Math.min(shrink(parts[0], cw - 8, max) || 0, shrink(parts[1], cw - 8, max) || 0);
      if (fs >= 6.8) {
        const base = my - fs * 0.12;
        return txt(mx, base, fs, ink, parts[0]) + txt(mx, base + fs * 1.22, fs, ink, parts[1]);
      }
    }
    const fsJ = shrink(joined, cw - 8, max);
    if (fsJ) return txt(mx, my + fsJ * 0.35, fsJ, ink, joined);
    const fs1 = shrink(parts[0], cw - 8, max);
    return fs1 ? txt(mx, my + fs1 * 0.35, fs1, ink, parts[0]) : '';
  }

  let weekBoxes = [];
  function layout() {
    const isNarrow = window.innerWidth < 900;
    if (isNarrow === narrow) return false;
    narrow = isNarrow;
    VW = isNarrow ? 760 : 1000;
    VH = isNarrow ? Math.round(VW * 1.25) : Math.round(VW * 0.62);
    svg.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);
    weekBoxes = squarify(WEEKS.map(function (w) {
      let v = 0; w.topics.forEach(function (t) { v += WEIGHT[t.kind] || 6; });
      return { value: v, w: w };
    }), 0, 0, VW, VH);
    return true;
  }
  layout();
  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (layout()) renderMap(); }, 150);
  });

  function renderMap() {
    let out = '<rect width="' + VW + '" height="' + VH + '" fill="#000"/>';
    let frames = '';
    weekBoxes.forEach(function (b) {
      const w = b.it.w;
      const x = b.x + GAPW / 2, y = b.y + GAPW / 2, bw = b.w - GAPW, bh = b.h - GAPW;
      out += '<g data-week="' + w.id + '">';
      const cells = squarify(w.topics.map(function (t) { return { value: WEIGHT[t.kind] || 6, t: t }; }), x, y, bw, bh);
      cells.forEach(function (c) {
        const t = c.it.t, id = t.id, ht = heat(id), on = passed(id);
        const cx = c.x + GAPT / 2, cy = c.y + GAPT / 2, cw = Math.max(0, c.w - GAPT), ch = Math.max(0, c.h - GAPT);
        out += '<g class="cell' + (on ? ' done' : '') + '" data-id="' + id + '" tabindex="0" role="button" aria-label="' + esc(t.name) + ', \u043e\u0441\u0432\u043e\u0435\u043d\u043e ' + Math.round(ht * 100) + ' \u043f\u0440\u043e\u0446\u0435\u043d\u0442\u043e\u0432">';
        out += '<rect class="fill" x="' + n2(cx) + '" y="' + n2(cy) + '" width="' + n2(cw) + '" height="' + n2(ch) + '" fill="' + colorAt(ht) + '"/>';
        const ink = isBright(ht) ? 'rgba(0,0,0,.85)' : 'rgba(255,255,255,.82)';
        out += label(t, cx, cy, cw, ch, ink);
        if (cw > 34 && ch > 28) {
          out += '<g class="mark"><rect x="' + n2(cx + cw - 12) + '" y="' + n2(cy + 5) + '" width="7" height="7"/></g>';
        }
        if (cw > 44 && ch > 48) {
          const c2 = CONTENT[id] || {};
          const items = [];
          const sv = subOf(id), hv = hwOf(id), qv = quizOf(id);
          sv.forEach(function (v) { items.push(v ? 1 : 0); });
          (c2.hw || []).forEach(function (_, k) { items.push(hv[k] ? 1 : 0); });
          (c2.quiz || []).forEach(function (q, k) { items.push(qv[k] === q.c ? 1 : 0); });
          const px = 4, gap = 2, sx = cx + 5, sy = cy + ch - 9;
          out += '<g class="sub-pix">';
          items.forEach(function (v, k) {
            const vx = sx + k * (px + gap);
            if (vx + px > cx + cw - 4) return;
            out += '<rect x="' + n2(vx) + '" y="' + n2(sy) + '" width="' + px + '" height="' + px + '" fill="' + (v ? '#fff' : (isBright(ht) ? 'rgba(0,0,0,.3)' : 'rgba(255,255,255,.2)')) + '"/>';
          });
          out += '</g>';
        }
        out += '</g>';
      });
      if (bw > 74 && bh > 36) {
        const lw = Math.min(bw - 6, 13 + w.name.length * 7.3);
        out += '<rect class="blk-bg" x="' + n2(x + 3) + '" y="' + n2(y + 3) + '" width="' + n2(lw) + '" height="' + (bh > 56 ? 26 : 16) + '"/>';
        out += '<text class="blk-label" x="' + n2(x + 7) + '" y="' + n2(y + 14) + '">' + esc(w.name) + '</text>';
        if (bh > 56) out += '<text class="blk-sub" x="' + n2(x + 7) + '" y="' + n2(y + 25) + '">' + esc(w.dates) + ' \u00b7 ' + weekPassed(w) + '/' + w.topics.length + '</text>';
      }
      frames += '<rect class="blk-line' + (w.id === selected ? ' sel' : '') + '" x="' + n2(x - 1) + '" y="' + n2(y - 1) + '" width="' + n2(bw + 2) + '" height="' + n2(bh + 2) + '"/>';
      out += '</g>';
    });
    svg.innerHTML = out + frames;
  }

  function renderPanel() {
    document.getElementById('weeks').innerHTML = WEEKS.map(function (w, i) {
      return '<button class="wk" type="button" data-week="' + w.id + '" aria-pressed="' + (w.id === selected) + '">' +
        '<i style="background:' + colorAt(weekHeat(w)) + '"></i>' +
        '<span>' + (i + 1) + '. ' + esc(w.name) + '</span>' +
        '<b>' + weekPassed(w) + '/' + w.topics.length + '</b></button>';
    }).join('');
    let done = 0, hsum = 0;
    FLAT.forEach(function (x) { if (passed(x.t.id)) done++; hsum += heat(x.t.id); });
    document.getElementById('foot').innerHTML =
      '<b>' + done + ' \u0438\u0437 ' + TOTAL + '</b> \u0442\u0435\u043c \u043f\u0440\u043e\u0439\u0434\u0435\u043d\u043e \u00b7 \u043e\u0441\u0432\u043e\u0435\u043d\u043e <b>' + Math.round((hsum / TOTAL) * 100) + '%</b><br>' +
      '\u041a\u043b\u0438\u043a \u043f\u043e \u044f\u0447\u0435\u0439\u043a\u0435 \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u0435\u0442 \u043f\u043e\u0434\u0442\u0435\u043c\u044b. \u042f\u0440\u043a\u043e\u0441\u0442\u044c \u044d\u0442\u043e \u0434\u043e\u043b\u044f \u0437\u0430\u043a\u0440\u044b\u0442\u044b\u0445 \u043f\u043e\u0434\u0442\u0435\u043c, \u0430 \u0433\u0434\u0435 \u0435\u0441\u0442\u044c \u0440\u0430\u0437\u0431\u043e\u0440, \u0435\u0449\u0451 \u0438 \u0434\u043e\u043c\u0430\u0448\u043a\u0430 \u0441 \u0442\u0435\u0441\u0442\u043e\u043c.';
  }

  // ---------- \u043e\u0431\u043b\u0430\u043a\u043e ----------
  let db = null, saveTimer = null;
  const syncEl = document.getElementById('sync');
  function setSync(mode, text) { syncEl.className = 'sync ' + mode; syncEl.textContent = text; }
  function save() {
    if (!db) return;
    clearTimeout(saveTimer); saveTimer = null;
    db.doc('progress/main').set({ sub: state.sub, hw: state.hw, quiz: state.quiz, updatedAt: state.updatedAt })
      .then(function () { setSync('on', '\u0441\u043e\u0445\u0440\u0430\u043d\u0435\u043d\u043e \u0432 \u043e\u0431\u043b\u0430\u043a\u0435'); })
      .catch(function () { setSync('err', '\u043e\u0431\u043b\u0430\u043a\u043e \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u043d\u043e, \u0441\u043e\u0445\u0440\u0430\u043d\u0435\u043d\u043e \u043b\u043e\u043a\u0430\u043b\u044c\u043d\u043e'); });
  }
  function scheduleCloudSave() { if (!db) return; clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
  // \u0421\u043b\u0438\u044f\u043d\u0438\u0435 \u043f\u043e \u0437\u0430\u043f\u0438\u0441\u044f\u043c: \u0432\u0442\u043e\u0440\u0430\u044f \u043e\u0442\u043a\u0440\u044b\u0442\u0430\u044f \u043a\u043e\u043f\u0438\u044f \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u044b \u043d\u0435 \u0437\u0430\u0442\u0438\u0440\u0430\u0435\u0442 \u043f\u0435\u0440\u0432\u0443\u044e.
  function mergeRemote(d) {
    let took = false, newer = false;
    BAGS.forEach(function (bag) {
      const remote = (d && d[bag]) || {};
      Object.keys(remote).forEach(function (k) {
        const r = remote[k], l = state[bag][k];
        if (!r || typeof r !== 'object') return;
        const rt = r.t || d.updatedAt || 0, lt = l ? l.t || 0 : -1;
        if (rt > lt) { state[bag][k] = r; took = true; }
        else if (lt > rt) newer = true;
      });
      Object.keys(state[bag]).forEach(function (k) { if (!(k in remote)) newer = true; });
    });
    if (took) {
      state.updatedAt = Math.max(state.updatedAt || 0, d.updatedAt || 0);
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      render();
    }
    return newer;
  }
  function makeRestDb(url) {
    return {
      doc: function () {
        return {
          set: function (data) {
            return fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(data) })
              .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); });
          },
          onSnapshot: function (cb, err) {
            fetch(url, { credentials: 'same-origin' })
              .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
              .then(function (d) { cb({ exists: !!(d && (d.sub || d.hw || d.quiz)), data: function () { return d || {}; }, metadata: { hasPendingWrites: false } }); })
              .catch(function () { if (err) err(); });
            return function () {};
          }
        };
      }
    };
  }
  (async function () {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        db = await window.claude.use('db');
      } else {
        db = makeRestDb('/api/learnit/progress?k=ls_9f2c7a1e6b3d84052c1f7ae0');
      }
      if (!db) return;
      setSync('on', '\u0441\u0438\u043d\u0445\u0440\u043e\u043d\u0438\u0437\u0438\u0440\u0443\u0435\u0442\u0441\u044f \u0441 \u043e\u0431\u043b\u0430\u043a\u043e\u043c');
      db.doc('progress/main').onSnapshot(function (snap) {
        const pending = snap.metadata && snap.metadata.hasPendingWrites;
        if (!snap.exists) { if (Object.keys(state.sub).length) scheduleCloudSave(); return; }
        const newer = mergeRemote(migrate(snap.data() || {}));
        if (newer && !pending) scheduleCloudSave();
        setSync('on', pending ? '\u0441\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u0442\u0441\u044f\u2026' : '\u0441\u043e\u0445\u0440\u0430\u043d\u0435\u043d\u043e \u0432 \u043e\u0431\u043b\u0430\u043a\u0435');
      }, function () { db = null; setSync('err', '\u043e\u0431\u043b\u0430\u043a\u043e \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u043d\u043e, \u0441\u043e\u0445\u0440\u0430\u043d\u0435\u043d\u043e \u043b\u043e\u043a\u0430\u043b\u044c\u043d\u043e'); });
      if (Object.keys(state.sub).length || Object.keys(state.hw).length) scheduleCloudSave();
    } catch (e) { db = null; }
  })();
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && saveTimer) save(); });

  // ---------- \u0447\u0438\u0442\u0430\u043b\u043a\u0430 ----------
  const reader = document.getElementById('reader');
  function openTopic(id) {
    openId = id;
    selected = byId[id].w.id;
    try { localStorage.setItem(LS_KEY + ':sel', selected); } catch (e) {}
    reader.hidden = false;
    document.body.style.overflow = 'hidden';
    renderReader(); renderMap(); renderPanel();
    const b = document.querySelector('#rHead .x');
    if (b) b.focus();
    document.getElementById('rBody').scrollTop = 0;
  }
  function closeReader() {
    openId = null;
    reader.hidden = true;
    document.body.style.overflow = '';
    if (lastFocus) { const el = svg.querySelector('.cell[data-id="' + lastFocus + '"]'); if (el) el.focus(); }
  }
  function step(delta) {
    const next = byId[openId].i + delta;
    if (next < 0 || next >= FLAT.length) return;
    lastFocus = FLAT[next].t.id;
    openTopic(FLAT[next].t.id);
  }

  function renderReader() {
    if (!openId) return;
    const rec = byId[openId], t = rec.t, w = rec.w, c = CONTENT[openId];
    const on = passed(openId), tone = colorAt(Math.max(0.22, heat(openId)));
    const wi = WEEKS.indexOf(w) + 1;

    let head = '<div class="top"><div style="flex:1">';
    head += '<span class="crumb"><i style="background:' + tone + '"></i>' + wi + ' \u00b7 ' + esc(w.name) + ' \u00b7 ' + esc(w.dates) + '</span>';
    head += '<h2 id="rTitle">' + esc(t.name) + '</h2>';
    head += '</div><button class="x" type="button" data-close aria-label="\u0417\u0430\u043a\u0440\u044b\u0442\u044c">\u2715</button></div>';
    head += '<div class="head-row"><button class="toggle' + (on ? ' on' : '') + '" type="button" data-toggle="' + (on ? '0' : '1') + '" aria-pressed="' + on + '">' +
      (on ? '\u2713 \u043f\u0440\u043e\u0439\u0434\u0435\u043d\u043e' : '\u043e\u0442\u043c\u0435\u0442\u0438\u0442\u044c \u043f\u0440\u043e\u0439\u0434\u0435\u043d\u043d\u043e\u0439') + '</button>';
    const hwN = c && c.hw ? c.hw.length : 0, qN = c && c.quiz ? c.quiz.length : 0;
    const bits = [];
    if (t.sub && t.sub.length) bits.push('\u043f\u043e\u0434\u0442\u0435\u043c\u044b ' + subDone(openId) + '/' + t.sub.length);
    if (hwN) bits.push('\u0434\u043e\u043c\u0430\u0448\u043a\u0430 ' + hwDone(openId) + '/' + hwN);
    if (qN) bits.push('\u0442\u0435\u0441\u0442 ' + quizRight(openId) + '/' + qN);
    bits.push('\u043e\u0441\u0432\u043e\u0435\u043d\u043e ' + Math.round(heat(openId) * 100) + '%');
    head += '<span class="pace">' + bits.join('  \u00b7  ') + '</span></div>';
    const headEl = document.getElementById('rHead');
    headEl.style.setProperty('--tone', tone);
    headEl.innerHTML = head;

    let b = '';
    if (t.sub && t.sub.length) {
      const sv = subOf(openId);
      b += '<div class="sec"><h3>\u041f\u043e\u0434\u0442\u0435\u043c\u044b</h3><p class="score">\u0437\u0430\u043a\u0440\u044b\u0442\u043e ' + subDone(openId) + ' \u0438\u0437 ' + t.sub.length + ', \u043a\u0430\u0436\u0434\u0430\u044f \u0434\u0430\u0451\u0442 ' + Math.round(100 / t.sub.length) + '%</p><ul class="hw tight">';
      t.sub.forEach(function (name, i) {
        b += '<li class="' + (sv[i] ? 'done' : '') + '"><input type="checkbox" id="sub-' + esc(openId) + '-' + i + '" data-sub="' + i + '"' + (sv[i] ? ' checked' : '') + '>';
        b += '<div><label class="t" for="sub-' + esc(openId) + '-' + i + '">' + inline(name) + '</label></div></li>';
      });
      b += '</ul></div>';
    }
    if (c) {
      if (c.why) b += '<div class="sec"><h3>\u0417\u0430\u0447\u0435\u043c \u044d\u0442\u043e</h3><p class="lead">' + inline(c.why) + '</p></div>';
      if (c.key && c.key.length) b += '<div class="sec"><h3>\u0421\u0443\u0442\u044c</h3><ul class="keylist">' + c.key.map(function (k) { return '<li>' + inline(k) + '</li>'; }).join('') + '</ul></div>';
      if (c.code && c.code.body) {
        b += '<div class="sec"><h3>\u041a\u043e\u0434</h3>';
        if (c.code.title) b += '<p class="code-title">' + esc(c.code.title) + '</p>';
        b += '<pre><code>' + esc(c.code.body) + '</code></pre></div>';
      }
      if (c.hw && c.hw.length) {
        const a = hwOf(openId);
        b += '<div class="sec"><h3>\u0414\u043e\u043c\u0430\u0448\u043a\u0430</h3><ul class="hw">';
        c.hw.forEach(function (h, i) {
          b += '<li class="' + (a[i] ? 'done' : '') + '"><input type="checkbox" id="hw-' + esc(openId) + '-' + i + '" data-hw="' + i + '"' + (a[i] ? ' checked' : '') + '>';
          b += '<div><label class="t" for="hw-' + esc(openId) + '-' + i + '">' + esc(h.t) + '</label><p class="d">' + inline(h.d) + '</p>';
          if (h.done) b += '<p class="done-c"><b>\u0413\u043e\u0442\u043e\u0432\u043e, \u043a\u043e\u0433\u0434\u0430:</b> ' + inline(h.done) + '</p>';
          b += '</div></li>';
        });
        b += '</ul></div>';
      }
      if (c.quiz && c.quiz.length) {
        const a = quizOf(openId);
        b += '<div class="sec"><h3>\u041f\u0440\u043e\u0432\u0435\u0440\u044c \u0441\u0435\u0431\u044f</h3><p class="score">\u0432\u0435\u0440\u043d\u044b\u0445 \u043e\u0442\u0432\u0435\u0442\u043e\u0432 ' + quizRight(openId) + ' \u0438\u0437 ' + c.quiz.length + '</p>';
        c.quiz.forEach(function (q, qi) {
          const picked = a[qi];
          b += '<div class="q"><p class="qt">' + inline(q.q) + '</p>';
          if (q.code) b += '<pre><code>' + esc(q.code) + '</code></pre>';
          b += '<div class="opts">';
          q.a.forEach(function (opt, oi) {
            let cls = '', mk = String.fromCharCode(65 + oi);
            if (picked != null) {
              if (oi === q.c) { cls = ' correct'; mk = '\u2713'; }
              else if (oi === picked) { cls = ' wrong'; mk = '\u2715'; }
            }
            b += '<button class="opt' + cls + '" type="button" data-q="' + qi + '" data-o="' + oi + '"' + (picked != null ? ' disabled' : '') + '><span class="mk">' + mk + '</span><span>' + inline(opt) + '</span></button>';
          });
          b += '</div>';
          if (picked != null) {
            b += '<p class="expl ' + (picked === q.c ? 'ok' : 'bad') + '">' + inline(q.e) + '</p>';
            b += '<button class="retry" type="button" data-reset="' + qi + '">\u043e\u0442\u0432\u0435\u0442\u0438\u0442\u044c \u0437\u0430\u043d\u043e\u0432\u043e</button>';
          }
          b += '</div>';
        });
        b += '</div>';
      }
      if (c.check && c.check.length) b += '<div class="sec"><h3>\u041e\u0442\u0432\u0435\u0442\u044c \u0432\u0441\u043b\u0443\u0445</h3><ol class="checklist">' + c.check.map(function (q) { return '<li>' + inline(q) + '</li>'; }).join('') + '</ol></div>';
      if (c.links && c.links.length) b += '<div class="sec"><h3>\u0418\u0441\u0442\u043e\u0447\u043d\u0438\u043a\u0438</h3><ul class="links">' + c.links.map(function (l) { return '<li><a href="' + esc(l.u) + '" target="_blank" rel="noopener noreferrer">' + esc(l.t) + '</a></li>'; }).join('') + '</ul></div>';
      if (hwN && hwDone(openId) === hwN && !on) b += '<div class="cta"><p>\u0414\u043e\u043c\u0430\u0448\u043a\u0430 \u0437\u0430\u043a\u0440\u044b\u0442\u0430 \u0446\u0435\u043b\u0438\u043a\u043e\u043c.</p><button class="toggle" type="button" data-toggle="1">\u041e\u0442\u043c\u0435\u0442\u0438\u0442\u044c \u043f\u0440\u043e\u0439\u0434\u0435\u043d\u043d\u043e\u0439</button></div>';
    }
    document.getElementById('rBody').innerHTML = b;

    const i = rec.i;
    const prev = i > 0 ? FLAT[i - 1] : null, next = i < FLAT.length - 1 ? FLAT[i + 1] : null;
    let f = '<button class="navbtn" type="button" data-step="-1"' + (prev ? '' : ' disabled') + '>\u2190 ' + (prev ? esc(prev.t.name) : '\u043d\u0430\u0447\u0430\u043b\u043e') + '</button>';
    f += '<span class="foot-hint">ESC \u0417\u0410\u041a\u0420\u042b\u0422\u042c \u00b7 \u2190 \u2192 \u0421\u041e\u0421\u0415\u0414\u041d\u042f\u042f \u0422\u0415\u041c\u0410</span>';
    f += '<button class="navbtn" type="button" data-step="1"' + (next ? '' : ' disabled') + '>' + (next ? esc(next.t.name) : '\u043a\u043e\u043d\u0435\u0446') + ' \u2192</button>';
    document.getElementById('rFoot').innerHTML = f;
  }

  function render() { renderMap(); renderPanel(); if (openId) renderReader(); }

  // ---------- \u0441\u043e\u0431\u044b\u0442\u0438\u044f ----------
  svg.addEventListener('click', function (e) {
    const cell = e.target.closest('.cell');
    if (!cell) return;
    lastFocus = cell.dataset.id;
    openTopic(cell.dataset.id);
  });
  svg.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const cell = e.target.closest('.cell');
    if (!cell) return;
    e.preventDefault(); lastFocus = cell.dataset.id; openTopic(cell.dataset.id);
  });
  document.getElementById('weeks').addEventListener('click', function (e) {
    const b = e.target.closest('.wk');
    if (!b) return;
    selected = selected === b.dataset.week ? null : b.dataset.week;
    try { localStorage.setItem(LS_KEY + ':sel', selected || ''); } catch (x) {}
    renderMap(); renderPanel();
  });
  reader.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) { closeReader(); return; }
    const tg = e.target.closest('[data-toggle]');
    if (tg) { setPassed(openId, tg.dataset.toggle === '1'); return; }
    const opt = e.target.closest('[data-q]');
    if (opt) { quizOf(openId)[+opt.dataset.q] = +opt.dataset.o; stamp('quiz', openId); touch(); renderReader(); renderMap(); renderPanel(); return; }
    const rs = e.target.closest('[data-reset]');
    if (rs) { quizOf(openId)[+rs.dataset.reset] = null; stamp('quiz', openId); touch(); renderReader(); renderMap(); renderPanel(); return; }
    const nav = e.target.closest('[data-step]');
    if (nav) { step(+nav.dataset.step); }
  });
  reader.addEventListener('change', function (e) {
    const cb = e.target.closest('[data-hw], [data-sub]');
    if (!cb) return;
    const scroll = document.getElementById('rBody').scrollTop;
    if (cb.dataset.sub != null) { subOf(openId)[+cb.dataset.sub] = cb.checked; stamp('sub', openId); }
    else { hwOf(openId)[+cb.dataset.hw] = cb.checked; stamp('hw', openId); }
    touch();
    renderReader(); renderMap(); renderPanel();
    document.getElementById('rBody').scrollTop = scroll;
  });
  document.addEventListener('keydown', function (e) {
    if (reader.hidden) return;
    if (e.key === 'Escape') { closeReader(); return; }
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
    if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
  });

  render();
})();
</script>

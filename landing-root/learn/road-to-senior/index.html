3\u043b\u044c\u0442\u0430\u0442 \u044d\u0442\u043e\u0433\u043e \u0432\u044b\u0437\u043e\u0432\u0430?", "code": "{\"role\": \"assistant\", \"content\": [{\"type\": \"tool_use\", \"id\": \"toolu_01A\", \"name\": \"get_weather\", \"input\": {\"city\": \"Moscow\"}}]}", "a": ["\u041d\u043e\u0432\u044b\u043c \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435\u043c {\"role\": \"tool\", \"tool_call_id\": \"toolu_01A\", ...}", "\u0421\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435\u043c {\"role\": \"user\", \"content\": [{\"type\": \"tool_result\", \"tool_use_id\": \"toolu_01A\", \"content\": \"...\"}]}", "\u0414\u043e\u043f\u0438\u0441\u0430\u0442\u044c \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u0432 \u0442\u043e \u0436\u0435 assistant-\u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435 \u0432\u0442\u043e\u0440\u044b\u043c content-\u0431\u043b\u043e\u043a\u043e\u043c", "\u041e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u043c \u043f\u043e\u043b\u0435\u043c tool_output \u043d\u0430 \u0432\u0435\u0440\u0445\u043d\u0435\u043c \u0443\u0440\u043e\u0432\u043d\u0435 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u0433\u043e \u0437\u0430\u043f\u0440\u043e\u0441\u0430"], "c": 1, "e": "\u0412 Anthropic Messages API \u043d\u0435\u0442 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u0439 \u0440\u043e\u043b\u0438 tool: \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 - content-\u0431\u043b\u043e\u043a tool_result \u0441 tool_use_id \u0432\u043d\u0443\u0442\u0440\u0438 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f role: \"user\". \u0420\u043e\u043b\u044c tool \u0438 \u043f\u043e\u043b\u0435 tool_call_id (\u043f\u0435\u0440\u0432\u044b\u0439 \u0432\u0430\u0440\u0438\u0430\u043d\u0442) - \u044d\u0442\u043e \u0444\u043e\u0440\u043c\u0430\u0442 OpenAI-\u0441\u043e\u0432\u043c\u0435\u0441\u0442\u0438\u043c\u043e\u0433\u043e API, \u0437\u0434\u0435\u0441\u044c \u043e\u043d \u043d\u0435 \u0441\u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442."}, {"q": "\u041c\u043e\u0434\u0435\u043b\u044c \u0440\u0430\u0437 \u0437\u0430 \u0440\u0430\u0437\u043e\u043c \u043f\u0440\u043e\u0441\u0438\u0442 \u043e\u0434\u0438\u043d \u0438 \u0442\u043e\u0442 \u0436\u0435 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u0441 \u043f\u043e\u0447\u0442\u0438 \u043e\u0434\u0438\u043d\u0430\u043a\u043e\u0432\u044b\u043c\u0438 \u0430\u0440\u0433\u0443\u043c\u0435\u043d\u0442\u0430\u043c\u0438, \u043e\u0442\u0432\u0435\u0442 \u043d\u0435 \u0441\u0445\u043e\u0434\u0438\u0442\u0441\u044f \u043a \u0444\u0438\u043d\u0430\u043b\u044c\u043d\u043e\u043c\u0443 \u0442\u0435\u043a\u0441\u0442\u0443. \u0427\u0442\u043e \u0438\u0437 \u044d\u0442\u043e\u0433\u043e - \u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u0430\u044f \u0437\u0430\u0449\u0438\u0442\u0430 \u043d\u0430 \u0443\u0440\u043e\u0432\u043d\u0435 \u043a\u043e\u0434\u0430 \u0446\u0438\u043a\u043b\u0430?", "a": ["\u0423\u0432\u0435\u043b\u0438\u0447\u0438\u0442\u044c max_tokens \u0432 \u043d\u0430\u0434\u0435\u0436\u0434\u0435, \u0447\u0442\u043e \u043c\u043e\u0434\u0435\u043b\u0438 \u043d\u0435 \u0445\u0432\u0430\u0442\u0438\u043b\u043e \u043c\u0435\u0441\u0442\u0430 \u043d\u0430 \u0444\u0438\u043d\u0430\u043b\u044c\u043d\u044b\u0439 \u043e\u0442\u0432\u0435\u0442", "\u0416\u0451\u0441\u0442\u043a\u0438\u0439 \u043f\u0440\u0435\u0434\u0435\u043b \u0447\u0438\u0441\u043b\u0430 \u0438\u0442\u0435\u0440\u0430\u0446\u0438\u0439 \u0446\u0438\u043a\u043b\u0430 (max_iters), \u043f\u043e\u0441\u043b\u0435 \u043a\u043e\u0442\u043e\u0440\u043e\u0433\u043e \u0446\u0438\u043a\u043b \u043f\u0440\u0438\u043d\u0443\u0434\u0438\u0442\u0435\u043b\u044c\u043d\u043e \u0437\u0430\u0432\u0435\u0440\u0448\u0430\u0435\u0442\u0441\u044f \u0441 fallback-\u043e\u0442\u0432\u0435\u0442\u043e\u043c", "\u041f\u043e\u043d\u0438\u0437\u0438\u0442\u044c temperature \u0434\u043e 0 \u0438 \u043f\u043e\u0434\u043e\u0436\u0434\u0430\u0442\u044c - \u0440\u0430\u043d\u043e \u0438\u043b\u0438 \u043f\u043e\u0437\u0434\u043d\u043e \u0441\u043e\u0439\u0434\u0451\u0442\u0441\u044f", "\u041d\u0438\u0447\u0435\u0433\u043e \u043d\u0435 \u0434\u0435\u043b\u0430\u0442\u044c - OpenAI-\u0441\u043e\u0432\u043c\u0435\u0441\u0442\u0438\u043c\u044b\u0439 API \u0441\u0430\u043c \u043e\u0431\u043e\u0440\u0432\u0451\u0442 \u0434\u0438\u0430\u043b\u043e\u0433 \u043f\u043e\u0441\u043b\u0435 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u0438\u0445 tool_calls \u043f\u043e\u0434\u0440\u044f\u0434"], "c": 1, "e": "API \u043d\u0435 \u043e\u0433\u0440\u0430\u043d\u0438\u0447\u0438\u0432\u0430\u0435\u0442 \u0447\u0438\u0441\u043b\u043e \u0448\u0430\u0433\u043e\u0432 \u0434\u0438\u0430\u043b\u043e\u0433\u0430 - \u044d\u0442\u043e \u0437\u0430\u0431\u043e\u0442\u0430 \u0432\u044b\u0437\u044b\u0432\u0430\u044e\u0449\u0435\u0433\u043e \u043a\u043e\u0434\u0430. \u0422\u043e\u043b\u044c\u043a\u043e \u0432\u043d\u0435\u0448\u043d\u0438\u0439 \u043f\u043e\u0442\u043e\u043b\u043e\u043a \u0438\u0442\u0435\u0440\u0430\u0446\u0438\u0439 \u0433\u0430\u0440\u0430\u043d\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e \u043e\u0441\u0442\u0430\u043d\u0430\u0432\u043b\u0438\u0432\u0430\u0435\u0442 \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435 \u0438 \u0437\u0430\u0449\u0438\u0449\u0430\u0435\u0442 \u043e\u0442 \u0441\u0447\u0451\u0442\u0430 \u0437\u0430 \u0442\u043e\u043a\u0435\u043d\u044b; \u043f\u043e\u043d\u0438\u0436\u0435\u043d\u0438\u0435 temperature \u0438\u043b\u0438 \u0443\u0432\u0435\u043b\u0438\u0447\u0435\u043d\u0438\u0435 max_tokens \u043d\u0435 \u0433\u0430\u0440\u0430\u043d\u0442\u0438\u0440\u0443\u044e\u0442 \u0441\u0445\u043e\u0434\u0438\u043c\u043e\u0441\u0442\u0438."}, {"q": "\u041e\u0434\u0438\u043d \u043e\u0442\u0432\u0435\u0442 \u043c\u043e\u0434\u0435\u043b\u0438 \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u0442 \u0441\u0440\u0430\u0437\u0443 2 tool_calls: search_docs \u0438 get_current_date. \u0427\u0442\u043e \u043d\u0443\u0436\u043d\u043e \u0441\u0434\u0435\u043b\u0430\u0442\u044c \u043f\u0435\u0440\u0435\u0434 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u043c \u0432\u044b\u0437\u043e\u0432\u043e\u043c \u043c\u043e\u0434\u0435\u043b\u0438?", "a": ["\u0412\u044b\u043f\u043e\u043b\u043d\u0438\u0442\u044c \u043e\u0431\u0430 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 \u0438 \u0434\u043e\u0431\u0430\u0432\u0438\u0442\u044c \u0432 \u0438\u0441\u0442\u043e\u0440\u0438\u044e \u043f\u043e \u043e\u0434\u043d\u043e\u043c\u0443 result-\u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044e \u043d\u0430 \u043a\u0430\u0436\u0434\u044b\u0439 id - \u043e\u0431\u0430 \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u044b, \u043f\u043e\u0440\u044f\u0434\u043e\u043a \u043d\u0435 \u0432\u0430\u0436\u0435\u043d", "\u0412\u044b\u043f\u043e\u043b\u043d\u0438\u0442\u044c \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u0435\u0440\u0432\u044b\u0439 \u043f\u043e \u0441\u043f\u0438\u0441\u043a\u0443, \u0432\u0442\u043e\u0440\u043e\u0439 \u043c\u043e\u0436\u043d\u043e \u043f\u0440\u043e\u043f\u0443\u0441\u0442\u0438\u0442\u044c \u043a\u0430\u043a \u043c\u0435\u043d\u0435\u0435 \u0432\u0430\u0436\u043d\u044b\u0439", "\u0421\u043b\u0438\u0442\u044c \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u043e\u0431\u043e\u0438\u0445 \u0432\u044b\u0437\u043e\u0432\u043e\u0432 \u0432 \u043e\u0434\u043d\u043e result-\u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435 \u0441 \u043e\u0434\u043d\u0438\u043c id", "\u0412\u044b\u043f\u043e\u043b\u043d\u0438\u0442\u044c \u043e\u0431\u0430, \u043d\u043e \u0432 \u0438\u0441\u0442\u043e\u0440\u0438\u044e \u043f\u043e\u043b\u043e\u0436\u0438\u0442\u044c \u0442\u043e\u043b\u044c\u043a\u043e \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0435\u0433\u043e - \u043c\u043e\u0434\u0435\u043b\u044c \u0432\u0441\u0451 \u0440\u0430\u0432\u043d\u043e \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u0435\u0433\u043e"], "c": 0, "e": "API \u0442\u0440\u0435\u0431\u0443\u0435\u0442 \u043e\u0442\u0432\u0435\u0442 \u043d\u0430 \u043a\u0430\u0436\u0434\u044b\u0439 id, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u043c\u043e\u0434\u0435\u043b\u044c \u0432\u044b\u0434\u0430\u043b\u0430 \u0432 \u044d\u0442\u043e\u043c \u0445\u043e\u0434\u0443; \u0445\u043e\u0442\u044f \u0431\u044b \u043e\u0434\u0438\u043d \u043f\u0440\u043e\u043f\u0443\u0449\u0435\u043d\u043d\u044b\u0439 id \u043e\u0431\u044b\u0447\u043d\u043e \u043f\u0440\u0438\u0432\u043e\u0434\u0438\u0442 \u043a \u043e\u0448\u0438\u0431\u043a\u0435 \u0437\u0430\u043f\u0440\u043e\u0441\u0430. \u0421\u043b\u0438\u044f\u043d\u0438\u0435 \u0432 \u043e\u0434\u043d\u043e \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435 \u043b\u043e\u043c\u0430\u0435\u0442 \u0441\u043e\u043f\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0435 id-\u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442, \u043d\u0430 \u043a\u043e\u0442\u043e\u0440\u043e\u0435 \u043e\u043f\u0438\u0440\u0430\u0435\u0442\u0441\u044f \u043c\u043e\u0434\u0435\u043b\u044c."}], "links": [{"t": "OpenAI: Function calling", "u": "https://developers.openai.com/api/docs/guides/function-calling"}, {"t": "Anthropic: Tool use overview", "u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"}]}, "w4-ctx": {"why": "\u042d\u0442\u043e \u0440\u0430\u0437\u043d\u0438\u0446\u0430 \u043c\u0435\u0436\u0434\u0443 \u0430\u0433\u0435\u043d\u0442\u043e\u043c, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0447\u0435\u0440\u0435\u0437 10 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0439 \u043d\u0430\u0447\u0438\u043d\u0430\u0435\u0442 \u043d\u0435\u0441\u0442\u0438 \u0447\u0443\u0448\u044c \u0438 \u0436\u0440\u0430\u0442\u044c \u0431\u044e\u0434\u0436\u0435\u0442, \u0438 \u0442\u0435\u043c, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0441\u0442\u0430\u0431\u0438\u043b\u044c\u043d\u043e \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u0447\u0430\u0441\u0430\u043c\u0438. \u041d\u0430 \u0441\u043e\u0431\u0435\u0441\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0438 \u0441\u043f\u0440\u043e\u0441\u044f\u0442 '\u043a\u0430\u043a \u0443\u043c\u0435\u043d\u044c\u0448\u0438\u0442\u044c \u0441\u0442\u043e\u0438\u043c\u043e\u0441\u0442\u044c \u0434\u043b\u0438\u043d\u043d\u043e\u0433\u043e \u0434\u0438\u0430\u043b\u043e\u0433\u0430 \u0441 \u0430\u0433\u0435\u043d\u0442\u043e\u043c' - \u0438 '\u043f\u0440\u043e\u0441\u0442\u043e \u0432\u0437\u044f\u0442\u044c \u043c\u043e\u0434\u0435\u043b\u044c \u0441 \u043e\u043a\u043d\u043e\u043c \u043f\u043e\u0431\u043e\u043b\u044c\u0448\u0435' \u0437\u0434\u0435\u0441\u044c \u043d\u0435\u0432\u0435\u0440\u043d\u044b\u0439 \u043e\u0442\u0432\u0435\u0442.", "key": ["System prompt - \u043d\u0435 \u043c\u0435\u0441\u0442\u043e \u0434\u043b\u044f \u0441\u043a\u043b\u0430\u0434\u0430 \u0432\u0441\u0435\u0445 \u043f\u0440\u0430\u0432\u0438\u043b \u043d\u0430 \u0432\u0441\u0435 \u0441\u043b\u0443\u0447\u0430\u0438 \u0436\u0438\u0437\u043d\u0438: \u043e\u043d \u043f\u0435\u0440\u0435\u0441\u044b\u043b\u0430\u0435\u0442\u0441\u044f \u0432 \u043a\u0430\u0436\u0434\u043e\u043c \u0437\u0430\u043f\u0440\u043e\u0441\u0435 (\u0435\u0441\u043b\u0438 \u043d\u0435 \u0437\u0430\u043a\u044d\u0448\u0438\u0440\u043e\u0432\u0430\u043d), \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0440\u0430\u0437\u0434\u0443\u0442\u044b\u0439 system prompt - \u044d\u0442\u043e \u0440\u0430\u0437\u0434\u0443\u0442\u044b\u0439 \u0441\u0447\u0451\u0442 \u043d\u0430 \u043a\u0430\u0436\u0434\u044b\u0439 \u0448\u0430\u0433 \u0446\u0438\u043a\u043b\u0430, \u0430 \u043d\u0435 \u0440\u0430\u0437\u043e\u0432\u0430\u044f \u0441\u0442\u043e\u0438\u043c\u043e\u0441\u0442\u044c.", "\u041f\u0440\u043e\u043c\u043f\u0442-\u043a\u044d\u0448\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 (cache_control \u0442\u0438\u043f\u0430 ephemeral \u0443 Anthropic) \u044d\u043a\u043e\u043d\u043e\u043c\u0438\u0442 \u0437\u0430 \u0441\u0447\u0451\u0442 \u043d\u0435\u0438\u0437\u043c\u0435\u043d\u043d\u043e\u0433\u043e \u043f\u0440\u0435\u0444\u0438\u043a\u0441\u0430: \u043b\u044e\u0431\u043e\u0439 \u0438\u0437\u043c\u0435\u043d\u0438\u0432\u0448\u0438\u0439\u0441\u044f \u0431\u0430\u0439\u0442 \u0432 \u043d\u0430\u0447\u0430\u043b\u0435 \u0437\u0430\u043f\u0440\u043e\u0441\u0430, \u0432\u043a\u043b\u044e\u0447\u0430\u044f \u043f\u043e\u0440\u044f\u0434\u043e\u043a \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432, \u0438\u043d\u0432\u0430\u043b\u0438\u0434\u0438\u0440\u0443\u0435\u0442 \u0432\u0435\u0441\u044c \u043a\u044d\u0448 \u043f\u043e\u0441\u043b\u0435 \u044d\u0442\u043e\u0439 \u0442\u043e\u0447\u043a\u0438 - \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0441\u0442\u0430\u0431\u0438\u043b\u044c\u043d\u044b\u0435 \u0432\u0435\u0449\u0438 (system prompt, \u0441\u043f\u0438\u0441\u043e\u043a tools) \u043a\u043b\u0430\u0434\u0443\u0442 \u0432 \u043d\u0430\u0447\u0430\u043b\u043e, \u0430 \u043f\u0435\u0440\u0435\u043c\u0435\u043d\u043d\u044b\u0435 (\u0442\u0435\u043a\u0443\u0449\u0438\u0439 \u0432\u043e\u043f\u0440\u043e\u0441, timestamp) \u0432 \u043a\u043e\u043d\u0435\u0446.", "\u041a\u043e\u0440\u043e\u0442\u043a\u0430\u044f \u043f\u0430\u043c\u044f\u0442\u044c (short-term) - \u0438\u0441\u0442\u043e\u0440\u0438\u044f \u0442\u0435\u043a\u0443\u0449\u0435\u0433\u043e \u0434\u0438\u0430\u043b\u043e\u0433\u0430, \u0442\u043e, \u0447\u0442\u043e \u0432 LangGraph \u0445\u0440\u0430\u043d\u0438\u0442 checkpointer \u043f\u043e thread_id. \u0414\u043b\u0438\u043d\u043d\u0430\u044f \u043f\u0430\u043c\u044f\u0442\u044c (long-term) - \u0444\u0430\u043a\u0442\u044b, \u043f\u0435\u0440\u0435\u0436\u0438\u0432\u0448\u0438\u0435 \u0434\u0438\u0430\u043b\u043e\u0433 (\u043f\u0440\u043e\u0444\u0438\u043b\u044c \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044f, \u043f\u0440\u043e\u0448\u043b\u044b\u0435 \u0440\u0435\u0448\u0435\u043d\u0438\u044f), \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u043e\u0431\u044b\u0447\u043d\u043e \u0436\u0438\u0432\u0443\u0442 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e (\u0411\u0414, vector store) \u0438 \u043f\u043e\u0434\u0442\u044f\u0433\u0438\u0432\u0430\u044e\u0442\u0441\u044f \u0432 \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442 \u044f\u0432\u043d\u044b\u043c \u043f\u043e\u0438\u0441\u043a\u043e\u043c, \u0430 \u043d\u0435 \u043f\u0440\u043e\u0441\u0442\u043e \u043e\u0441\u0442\u0430\u044e\u0442\u0441\u044f \u0432 \u0438\u0441\u0442\u043e\u0440\u0438\u0438.", "\u041a\u043e\u043c\u043f\u0440\u0435\u0441\u0441\u0438\u044f \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442\u0430 - \u043c\u0438\u043d\u0438\u043c\u0443\u043c \u0434\u0432\u0435 \u0440\u0430\u0437\u043d\u044b\u0445 \u0442\u0435\u0445\u043d\u0438\u043a\u0438: \u0441\u0443\u043c\u043c\u0430\u0440\u0438\u0437\u0430\u0446\u0438\u044f (\u0441\u0436\u0430\u0442\u044c \u0441\u0442\u0430\u0440\u044b\u0435 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f \u0432 \u0442\u0435\u043a\u0441\u0442\u043e\u0432\u043e\u0435 summary, \u0442\u0435\u0440\u044f\u044f \u0434\u0435\u0442\u0430\u043b\u0438) \u0438 \u0438\u0437\u0431\u0438\u0440\u0430\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u043e\u0447\u0438\u0441\u0442\u043a\u0430 (\u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440 \u0443\u0431\u0440\u0430\u0442\u044c \u0442\u043e\u043b\u044c\u043a\u043e \u0441\u0442\u0430\u0440\u044b\u0435 tool_result, \u043e\u0441\u0442\u0430\u0432\u0438\u0432 \u0441\u0430\u043c \u0444\u0430\u043a\u0442, \u0447\u0442\u043e \u0432\u044b\u0437\u043e\u0432 \u0431\u044b\u043b). \u042d\u0442\u043e \u0440\u0430\u0437\u043d\u044b\u0435 \u043c\u0435\u0445\u0430\u043d\u0438\u0437\u043c\u044b \u0441 \u0440\u0430\u0437\u043d\u044b\u043c\u0438 \u043f\u043e\u0442\u0435\u0440\u044f\u043c\u0438, \u0438\u0445 \u043f\u0443\u0442\u0430\u044e\u0442 \u043d\u0430 \u0441\u043b\u043e\u0432\u0430\u0445 '\u0441\u043e\u0436\u043c\u0438 \u0438\u0441\u0442\u043e\u0440\u0438\u044e'.", "\u0411\u044e\u0434\u0436\u0435\u0442 \u0442\u043e\u043a\u0435\u043d\u043e\u0432 \u0441\u0447\u0438\u0442\u0430\u044e\u0442 \u043d\u0435 \u043d\u0430 \u0433\u043b\u0430\u0437\u043e\u043a: \u043d\u0443\u0436\u0435\u043d \u0441\u0447\u0451\u0442\u0447\u0438\u043a (tiktoken \u0434\u043b\u044f OpenAI-\u0441\u0435\u043c\u0435\u0439\u0441\u0442\u0432\u0430, \u044d\u043d\u0434\u043f\u043e\u0438\u043d\u0442 count_tokens \u0443 Anthropic) \u0438 \u044f\u0432\u043d\u044b\u0439 \u043b\u0438\u043c\u0438\u0442 \u043d\u0430 \u043a\u0430\u0436\u0434\u044b\u0439 \u043a\u043e\u043c\u043f\u043e\u043d\u0435\u043d\u0442 \u043f\u0440\u043e\u043c\u043f\u0442\u0430 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e (system, \u043d\u0430\u0439\u0434\u0435\u043d\u043d\u044b\u0435 RAG-\u0447\u0430\u043d\u043a\u0438, \u0438\u0441\u0442\u043e\u0440\u0438\u044f, \u0441\u0445\u0435\u043c\u044b \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432) - \u0438\u043d\u0430\u0447\u0435 \u043e\u0434\u0438\u043d \u0440\u0430\u0437\u0440\u043e\u0441\u0448\u0438\u0439\u0441\u044f \u043a\u043e\u043c\u043f\u043e\u043d\u0435\u043d\u0442 \u043d\u0435\u0437\u0430\u043c\u0435\u0442\u043d\u043e \u0432\u044b\u0442\u0435\u0441\u043d\u044f\u0435\u0442 \u043c\u0435\u0441\u0442\u043e \u043f\u043e\u0434 \u0438\u0441\u0442\u043e\u0440\u0438\u044e.", "\u0411\u043e\u043b\u044c\u0448\u043e\u0435 \u043e\u043a\u043d\u043e \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442\u0430 - \u043d\u0435 \u0431\u0435\u0437\u043b\u0438\u043c\u0438\u0442\u043d\u044b\u0439 \u043a\u0430\u0440\u043c\u0430\u043d: \u043c\u043e\u0434\u0435\u043b\u0438 \u0445\u0443\u0436\u0435 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u044e\u0442 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u044e, \u0437\u0430\u0440\u044b\u0442\u0443\u044e \u0432 \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0435 \u0434\u043b\u0438\u043d\u043d\u043e\u0433\u043e \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442\u0430, \u0447\u0435\u043c \u0442\u043e, \u0447\u0442\u043e \u0432 \u043d\u0430\u0447\u0430\u043b\u0435 \u0438\u043b\u0438 \u0432 \u043a\u043e\u043d\u0446\u0435. \u042d\u0442\u043e \u043f\u0440\u0438\u0447\u0438\u043d\u0430 \u044f\u0432\u043d\u043e \u0440\u0435\u0437\u044e\u043c\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u0438 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u0434\u043b\u0438\u043d\u043d\u0443\u044e \u0438\u0441\u0442\u043e\u0440\u0438\u044e, \u0430 \u043d\u0435 \u043f\u0440\u043e\u0441\u0442\u043e \u0434\u043e\u0442\u044f\u0433\u0438\u0432\u0430\u0442\u044c \u0435\u0451 \u0434\u043e \u043b\u0438\u043c\u0438\u0442\u0430 \u043e\u043a\u043d\u0430.", "Sliding window (\u043f\u0440\u043e\u0441\u0442\u043e \u043e\u0442\u0440\u0435\u0437\u0430\u0442\u044c \u0441\u0442\u0430\u0440\u044b\u0435 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f) - \u0441\u0430\u043c\u044b\u0439 \u0433\u0440\u0443\u0431\u044b\u0439 \u0432\u0430\u0440\u0438\u0430\u043d\u0442 \u043a\u043e\u043c\u043f\u0440\u0435\u0441\u0441\u0438\u0438: \u0434\u0451\u0448\u0435\u0432\u043e \u0440\u0435\u0430\u043b\u0438\u0437\u043e\u0432\u0430\u0442\u044c, \u043d\u043e \u0430\u0433\u0435\u043d\u0442 \u0431\u0443\u043a\u0432\u0430\u043b\u044c\u043d\u043e \u0437\u0430\u0431\u044b\u0432\u0430\u0435\u0442, \u043e \u0447\u0451\u043c \u0434\u043e\u0433\u043e\u0432\u043e\u0440\u0438\u043b\u0438\u0441\u044c 20 \u0448\u0430\u0433\u043e\u0432 \u043d\u0430\u0437\u0430\u0434 - \u0434\u043b\u044f \u043c\u043d\u043e\u0433\u043e\u0448\u0430\u0433\u043e\u0432\u044b\u0445 \u0437\u0430\u0434\u0430\u0447 \u044d\u0442\u043e \u043f\u0440\u044f\u043c\u043e\u0439 \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a \u0431\u0430\u0433\u043e\u0432 '\u0430\u0433\u0435\u043d\u0442 \u043e\u043f\u044f\u0442\u044c \u043f\u0435\u0440\u0435\u0441\u043f\u0440\u0430\u0448\u0438\u0432\u0430\u0435\u0442 \u0442\u043e \u0436\u0435 \u0441\u0430\u043c\u043e\u0435'."], "code": {"title": "\u041e\u0431\u0440\u0435\u0437\u043a\u0430 \u0438\u0441\u0442\u043e\u0440\u0438\u0438 \u043f\u043e \u0431\u044e\u0434\u0436\u0435\u0442\u0443 \u0442\u043e\u043a\u0435\u043d\u043e\u0432", "lang": "python", "body": "def fit_to_budget(messages: list[dict], max_tokens: int, count_fn) -> list[dict]:\n    system, *history = messages\n    kept = [system]\n    used = count_fn(str(system[\"content\"]))\n\n    for msg in reversed(history):\n        n = count_fn(str(msg[\"content\"]))\n        if used + n > max_tokens:\n            break\n        kept.insert(1, msg)\n        used += n\n\n    return kept\n"}, "hw": [{"t": "\u0421\u0447\u0451\u0442\u0447\u0438\u043a \u0442\u043e\u043a\u0435\u043d\u043e\u0432 \u043f\u0440\u043e\u043c\u043f\u0442\u0430", "d": "\u0424\u0443\u043d\u043a\u0446\u0438\u044f count_prompt_tokens(system, tools_schema, history) -> dict[str, int], \u0441\u0447\u0438\u0442\u0430\u044e\u0449\u0430\u044f \u0442\u043e\u043a\u0435\u043d\u044b \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e \u043f\u043e \u043a\u0430\u0436\u0434\u043e\u043c\u0443 \u043a\u043e\u043c\u043f\u043e\u043d\u0435\u043d\u0442\u0443 \u043f\u0440\u043e\u043c\u043f\u0442\u0430 \u043b\u044e\u0431\u044b\u043c \u0434\u043e\u0441\u0442\u0443\u043f\u043d\u044b\u043c \u0442\u043e\u043a\u0435\u043d\u0430\u0439\u0437\u0435\u0440\u043e\u043c.", "done": "\u041d\u0430 \u0440\u0435\u0430\u043b\u044c\u043d\u043e\u043c \u0434\u0438\u0430\u043b\u043e\u0433\u0435 \u0442\u0432\u043e\u0435\u0433\u043e \u0430\u0433\u0435\u043d\u0442\u0430 \u0444\u0443\u043d\u043a\u0446\u0438\u044f \u043f\u0435\u0447\u0430\u0442\u0430\u0435\u0442 \u0440\u0430\u0437\u0431\u0438\u0432\u043a\u0443 \u043f\u043e \u043a\u043e\u043c\u043f\u043e\u043d\u0435\u043d\u0442\u0430\u043c, \u0438 \u044f\u0432\u043d\u043e \u0432\u0438\u0434\u043d\u043e, \u043a\u0430\u043a\u043e\u0439 \u0438\u0437 \u043d\u0438\u0445 \u0434\u043e\u043c\u0438\u043d\u0438\u0440\u0443\u0435\u0442."}, {"t": "\u041e\u0431\u0440\u0435\u0437\u043a\u0430 \u0438\u0441\u0442\u043e\u0440\u0438\u0438 \u043f\u043e \u0431\u044e\u0434\u0436\u0435\u0442\u0443", "d": "fit_to_budget(messages, max_tokens, count_fn) -> list[dict], \u043a\u043e\u0442\u043e\u0440\u0430\u044f \u0432\u0441\u0435\u0433\u0434\u0430 \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u0442 system prompt \u0438 \u043e\u0431\u0440\u0435\u0437\u0430\u0435\u0442 \u0438\u0441\u0442\u043e\u0440\u0438\u044e \u0441 \u043d\u0430\u0447\u0430\u043b\u0430, \u043f\u043e\u043a\u0430 \u043d\u0435 \u0432\u043b\u0435\u0437\u0435\u0442 \u0432 \u043b\u0438\u043c\u0438\u0442.", "done": "\u0422\u0435\u0441\u0442 \u043d\u0430 \u0438\u0441\u043a\u0443\u0441\u0441\u0442\u0432\u0435\u043d\u043d\u043e \u0434\u043b\u0438\u043d\u043d\u043e\u0439 \u0438\u0441\u0442\u043e\u0440\u0438\u0438 \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442: system prompt \u043d\u0438\u043a\u043e\u0433\u0434\u0430 \u043d\u0435 \u0442\u0435\u0440\u044f\u0435\u0442\u0441\u044f, \u0438\u0442\u043e\u0433\u043e\u0432\u044b\u0439 \u0440\u0430\u0437\u043c\u0435\u0440 \u043d\u0435 \u043f\u0440\u0435\u0432\u044b\u0448\u0430\u0435\u0442 max_tokens."}, {"t": "\u0421\u0443\u043c\u043c\u0430\u0440\u0438\u0437\u0430\u0446\u0438\u044f \u0441\u0442\u0430\u0440\u043e\u0439 \u0438\u0441\u0442\u043e\u0440\u0438\u0438", "d": "\u041a\u043e\u0433\u0434\u0430 \u0438\u0441\u0442\u043e\u0440\u0438\u044f \u0430\u0433\u0435\u043d\u0442\u0430 \u043f\u0440\u0435\u0432\u044b\u0448\u0430\u0435\u0442 \u043f\u043e\u0440\u043e\u0433 (\u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440 20 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0439), \u0437\u0430\u043c\u0435\u043d\u0438\u0442\u044c \u0441\u0430\u043c\u044b\u0435 \u0441\u0442\u0430\u0440\u044b\u0435 N \u043d\u0430 \u043e\u0434\u043d\u043e \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435-\u0440\u0435\u0437\u044e\u043c\u0435, \u0441\u0433\u0435\u043d\u0435\u0440\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0435 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u043c LLM-\u0432\u044b\u0437\u043e\u0432\u043e\u043c.", "done": "\u041f\u043e 36\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u0434\u043b\u044f \u0430\u0433\u0435\u043d\u0442\u043d\u044b\u0445 \u0446\u0438\u043a\u043b\u043e\u0432 \u0441 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430\u043c\u0438"], "c": 0, "e": "\u041a\u044d\u0448 - \u044d\u0442\u043e \u0441\u043e\u0432\u043f\u0430\u0434\u0435\u043d\u0438\u0435 \u043f\u0440\u0435\u0444\u0438\u043a\u0441\u0430 \u0431\u0430\u0439\u0442 \u0432 \u0431\u0430\u0439\u0442. \u041b\u044e\u0431\u043e\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435, \u043c\u0435\u043d\u044f\u044e\u0449\u0435\u0435\u0441\u044f \u043a\u0430\u0436\u0434\u044b\u0439 \u0437\u0430\u043f\u0440\u043e\u0441 (timestamp, uuid, \u043d\u0435\u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0439 JSON), \u0432 \u043d\u0430\u0447\u0430\u043b\u0435 \u043f\u0440\u043e\u043c\u043f\u0442\u0430 \u0440\u0432\u0451\u0442 \u043a\u044d\u0448 \u043d\u0430 \u043a\u0430\u0436\u0434\u043e\u043c \u0432\u044b\u0437\u043e\u0432\u0435 - \u043a\u043b\u0430\u0441\u0441\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043d\u0435\u0437\u0430\u043c\u0435\u0442\u043d\u044b\u0439 \u0431\u0430\u0433. \u0414\u043b\u0438\u043d\u0430 \u043f\u0440\u043e\u043c\u043f\u0442\u0430 \u0438 \u043d\u0430\u043b\u0438\u0447\u0438\u0435 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432 \u0441\u0430\u043c\u0438 \u043f\u043e \u0441\u0435\u0431\u0435 \u043a\u044d\u0448 \u043d\u0435 \u043b\u043e\u043c\u0430\u044e\u0442."}, {"q": "\u0427\u0435\u043c \u0438\u0437\u0431\u0438\u0440\u0430\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u043e\u0447\u0438\u0441\u0442\u043a\u0430 \u0441\u0442\u0430\u0440\u044b\u0445 tool_result \u043e\u0442\u043b\u0438\u0447\u0430\u0435\u0442\u0441\u044f \u043e\u0442 \u0441\u0443\u043c\u043c\u0430\u0440\u0438\u0437\u0430\u0446\u0438\u0438 \u0438\u0441\u0442\u043e\u0440\u0438\u0438 \u0434\u0438\u0430\u043b\u043e\u0433\u0430?", "a": ["\u042d\u0442\u043e \u0434\u0432\u0430 \u043d\u0430\u0437\u0432\u0430\u043d\u0438\u044f \u043e\u0434\u043d\u043e\u0433\u043e \u0438 \u0442\u043e\u0433\u043e \u0436\u0435 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430", "\u041e\u0447\u0438\u0441\u0442\u043a\u0430 \u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u044b\u0439 \u0442\u0438\u043f \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u043c\u043e\u0433\u043e (\u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440 \u0441\u0442\u0430\u0440\u044b\u0435 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432), \u043d\u0435 \u0442\u0440\u043e\u0433\u0430\u044f \u043e\u0441\u0442\u0430\u043b\u044c\u043d\u0443\u044e \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0443 \u0434\u0438\u0430\u043b\u043e\u0433\u0430; \u0441\u0443\u043c\u043c\u0430\u0440\u0438\u0437\u0430\u0446\u0438\u044f \u0437\u0430\u043c\u0435\u043d\u044f\u0435\u0442 \u0441\u043c\u044b\u0441\u043b \u0441\u0442\u0430\u0440\u044b\u0445 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0439 \u0442\u0435\u043a\u0441\u0442\u043e\u0432\u044b\u043c \u043f\u0435\u0440\u0435\u0441\u043a\u0430\u0437\u043e\u043c", "\u0421\u0443\u043c\u043c\u0430\u0440\u0438\u0437\u0430\u0446\u0438\u044f \u0431\u044b\u0441\u0442\u0440\u0435\u0435 \u0438 \u0434\u0435\u0448\u0435\u0432\u043b\u0435, \u043f\u043e\u0442\u043e\u043c\u0443 \u0447\u0442\u043e \u043d\u0435 \u0442\u0440\u0435\u0431\u0443\u0435\u0442 \u0434\u043e\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0432\u044b\u0437\u043e\u0432\u0430 \u043c\u043e\u0434\u0435\u043b\u0438", "\u041e\u0447\u0438\u0441\u0442\u043a\u0430 \u043f\u0440\u0438\u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u043a system prompt, \u0441\u0443\u043c\u043c\u0430\u0440\u0438\u0437\u0430\u0446\u0438\u044f - \u0442\u043e\u043b\u044c\u043a\u043e \u043a \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f\u043c \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044f"], "c": 1, "e": "\u042d\u0442\u043e \u0440\u0430\u0437\u043d\u044b\u0435 \u043c\u0435\u0445\u0430\u043d\u0438\u0437\u043c\u044b: \u043e\u0447\u0438\u0441\u0442\u043a\u0430 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u043d\u0430\u044f (\u0443\u0431\u0440\u0430\u0442\u044c \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u044b\u0435 \u0431\u043b\u043e\u043a\u0438 \u043f\u043e \u0442\u0438\u043f\u0443), \u0441\u0443\u043c\u043c\u0430\u0440\u0438\u0437\u0430\u0446\u0438\u044f \u0441\u043c\u044b\u0441\u043b\u043e\u0432\u0430\u044f (\u043f\u0435\u0440\u0435\u0441\u043a\u0430\u0437\u0430\u0442\u044c \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u043c\u043e\u0435). \u0421\u0443\u043c\u043c\u0430\u0440\u0438\u0437\u0430\u0446\u0438\u044f \u043a\u0430\u043a \u0440\u0430\u0437 \u043e\u0431\u044b\u0447\u043d\u043e \u0442\u0440\u0435\u0431\u0443\u0435\u0442 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0432\u044b\u0437\u043e\u0432\u0430 \u043c\u043e\u0434\u0435\u043b\u0438 - \u044d\u0442\u043e \u043d\u0435 \u0431\u0435\u0441\u043f\u043b\u0430\u0442\u043d\u0430\u044f \u043e\u043f\u0435\u0440\u0430\u0446\u0438\u044f."}, {"q": "\u0410\u0433\u0435\u043d\u0442 \u0441\u043e\u0431\u0438\u0440\u0430\u0435\u0442 \u043f\u0440\u043e\u043c\u043f\u0442 \u0432 \u043f\u043e\u0440\u044f\u0434\u043a\u0435: \u0441\u043f\u0438\u0441\u043e\u043a \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432, system prompt, \u0438\u0441\u0442\u043e\u0440\u0438\u044f \u0434\u0438\u0430\u043b\u043e\u0433\u0430, \u0442\u0435\u043a\u0443\u0449\u0438\u0439 \u0432\u043e\u043f\u0440\u043e\u0441. \u041e\u0442 \u0437\u0430\u043f\u0440\u043e\u0441\u0430 \u043a \u0437\u0430\u043f\u0440\u043e\u0441\u0443 \u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u0442\u0435\u043a\u0443\u0449\u0438\u0439 \u0432\u043e\u043f\u0440\u043e\u0441. \u0427\u0442\u043e \u0432\u0435\u0440\u043d\u043e \u043f\u0440 \u0434\u0443 node/edge/state \u0438 \u043f\u0440\u043e\u0441\u0442\u043e \u0446\u0438\u043a\u043b\u043e\u043c while. \u0412 \u043f\u0440\u043e\u0434\u0435 \u0438\u043c\u0435\u043d\u043d\u043e checkpointer \u0440\u0435\u0448\u0430\u0435\u0442 \u0437\u0430\u0434\u0430\u0447\u0443 '\u043a\u043b\u0438\u0435\u043d\u0442 \u0437\u0430\u043a\u0440\u044b\u043b \u0432\u043a\u043b\u0430\u0434\u043a\u0443 \u043d\u0430 \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0435 \u0434\u043e\u043b\u0433\u043e\u0433\u043e \u0430\u0433\u0435\u043d\u0442\u0430', \u043a\u043e\u0442\u043e\u0440\u0443\u044e \u0440\u0443\u043a\u0430\u043c\u0438 (w4-fc) \u043f\u0440\u0438\u0448\u043b\u043e\u0441\u044c \u0431\u044b \u0440\u0435\u0448\u0430\u0442\u044c \u0437\u0430\u043d\u043e\u0432\u043e \u0434\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u043f\u0440\u043e\u0435\u043a\u0442\u0430.", "key": ["StateGraph \u0441\u0442\u0440\u043e\u0438\u0442\u0441\u044f \u0432\u043e\u043a\u0440\u0443\u0433 \u044f\u0432\u043d\u043e\u0439 \u0441\u0445\u0435\u043c\u044b \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u044f (TypedDict \u0438\u043b\u0438 Pydantic-\u043c\u043e\u0434\u0435\u043b\u044c) - \u043a\u0430\u0436\u0434\u044b\u0439 node \u044d\u0442\u043e \u0444\u0443\u043d\u043a\u0446\u0438\u044f (state) -> partial_state, \u0430 \u043d\u0435 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u043b\u044c\u043d\u044b\u0439 \u043a\u043e\u0434 \u0441 \u043f\u043e\u0431\u043e\u0447\u043d\u044b\u043c\u0438 \u044d\u0444\u0444\u0435\u043a\u0442\u0430\u043c\u0438 \u0433\u0434\u0435 \u043f\u043e\u043f\u0430\u043b\u043e; \u0433\u0440\u0430\u0444 \u044f\u0432\u043d\u043e \u043e\u043f\u0438\u0441\u044b\u0432\u0430\u0435\u0442, \u043a\u0430\u043a\u0438\u0435 \u043f\u043e\u043b\u044f \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u044f \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0443\u044e\u0442 \u0438 \u043a\u0430\u043a \u043e\u043d\u0438 \u043e\u0431\u043d\u043e\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u043c\u0435\u0436\ 43\u0441\u0442\u043e\u0439\u0447\u0438\u0432\u043e\u0441\u0442\u0438: \u0435\u0441\u043b\u0438 \u043f\u0440\u043e\u0446\u0435\u0441\u0441 \u0443\u043f\u0430\u043b \u043d\u0430 \u043f\u044f\u0442\u043e\u043c node \u0438\u0437 \u0434\u0435\u0441\u044f\u0442\u0438, \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 invoke \u0441 \u0442\u0435\u043c \u0436\u0435 thread_id \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0438\u0442 \u0441 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0435\u0433\u043e \u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d\u043d\u043e\u0433\u043e \u0448\u0430\u0433\u0430, \u0430 \u043d\u0435 \u0441 \u043d\u0443\u043b\u044f. InMemorySaver \u0442\u0435\u0440\u044f\u0435\u0442 \u0432\u0441\u0451 \u043f\u0440\u0438 \u0440\u0435\u0441\u0442\u0430\u0440\u0442\u0435 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430 - \u0434\u043b\u044f \u043f\u0440\u043e\u0434\u0430 \u043d\u0443\u0436\u0435\u043d \u043f\u0435\u0440\u0441\u0438\u0441\u0442\u0435\u043d\u0442\u043d\u044b\u0439 checkpointer \u043f\u043e\u0432\u0435\u0440\u0445 \u0411\u0414.", "Human-in-the-loop \u0434\u0435\u043b\u0430\u0435\u0442\u0441\u044f \u0447\u0435\u0440\u0435\u0437 interrupt(value) \u0432\u043d\u0443\u0442\u0440\u0438 node: \u0432\u044b\u0437\u043e\u0432 \u043e\u0441\u0442\u0430\u043d\u0430\u0432\u043b\u0438\u0432\u0430\u0435\u0442 \u0433\u0440\u0430\u0444 \u0438 \u043e\u0442\u0434\u0430\u0451\u0442 value \u043d\u0430\u0440\u0443\u0436\u0443 \u0432\u043c\u0435\u0441\u0442\u043e \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0435\u043d\u0438\u044f \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u044f. \u0412\u043e\u0437\u043e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u0435 - \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u043c \u0432\u044b\u0437\u043e\u0432\u043e\u043c graph.invoke(Command(resume=\u043e\u0442\u0432\u0435\u0442), config) \u0441 \u0442\u0435\u043c \u0436\u0435 thread_id; \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435, \u043a\u043e\u0442\u043e\u0440\u043e\u0435 interrupt() \u0432\u0435\u0440\u043d\u0451\u0442 \u0432\u043d\u0443\u0442\u0440\u0438 node, \u044d\u0442\u043e \u0438 \u0435\u0441\u0442\u044c \u0442\u043e, \u0447\u0442\u043e \u043f\u0435\u0440\u0435\u0434\u0430\u043b\u0438 \u0432 resume.", "\u0413\u0440\u0430\u0444 - \u044d\u0442\u043e \u0432 \u043f\u0435\u0440\u0432\u0443\u044e \u043e\u0447\u0435\u0440\u0435\u0434\u044c \u044f\u0432\u043d\u043e\u0441\u0442\u044c: \u043b\u043e\u0433\u0438\u043a\u0443 \u0432\u0438\u0434\u0430 '\u0441\u043f\u043b\u0430\u043d\u0438\u0440\u043e\u0432\u0430\u0442\u044c -> \u0432\u044b\u043f\u043e\u043b\u043d\u0438\u0442\u044c -> \u043f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c -> \u043f\u0440\u0438 \u043e\u0448\u0438\u0431\u043a\u0435 \u0432\u0435\u0440\u043d\u0443\u0442\u044c\u0441\u044f \u043d\u0430 \u0448\u0430\u0433 \u043d\u0430\u0437\u0430\u0434' \u0442\u044f\u0436\u0435\u043b\u043e \u0447\u0438\u0442\u0430\u0442\u044c \u043a\u0430\u043a \u0432\u043b\u043e\u0436\u0435\u043d\u043d\u044b\u0435 if/while \u0432 \u0446\u0438\u043a\u043b\u0435 \u0430\u0433\u0435\u043d\u0442\u0430 \u0440\u0443\u043a\u0430\u043c\u0438, \u043d\u043e \u043b\u0435\u0433\u043a\u043e - \u043a\u0430\u043a \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u043e node \u0438 conditional edge \u043c\u0435\u0436\u0434\u0443 \u043d\u0438\u043c\u0438. \u041f\u043b\u0430\u0442\u0430 - \u0435\u0449\u0451 \u043e\u0434\u043d\u0430 \u0430\u0431\u0441\u0442\u0440\u0430\u043a\u0446\u0438\u044f \u0438 \u0435\u0451 \u0431\u0430\u0433\u0438, \u0430 \u043d\u0435 \u0432\u0441\u0435\u0433\u0434\u0430 \u0447\u0438\u0441\u0442\u044b\u0439 \u0432\u044b\u0438\u0433\u0440\u044b\u0448 \u0434\u043b\u044f \u043f\u0440\u043e\u0441\u0442\u043e\u0433\u043e \u043b\u0438\u043d\u0435\u0439\u043d\u043e\u0433\u043e \u0446\u0438\u043a\u043b\u0430.", "PydanticAI - \u0431\u043e\u043b\u0435\u0435 \u043b\u0451\u0433\u043a\u0430\u044f \u0430\u043b\u044c\u0442\u0435\u0440\u043d\u0430\u0442\u0438\u0432\u0430: \u0432\u043c\u0435\u0441\u0442\u043e \u0433\u0440\u0430\u0444\u0430 \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u0439 - \u0430\u0433\u0435\u043d\u0442 \u0441 \u0442\u0438\u043f\u0438\u0437\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u043c \u0432\u044b\u0432\u043e\u0434\u043e\u043c \u0447\u0435\u0440\u0435\u0437 Pydantic-\u043c\u043e\u0434\u0435\u043b\u0438 (output_type=...) \u0438 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430\u043c\u0438 \u0447\u0435\u0440\u0435\u0437 \u0434\u0435\u043a\u043e\u0440\u0430\u0442\u043e\u0440 @agent.tool, \u043f\u043e\u043b\u0443\u0447\u0430\u044e\u0449\u0438\u0439 RunContext \u0441 \u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e\u0441\u0442\u044f\u043c\u0438. \u042f\u0432\u043d\u043e\u0433\u043e \u0433\u0440\u0430\u0444\u0430 \u0438 checkpoint \u0438\u0437 \u043a\u043e\u0440\u043e\u0431\u043a\u0438 \u0442\u0430\u043c \u043d\u0435\u0442 - \u0434\u043b\u044f \u0432\u0435\u0442\u0432\u044f\u0449\u0438\u0445\u0441\u044f \u0441\u0446\u0435\u043d\u0430\u0440\u0438\u0435\u0432 \u0435\u0441\u0442\u044c \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u0435 \u0440\u0430\u0441\u0448\u0438\u0440\u0435\u043d\u0438\u0435 pydantic-graph, \u0430 \u043d\u0435 \u0432\u0441\u0442\u0440\u043e\u0435\u043d\u043d\u043e\u0435 \u043f\u043e\u0432\u0435\u0434\u0435\u043d\u0438\u0435 \u0431\u0430\u0437\u043e\u0432\u043e\u0433\u043e \u0430\u0433\u0435\u043d\u0442\u0430.", "\u0412\u044b\u0431\u043e\u0440 \u043d\u0430 \u043f\u0440\u0430\u043a\u0442\u0438\u043a\u0435: PydanticAI \u0431\u044b\u0441\u0442\u0440\u0435\u0435 \u043d\u0430\u043f\u0438\u0441\u0430\u0442\u044c \u0434\u043b\u044f \u043f\u0440\u043e\u0441\u0442\u043e\u0433\u043e \u0430\u0433\u0435\u043d\u0442\u0430 \u0441 \u0447\u0451\u0442\u043a\u0438\u043c\u0438 \u0442\u0438\u043f\u0430\u043c\u0438 \u0432\u0445\u043e\u0434\u0430/\u0432\u044b\u0445\u043e\u0434\u0430, LangGraph \u043e\u043f\u0440\u0430\u0432\u0434\u0430\u043d, \u043a\u043e\u0433\u0434\u0430 \u0440\u0435\u0430\u043b\u044c\u043d\u043e \u043d\u0443\u0436\u043d\u044b \u0432\u0435\u0442\u0432\u043b\u0435\u043d\u0438\u0435, \u043f\u0435\u0440\u0441\u0438\u0441\u0442\u0435\u043d\u0442\u043d\u043e\u0441\u0442\u044c \u043c\u0435\u0436\u0434\u0443 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430\u043c\u0438 \u0438 \u043f\u0430\u0443\u0437\u0430 \u043d\u0430 \u0447\u0435\u043b\u043e\u0432\u0435\u043a\u0430 - \u0442\u043e \u0435\u0441\u0442\u044c \u0440\u043e\u0432\u043d\u043e \u0442\u043e, \u0447\u0442\u043e \u043e\u043f\u0438\u0441\u044b\u0432\u0430\u0435\u0442 \u044d\u0442\u0430 \u0442\u0435\u043c\u0430."], "code": {"title": "\u0413\u0440\u0430\u0444 \u0441 human-in-the-loop \u0438 checkpointer", "lang": "python", "body": "from langgraph.graph import StateGraph, START, END\nfrom langgraph.checkpoint.memory import InMemorySaver\nfrom langgraph.types import interrupt, Command\ndef ask_approval(state: dict) -> dict:\n    ok = interrupt(f\"\u0412\u044b\u043f\u043e\u043b\u043d\u0438\u0442\u044c: {state['question']}?\")\n    return {\"answer\": \"done\" if ok else \"cancelled\"}\ngraph = StateGraph(dict)\ngraph.add_node(\"approval\", ask_approval)\ngraph.add_edge(START, \"approval\")\ngraph.add_edge(\"approval\", END)\napp = graph.compile(checkpointer=InMemorySaver())\nconfig = {\"configurable\": {\"thread_id\": \"t1\"}}\napp.invoke({\"question\": \"\u0443\u0434\u0430\u043b\u0438\u0442\u044c \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\"}, config)\napp.invoke(Command(resume=True), config)  # \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0438\u0442\u044c \u043f\u043e\u0441\u043b\u0435 \u043f\u0430\u0443\u0437\u044b\n"}, "hw": [{"t": "\u041f\u0435\u0440\u0435\u043d\u0435\u0441\u0442\u0438 \u0446\u0438\u043a\u043b \u0430\u0433\u0435\u043d\u0442\u0430 \u043d\u0430 LangGraph", "d": "\u0412\u0437\u044f\u0442\u044c \u0446\u0438\u043a\u043b \u0430\u0433\u0435\u043d\u0442\u0430 \u0438\u0437 w4-fc \u0438 \u043f\u0435\u0440\u0435\u043f\u0438\u0441\u0430\u0442\u044c \u043a\u0430\u043a \u0433\u0440\u0430\u0444: node call_model, node call_tools, conditional edge \u043c\u0435\u0436\u0434\u0443 \u043d\u0438\u043c\u0438 \u043f\u043e \u043d\u0430\u043b\u0438\u0447\u0438\u044e tool_calls \u0432 \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u0438.", "done": "\u0422\u043e\u0442 \u0436\u0435 \u0442\u0435\u0441\u0442\u043e\u0432\u044b\u0439 \u0434\u0438\u0430\u043b\u043e\u0433, \u0447\u0442\u043e \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u043b \u0440\u0443\u0447\u043d\u043e\u0439 \u0446\u0438\u043a\u043b, \u0434\u0430\u0451\u0442 \u0438\u0434\u0435\u043d\u0442\u0438\u0447\u043d\u044b\u0439 \u0444\u0438\u043d\u0430\u043b\u044c\u043d\u044b\u0439 \u043e\u0442\u0432\u0435\u0442 \u0447\u0435\u0440\u0435\u0437 graph.invoke."}, {"t": "\u041f\u0435\u0440\u0441\u0438\u0441\u0442\u0435\u043d\u0442\u043d\u043e\u0441\u0442\u044c \u043c\u0435\u0436\u0434\u0443 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430\u043c\u0438", "d": "\u041f\u043e\u0434\u043a\u043b\u044e\u0447\u0438\u0442\u044c \u043f\u043e\u0441\u0442\u043e\u044f\u043d\u043d\u044b\u0439 checkpointer (\u043d\u0435 InMemorySaver, \u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440 \u043d\u0430 SQLite) \u043a \u0433\u0440\u0430\u0444\u0443.", "done": "\u0417\u0430\u043f\u0443\u0441\u0442\u0438\u0442\u044c \u043f\u0440\u043e\u0446\u0435\u0441\u0441, \u0434\u043e\u0432\u0435\u0441\u0442\u0438 \u0433\u0440\u0430\u0444 \u0434\u043e \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u044b, \u0443\u0431\u0438\u0442\u044c \u043f\u0440\u043e\u0446\u0435\u0441\u0441, \u0437\u0430\u043f\u0443\u0441\u0442\u0438\u0442\u044c \u0437\u0430\u043d\u043e\u0432\u043e \u0441 \u0442\u0435\u043c \u0436\u0435 thread_id - \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435 \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0430\u0435\u0442\u0441\u044f, \u0430 \u043d\u0435 \u043d\u0430\u0447\u0438\u043d\u0430\u0435\u0442\u0441\u044f \u0441 \u043d\u0430\u0447\u0430\u043b\u0430."}, {"t": "Human-in-the-loop \u043d\u0430 \u043e\u043f\u0430\u0441\u043d\u043e\u043c \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0438", "d": "\u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c node, \u043a\u043e\u0442\u043e\u0440\u0430\u044f \u043f\u0435\u0440\u0435\u0434 \u0432\u044b\u0437\u043e\u0432\u043e\u043c \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 create_task (\u0438\u043b\u0438 \u043b\u044e\u0431\u043e\u0433\u043e '\u043f\u0438\u0448\u0443\u0449\u0435\u0433\u043e' \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430) \u0434\u0435\u043b\u0430\u0435\u0442 interrupt() \u0441 \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u0435\u043c \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f \u0438 \u0432\u043e\u0437\u043e\u0431\u043d\u043e\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u043e \u044f\u0432\u043d\u043e\u043c\u0443 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0438\u044e.", "done": "graph.invoke \u043e\u0441\u0442\u0430\u043d\u0430\u0432\u043b\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u043d\u0430 interrupt, \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u044b\u0439 \u0432\u044b\u0437\u043e\u0432 \u0441 Command(resume=True) \u0438 \u0442\u0435\u043c \u0436\u0435 thread_id \u0434\u043e\u0432\u043e\u0434\u0438\u0442 \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435 \u0434\u043e \u043a\u043e\u043d\u0446\u0430; \u043f\u0440\u0438 resume=False \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u043d\u0435 \u0432\u044b\u0437\u044b\u0432\u0430\u0435\u0442\u0441\u044f."}, {"t": "\u041c\u0438\u043d\u0438-\u0441\u0440\u0430\u0432\u043d\u0435\u043d\u0438\u0435 \u0441 PydanticAI", "d": "\u0422\u043e\u0442 \u0436\u0435 \u043f\u0440\u043e\u0441\u0442\u043e\u0439 \u0441\u0446\u0435\u043d\u0430\u0440\u0438\u0439 (1 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442, \u0431\u0435\u0437 \u0432\u0435\u0442\u0432\u043b\u0435\u043d\u0438\u044f) \u0440\u0435\u0430\u043b\u0438\u0437\u043e\u0432\u0430\u0442\u044c \u043d\u0430 PydanticAI \u0447\u0435\u0440\u0435\u0437 Agent \u0438 @agent.tool.", "done": "\u041a\u043e\u0440\u043e\u0442\u043a\u0430\u044f \u0437\u0430\u043c\u0435\u0442\u043a\u0430 \u0432 notes/: \u0441\u043a\u043e\u043b\u044c\u043a\u043e \u0441\u0442\u0440\u043e\u043a \u043a\u043e\u0434\u0430 \u0438 \u043a\u0430\u043a\u0438\u0435 \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u0438 \u043f\u0440\u0438\u0448\u043b\u043e\u0441\u044c \u0432\u044b\u043a\u0438\u043d\u0443\u0442\u044c \u0438\u043b\u0438 \u0434\u043e\u0431\u0430\u0432\u0438\u0442\u044c \u043f\u043e \u0441\u0440\u0430\u0432\u043d\u0435\u043d\u0438\u044e \u0441 LangGraph-\u0432\u0435\u0440\u0441\u0438\u0435\u0439."}], "check": ["\u0427\u0435\u043c node \u0432 LangGraph \u043f\u0440\u0438\u043d\u0446\u0438\u043f\u0438\u0430\u043b\u044c\u043d\u043e \u043e\u0442\u043b\u0438\u0447\u0430\u0435\u0442\u0441\u044f \u043e\u0442 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u043b\u044c\u043d\u043e\u0439 \u0444\u0443\u043d\u043a\u0446\u0438\u0438 \u0432 \u0446\u0438\u043a\u043b\u0435 \u0430\u0433\u0435\u043d\u0442\u0430 \u0440\u0443\u043a\u0430\u043c\u0438 \u0438\u0437 w4-fc?", "\u0427\u0442\u043e \u0438\u043c\u0435\u043d\u043d\u043e \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u0442 checkpointer \u0438 \u043a \u0447\u0435\u043c\u0443 \u043e\u043d \u043f\u0440\u0438\u0432\u044f\u0437\u0430\u043d - \u043a \u0434\u0438\u0430\u043b\u043e\u0433\u0443, \u043a \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044e, \u043a \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0443?", "\u0427\u0442\u043e \u043f\u0440\u043e\u0438\u0437\u043e\u0439\u0434\u0451\u0442, \u0435\u0441\u043b\u0438 \u0432\u044b\u0437\u0432\u0430\u0442\u044c interrupt() \u0432\u043d\u0443\u0442\u0440\u0438 node \u0433\u0440\u0430\u0444\u0430, \u0441\u043a\u043e\u043c\u043f\u0438\u043b\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0433\u043e \u0431\u0435\u0437 checkpointer?", "\u041f\u043e\u0447\u0435\u043c\u0443 InMemorySaver \u043d\u0435 \u043f\u043e\u0434\u0445\u043e\u0434\u0438\u0442 \u0434\u043b\u044f \u043f\u0440\u043e\u0434\u0430, \u0434\u0430\u0436\u0435 \u0435\u0441\u043b\u0438 \u043b\u043e\u0433\u0438\u043a\u0430 \u0433\u0440\u0430\u0444\u0430 \u043f\u043e\u043b\u043d\u043e\u0441\u0442\u044c\u044e \u0440\u0430\u0431\u043e\u0447\u0430\u044f?", "\u0412 \u043a\u0430\u043a\u043e\u043c \u0441\u043b\u0443\u0447\u0430\u0435 \u0442\u044b \u0432\u044b\u0431\u0435\u0440\u0435\u0448\u044c PydanticAI \u0432\u043c\u0435\u0441\u0442\u043e LangGraph \u0434\u043b\u044f \u043d\u043e\u0432\u043e\u0433\u043e \u0430\u0433\u0435\u043d\u0442\u0430 - \u0438 \u043d\u0430\u043e\u0431\u043e\u0440\u043e\u0442?"], "quiz": [{"q": "\u0413\u0440\u0430\u0444 \u043e\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u043b\u0441\u044f \u043d\u0430 interrupt() \u0432\u043d\u0443\u0442\u0440\u0438 node approval. \u041a\u0430\u043a \u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u043e \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0438\u0442\u044c \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435 \u0441 \u043e\u0442\u0432\u0435\u0442\u043e\u043c \u0447\u0435\u043b\u043e\u0432\u0435\u043a\u0430?", "a": ["\u0412\u044b\u0437\u0432\u0430\u0442\u044c graph.invoke() \u0437\u0430\u043d\u043e\u0432\u043e \u0441 \u0442\u0435\u043c \u0436\u0435 \u0432\u0445\u043e\u0434\u043d\u044b\u043c state, \u0447\u0442\u043e \u0438 \u0432 \u043f\u0435\u0440\u0432\u044b\u0439 \u0440\u0430\u0437", "\u0412\u044b\u0437\u0432\u0430\u0442\u044c graph.invoke(Command(resume=\u043e\u0442\u0432\u0435\u0442), config) \u0441 \u0442\u0435\u043c \u0436\u0435 thread_id, \u0447\u0442\u043e \u0438 \u0432 \u043f\u0435\u0440\u0432\u043e\u043c \u0432\u044b\u0437\u043e\u0432\u0435", "\u0421\u043e\u0437\u0434\u0430\u0442\u044c \u043d\u043e\u0432\u044b\u0439 \u0433\u0440\u0430\u0444 \u0438 \u043f\u0435\u0440\u0435\u0434\u0430\u0442\u044c \u0435\u043c\u0443 \u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d\u043d\u044b\u0439 checkpoint \u0432\u0440\u0443\u0447\u043d\u0443\u044e", "\u0418\u0437\u043c\u0435\u043d\u0438\u0442\u044c state \u043d\u0430\u043f\u0440\u044f\u043c\u0443\u044e \u0432 checkpointer \u0438 \u0432\u044b\u0437\u0432\u0430\u0442\u044c graph.invoke({}, config)"], "c": 1, "e": "Command(resume=...) - \u0441\u043f\u0435\u0446\u0438\u0430\u043b\u044c\u043d\u044b\u0439 \u0441\u0438\u0433\u043d\u0430\u043b, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 LangGraph \u043f\u043e\u0434\u0441\u0442\u0430\u0432\u043b\u044f\u0435\u0442 \u043a\u0430\u043a \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u043c\u043e\u0435 \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435 interrupt() \u0432\u043d\u0443\u0442\u0440\u0438 node, \u0438 \u0433\u0440\u0430\u0444 \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0430\u0435\u0442 \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435 \u0441 \u044d\u0442\u043e\u0439 \u0442\u043e\u0447\u043a\u0438. thread_id \u0434\u043e\u043b\u0436\u0435\u043d \u0441\u043e\u0432\u043f\u0430\u0434\u0430\u0442\u044c, \u0438\u043d\u0430\u0447\u0435 \u0433\u0440\u0430\u0444 \u043d\u0435 \u043d\u0430\u0439\u0434\u0451\u0442, \u0441 \u043a\u0430\u043a\u043e\u0433\u043e checkpoint \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0430\u0442\u044c. \u041f\u043e\u0432\u0442\u043e\u0440\u043d\u044b\u0439 invoke \u0441 \u0438\u0441\u0445\u043e\u0434\u043d\u044b\u043c state \u043f\u0440\u043e\u0441\u0442\u043e \u043f\u0435\u0440\u0435\u0437\u0430\u043f\u0443\u0441\u0442\u0438\u0442 \u0433\u0440\u0430\u0444 \u0441 \u043d\u0430\u0447\u0430\u043b\u0430."}, {"q": "\u041f\u0440\u043e\u0446\u0435\u0441\u0441 \u0441 \u0440\u0430\u0431\u043e\u0442\u0430\u044e\u0449\u0438\u043c \u0430\u0433\u0435\u043d\u0442\u043e\u043c \u0443\u043f\u0430\u043b \u043d\u0430 \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0435 \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u044f \u0433\u0440\u0430\u0444\u0430. Checkpointer \u043f\u0435\u0440\u0441\u0438\u0441\u0442\u0435\u043d\u0442\u043d\u044b\u0439, \u043d\u0435 InMemorySaver. \u0427\u0442\u043e \u043f\u0440\u043e\u0438\u0437\u043e\u0439\u0434\u0451\u0442 \u043f\u0440\u0438 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u043c graph.invoke \u0441 \u0442\u0435\u043c \u0436\u0435 thread_id?", "a": ["\u0413\u0440\u0430\u0444 \u043d\u0430\u0447\u043d\u0451\u0442 \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435 \u0437\u0430\u043d\u043e\u0432\u043e \u0441 \u0441\u0430\u043c\u043e\u0433\u043e \u043f\u0435\u0440\u0432\u043e\u0433\u043e node", "\u0413\u0440\u0430\u0444 \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0438\u0442 \u0441 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0435\u0433\u043e \u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d\u043d\u043e\u0433\u043e checkpoint, \u0430 \u043d\u0435 \u0441 \u043d\u0430\u0447\u0430\u043b\u0430", "\u0412\u044b\u0437\u043e\u0432 \u0437\u0430\u0432\u0435\u0440\u0448\u0438\u0442\u0441\u044f \u043e\u0448\u0438\u0431\u043a\u043e\u0439 - thread_id \u0443\u0436\u0435 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u043d \u0432 \u0443\u043f\u0430\u0432\u0448\u0435\u043c \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0435", "\u041d\u0443\u0436\u043d\u043e \u0432\u0440\u0443\u0447\u043d\u0443\u044e \u0443\u0434\u0430\u043b\u0438\u0442\u044c \u0441\u0442\u0430\u0440\u044b\u0439 thread_id, \u043f\u0440\u0435\u0436\u0434\u0435 \u0447\u0435\u043c \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0430\u0442\u044c"], "c": 1, "e": "\u0412 \u044d\u0442\u043e\u043c \u0438 \u0441\u043c\u044b\u0441\u043b \u043f\u0435\u0440\u0441\u0438\u0441\u0442\u0435\u043d\u0442\u043d\u043e\u0433\u043e checkpointer - state \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u0442\u0441\u044f \u043d\u0430 \u0434\u0438\u0441\u043a \u0438\u043b\u0438 \u0432 \u0411\u0414 \u043d\u0430 \u043a\u0430\u0436\u0434\u043e\u043c \u0448\u0430\u0433\u0435, \u0440\u0435\u0441\u0442\u0430\u0440\u0442 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430 \u043d\u0435 \u043e\u0442\u043a\u0430\u0442\u044b\u0432\u0430\u0435\u0442 \u043f\u0440\u043e\u0433\u0440\u0435\u0441\u0441 \u0442\u0440\u0435\u0434\u0430. InMemorySaver \u0432\u0451\u043b \u0431\u044b \u0441\u0435\u0431\u044f \u043a\u0430\u043a \u043f\u0435\u0440\u0432\u044b\u0439 \u0432\u0430\u0440\u0438\u0430\u043d\u0442, \u043f\u043e\u0442\u043e\u043c\u0443 \u0447\u0442\u043e \u0436\u0438\u0432\u0451\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u0432 \u043f\u0430\u043c\u044f\u0442\u0438 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430."}, {"q": "\u0412 \u0447\u0451\u043c \u043a\u043b\u044e\u0447\u0435\u0432\u043e\u0435 \u043e\u0442\u043b\u0438\u0447\u0438\u0435 PydanticAI \u043e\u0442 LangGraph \u0438\u0437 \u043a\u043e\u0440\u043e\u0431\u043a\u0438?", "a": ["PydanticAI \u043d\u0435 \u043f\u043e\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0435\u0442 tool use \u0432\u043e\u043e\u0431\u0449\u0435, \u0442\u043e\u043b\u044c\u043a\u043e LangGraph \u0443\u043c\u0435\u0435\u0442 \u0432\u044b\u0437\u044b\u0432\u0430\u0442\u044c \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u044b", "PydanticAI \u0441\u0442\u0440\u043e\u0438\u0442\u0441\u044f \u0432\u043e\u043a\u0440\u0443\u0433 \u0442\u0438\u043f\u0438\u0437\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0433\u043e \u0430\u0433\u0435\u043d\u0442\u0430 \u0438 Pydantic-\u0441\u0445\u0435\u043c \u0432\u044b\u0432\u043e\u0434\u0430, \u0430 \u043d\u0435 \u0432\u043e\u043a\u0440\u0443\u0433 \u044f\u0432\u043d\u043e\u0433\u043e \u0433\u0440\u0430\u0444\u0430 \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u0439 \u0441 checkpoint \u043f\u043e \u0443\u043c\u043e\u043b\u0447\u0430\u043d\u0438\u044e - \u0432\u0435\u0442\u0432\u043b\u0435\u043d\u0438\u0435 \u0438 \u043f\u0435\u0440\u0441\u0438\u0441\u0442\u0435\u043d\u0442\u043d\u043e\u0441\u0442\u044c \u0442\u0430\u043c \u043d\u0435 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0439 \u0441\u0446\u0435\u043d\u0430\u0440\u0438\u0439", "LangGraph - \u044d\u0442\u043e \u043e\u0431\u0451\u0440\u0442\u043a\u0430 \u043d\u0430\u0434 PydanticAI \u0434\u043b\u044f \u0431\u043e\u043b\u0435\u0435 \u043f\u0440\u043e\u0441\u0442\u043e\u0433\u043e API", "\u041e\u0431\u0430 \u0444\u0440\u0435\u0439\u043c\u0432\u043e\u0440\u043a\u0430 \u0438\u0434\u0435\u043d\u0442\u0438\u0447\u043d\u044b \u043f\u043e \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u044f\u043c, \u0440\u0430\u0437\u043b\u0438\u0447\u0438\u0435 \u0442\u043e\u043b\u044c\u043a\u043e \u0432 \u0441\u0438\u043d\u0442\u0430\u043a\u0441\u0438\u0441\u0435 \u0434\u0435\u043a\u043e\u0440\u0430\u0442\u043e\u0440\u043e\u0432"], "c": 1, "e": "PydanticAI \u0444\u043e\u043a\u0443\u0441\u0438\u0440\u0443\u0435\u0442\u0441\u044f \u043d\u0430 \u0442\u0438\u043f\u043e\u0431\u0435\u0437\u043e\u043f\u0430\u0441\u043d\u043e\u043c \u0430\u0433\u0435\u043d\u0442\u0435 (Pydantic-\u043c\u043e\u0434\u0435\u043b\u0438 \u043d\u0430 \u0432\u0445\u043e\u0434\u0435 \u0438 \u0432\u044b\u0445\u043e\u0434\u0435, @agent.tool), \u0430 \u043d\u0435 \u043d\u0430 \u0433\u0440\u0430\u0444\u0435 \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u0439 - \u0434\u043b\u044f \u0441\u043b\u043e\u0436\u043d\u044b\u0445 \u0432\u0435\u0442\u0432\u044f\u0449\u0438\u0445\u0441\u044f \u0441\u0446\u0435\u043d\u0430\u0440\u0438\u0435\u0432 \u0435\u0441\u0442\u044c \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u0435 \u0440\u0430\u0441\u0448\u0438\u0440\u0435\u043d\u0438\u0435 pydantic-graph, \u044d\u0442\u043e \u043d\u0435 \u0432\u0441\u0442\u0440\u043e\u0435\u043d\u043d\u043e\u0435 \u043f\u043e\u0432\u0435\u0434\u0435\u043d\u0438\u0435 \u0431\u0430\u0437\u043e\u0432\u043e\u0433\u043e \u0430\u0433\u0435\u043d\u0442\u0430, \u043a\u0430\u043a \u0432 LangGraph."}], "links": [{"t": "LangGraph: Overview", "u": "https://docs.langchain.com/oss/python/langgraph/overview"}, {"t": "LangGraph: Persistence", "u": "https://docs.langchain.com/oss/python/langgraph/persistence"}, {"t": "PydanticAI: Overview", "u": "https://pydantic.dev/docs/ai/overview/"}]}, "w4-mcp": {"why": "MCP \u043f\u0440\u0435\u0432\u0440\u0430\u0449\u0430\u0435\u0442 '\u0443 \u043c\u0435\u043d\u044f \u0435\u0441\u0442\u044c \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442' \u0432 '\u043c\u043e\u0439 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u043c\u043e\u0436\u043d\u043e \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0438\u0442\u044c \u043a \u043b\u044e\u0431\u043e\u043c\u0443 \u0430\u0433\u0435\u043d\u0442\u0443 \u0431\u0435\u0437 \u043f\u0435\u0440\u0435\u043f\u0438\u0441\u044b\u0432\u0430\u043d\u0438\u044f \u0438\u043d\u0442\u0435\u0433\u0440\u0430\u0446\u0438\u0438' - \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0432 \u0432\u0430\u043a\u0430\u043d\u0441\u0438\u044f\u0445 2026 \u0433\u043e\u0434\u0430 MCP \u0438\u0434\u0451\u0442 \u0440\u044f\u0434\u043e\u043c \u0441 LangGraph. \u041d\u0430 \u0441\u043e\u0431\u0435\u0441\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0438 \u0447\u0430\u0449\u0435 \u0441\u043f\u0440\u0430\u0448\u0438\u0432\u0430\u044e\u0442 \u043d\u0435 '\u0447\u0442\u043e \u0442\u0430\u043a\u043e\u0435 MCP', \u0430 '\u0447\u0435\u043c \u043e\u043d \u043e\u0442\u043b\u0438\u0447\u0430\u0435\u0442\u0441\u044f \u043e\u0442 \u043e\u0431\u044b\u0447\u043d\u043e\u0433\u043e tool use' - \u0438 \u0431\u043e\u043b\u044c\u0448\u0438\u043d\u0441\u0442\u0432\u043e \u043f\u0443\u0442\u0430\u0435\u0442\u0441\u044f, \u043f\u043e\u0442\u043e\u043c\u0443 \u0447\u0442\u043e \u043e\u0431\u0430 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u044e\u0442 \u0441\u043b\u043e\u0432\u043e tool.", "key": ["MCP (Model Context Protocol) - \u043e\u0442\u043a\u0440\u044b\u0442\u044b\u0439 \u043f\u0440\u043e\u0442\u043e\u043a\u043e\u043b \u043e\u0442 Anthropic \u0434\u043b\u044f \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u044f \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432 \u0438 \u0434\u0430\u043d\u043d\u044b\u0445 \u043a \u043c\u043e\u0434\u0435\u043b\u044f\u043c. \u042d\u0442\u043e \u043d\u0435 \u0430\u043b\u044c\u0442\u0435\u0440\u043d\u0430\u0442\u0438\u0432\u0430 function calling, \u0430 \u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u044b\u0439 \u0441\u043f\u043e\u0441\u043e\u0431 \u043e\u043f\u0438\u0441\u0430\u0442\u044c \u0438 \u0440\u0430\u0437\u0434\u0430\u0442\u044c \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u044b, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u0432\u0441\u0451 \u0440\u0430\u0432\u043d\u043e \u0432\u044b\u0437\u044b\u0432\u0430\u044e\u0442\u0441\u044f \u0447\u0435\u0440\u0435\u0437 \u043e\u0431\u044b\u0447\u043d\u044b\u0439 tool use \u0446\u0438\u043a\u043b (w4-fc). \u0420\u0430\u0437\u043d\u0438\u0446\u0430 \u0432 \u0442\u043e\u043c, \u0447\u0442\u043e \u0441\u0445\u0435\u043c\u0443 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 \u0438 \u0435\u0433\u043e \u0438\u0441\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435 \u043e\u0442\u0434\u0430\u0451\u0442 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u0439 \u043f\u0440\u043e\u0446\u0435\u0441\u0441 - \u0441\u0435\u0440\u0432\u0435\u0440, \u0430 \u043d\u0435 \u0442\u0432\u043e\u0439 \u043c\u043e\u043d\u043e\u043b\u0438\u0442.", "\u0422\u0440\u0438 \u043f\u0440\u0438\u043c\u0438\u0442\u0438\u0432\u0430 \u0441\u0435\u0440\u0432\u0435\u0440\u0430: tools (\u0444\u0443\u043d\u043a\u0446\u0438\u0438, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u043c\u043e\u0434\u0435\u043b\u044c \u043c\u043e\u0436\u0435\u0442 \u0432\u044b\u0437\u044b\u0432\u0430\u0442\u044c - \u043a\u0430\u043a \u0432 \u043e\u0431\u044b\u0447\u043d\u043e\u043c function calling), resources (\u0434\u0430\u043d\u043d\u044b\u0435 \u0434\u043b\u044f \u0447\u0442\u0435\u043d\u0438\u044f \u043a\u043b\u0438\u0435\u043d\u0442\u043e\u043c, \u0432\u0440\u043e\u0434\u0435 \u0444\u0430\u0439\u043b\u043e\u0432 \u0438\u043b\u0438 \u043e\u0442\u0432\u0435\u0442\u043e\u0432 API, \u0431\u0435\u0437 \u0432\u044b\u0437\u043e\u0432\u0430 \u043c\u043e\u0434\u0435\u043b\u0438), prompts (\u0437\u0430\u0433\u043e\u0442\u043e\u0432\u043b\u0435\u043d\u043d\u044b\u0435 \u0448\u0430\u0431\u043b\u043e\u043d\u044b \u0437\u0430\u043f\u0440\u043e\u0441\u043e\u0432 \u0434\u043b\u044f \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044f). \u041d\u0430 \u043f\u0440\u0430\u043a\u0442\u0438\u043a\u0435 \u043e\u0441\u043d\u043e\u0432\u043d\u0430\u044f \u0447\u0430\u0441\u0442\u044c \u0440\u0430\u0431\u043e\u0442\u044b - \u0438\u043c\u0435\u043d\u043d\u043e \u043f\u0440\u043e tools.", "\u0422\u0440\u0430\u043d\u0441\u043f\u043e\u0440\u0442 - \u044d\u0442\u043e \u043a\u0430\u043a \u043a\u043b\u0438\u0435\u043d\u0442 \u0438 \u0441\u0435\u0440\u0432\u0435\u0440 \u043e\u0431\u043c\u0435\u043d\u0438\u0432\u0430\u044e\u0442\u0441\u044f \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f\u043c\u0438 (JSON-RPC), \u0430 \u043d\u0435 \u0447\u0442\u043e \u043e\u043d\u0438 \u043e\u0431\u0441\u0443\u0436\u0434\u0430\u044e\u0442: stdio - \u0441\u0435\u0440\u0432\u0435\u0440 \u0436\u0438\u0432\u0451\u0442 \u043a\u0430\u043a \u043b\u043e\u043a\u0430\u043b\u044c\u043d\u044b\u0439 \u043f\u043e\u0434\u043f\u0440\u043e\u0446\u0435\u0441\u0441 \u0440\u044f\u0434\u043e\u043c \u0441 \u043a\u043b\u0438\u0435\u043d\u0442\u043e\u043c (\u0447\u0430\u0441\u0442\u044b\u0439 \u0441\u043b\u0443\u0447\u0430\u0439 \u0434\u043b\u044f \u0434\u0435\u0432-\u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432), Streamable HTTP - \u0441\u0435\u0440\u0432\u0435\u0440 \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e \u043f\u043e \u0441\u0435\u0442\u0438, \u0433\u043e\u0434\u0438\u0442\u0441\u044f \u0434\u043b\u044f \u0440\u0430\u0441\u0448\u0430\u0440\u0435\u043d\u043d\u043e\u0433\u043e \u0438\u043b\u0438 \u0443\u0434\u0430\u043b\u0451\u043d\u043d\u043e\u0433\u043e \u0441\u0435\u0440\u0432\u0435\u0440\u0430.", "\u0413\u043b\u0430\u0432\u043d\u044b\u0439 \u043f\u0440\u0430\u043a\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u0431\u0430\u0433 stdio-\u0441\u0435\u0440\u0432\u0435\u0440\u0430: print() \u043f\u0438\u0448\u0435\u0442 \u0432 stdout, \u0430 stdio-\u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0440\u0442 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442 stdout \u0434\u043b\u044f \u0441\u0430\u043c\u043e\u0433\u043e \u043f\u0440\u043e\u0442\u043e\u043a\u043e\u043b\u0430 (JSON-RPC \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0439) - \u0441\u043b\u0443\u0447\u0430\u0439\u043d\u044b\u0439 print \u0432\u043d\u0443\u0442\u0440\u0438 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 \u043b\u043e\u043c\u0430\u0435\u0442 \u043f\u0440\u043e\u0442\u043e\u043a\u043e\u043b \u043d\u0435\u043f\u043e\u043d\u044f\u0442\u043d\u043e\u0439 \u043e\u0448\u0438\u0431\u043a\u043e\u0439 \u043d\u0430 \u0441\u0442\u043e\u0440\u043e\u043d\u0435 \u043a\u043b\u0438\u0435\u043d\u0442\u0430. \u041b\u043e\u0433\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u043d\u0443\u0436\u043d\u043e \u0441\u0442\u0440\u043e\u0433\u043e \u0447\u0435\u0440\u0435\u0437 logging, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u043f\u043e \u0443\u043c\u043e\u043b\u0447\u0430\u043d\u0438\u044e \u043f\u0438\u0448\u0435\u0442 \u0432 stderr.", "\u0412 Python SDK (pip install \"mcp[cli]\") \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u0443\u0435\u0442\u0441\u044f \u0434\u0435\u043a\u043e\u0440\u0430\u0442\u043e\u0440\u043e\u043c @mcp.tool() \u043d\u0430 \u043e\u0431\u044b\u0447\u043d\u043e\u0439 async-\u0444\u0443\u043d\u043a\u0446\u0438\u0438: \u0442\u0438\u043f\u044b \u0430\u0440\u0433\u0443\u043c\u0435\u043d\u0442\u043e\u0432 \u0438 docstring \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0441\u0442\u0430\u043d\u043e\u0432\u044f\u0442\u0441\u044f JSON Schema \u0438 \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u0435\u043c \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 \u0434\u043b\u044f \u043c\u043e\u0434\u0435\u043b\u0438 - \u0442\u0449\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u0439 docstring \u0437\u0434\u0435\u0441\u044c \u043d\u0435 \u0434\u043b\u044f \u0447\u0438\u0442\u0430\u0442\u0435\u043b\u0435\u0439 \u043a\u043e\u0434\u0430, \u0430 \u043f\u0440\u044f\u043c\u043e\u0439 \u0432\u0445\u043e\u0434 \u0432 \u043f\u0440\u043e\u043c\u043f\u0442 \u043c\u043e\u0434\u0435\u043b\u0438.", "MCP-\u0441\u0435\u0440\u0432\u0435\u0440 \u0441\u0430\u043c \u043f\u043e \u0441\u0435\u0431\u0435 \u043d\u0435 \u0437\u043d\u0430\u0435\u0442, \u043a\u0430\u043a\u0430\u044f LLM \u0435\u0433\u043e \u0434\u0451\u0440\u043d\u0435\u0442: \u043e\u043d \u043f\u0440\u043e\u0441\u0442\u043e \u043e\u0442\u0432\u0435\u0447\u0430\u0435\u0442 \u043d\u0430 JSON-RPC \u0432\u044b\u0437\u043e\u0432\u044b \u0432\u0438\u0434\u0430 '\u043a\u0430\u043a\u0438\u0435 \u0443 \u0442\u0435\u0431\u044f \u0435\u0441\u0442\u044c tools' \u0438 '\u0432\u044b\u0437\u043e\u0432\u0438 tool X \u0441 \u0430\u0440\u0433\u0443\u043c\u0435\u043d\u0442\u0430\u043c\u0438 Y'. \u0412 \u044d\u0442\u043e\u043c \u0438 \u0446\u0435\u043d\u043d\u043e\u0441\u0442\u044c - \u043e\u0434\u0438\u043d \u043d\u0430\u043f\u0438\u0441\u0430\u043d\u043d\u044b\u0439 \u0441\u0435\u0440\u0432\u0435\u0440 (\u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440, search_docs \u043f\u043e\u0432\u0435\u0440\u0445 pgvector) \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0430\u0435\u0442\u0441\u044f \u043a \u0440\u0430\u0437\u043d\u044b\u043c \u043a\u043b\u0438\u0435\u043d\u0442\u0430\u043c \u0431\u0435\u0437 \u0438\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0439 \u0432 \u0441\u0430\u043c\u043e\u043c \u0441\u0435\u0440\u0432\u0435\u0440\u0435.", "\u042d\u0442\u043e \u0434\u043e\u0431\u0430\u0432\u043b\u044f\u0435\u0442 process-\u0433\u0440\u0430\u043d\u0438\u0446\u0443, \u043a\u043e\u0442\u043e\u0440\u043e\u0439 \u043d\u0435\u0442 \u0443 \u043e\u0431\u044b\u0447\u043d\u043e\u0433\u043e function calling \u0432 \u043e\u0434\u043d\u043e\u043c \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0435: \u0430\u0440\u0433\u0443\u043c\u0435\u043d\u0442\u044b \u0438 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u0441\u0435\u0440\u0438\u0430\u043b\u0438\u0437\u0443\u044e\u0442\u0441\u044f \u0447\u0435\u0440\u0435\u0437 JSON-RPC, \u0441\u0435\u0440\u0432\u0435\u0440 \u043c\u043e\u0436\u0435\u0442 \u0443\u043f\u0430\u0441\u0442\u044c \u0438\u043b\u0438 \u0437\u0430\u0432\u0438\u0441\u043d\u0443\u0442\u044c \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e \u043e\u0442 \u0430\u0433\u0435\u043d\u0442\u0430 - \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u043a\u0430 \u043e\u0448\u0438\u0431\u043e\u043a \u0438 \u0442\u0430\u0439\u043c\u0430\u0443\u0442\u044b \u043d\u0430 \u0441\u0442\u043e\u0440\u043e\u043d\u0435 \u043a\u043b\u0438\u0435\u043d\u0442\u0430 MCP \u0442\u0430\u043a \u0436\u0435 \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u044b, \u043a\u0430\u043a \u0438 \u0434\u043b\u044f tool calling \u0432\u043d\u0443\u0442\u0440\u0438 \u043e\u0434\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430."], "code": {"title": "\u041c\u0438\u043d\u0438\u043c\u0430\u043b\u044c\u043d\u044b\u0439 MCP-\u0441\u0435\u0440\u0432\u0435\u0440 \u0441 \u043e\u0434\u043d\u0438\u043c \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u043c", "lang": "python", "body": "from mcp.server import MCPServer\n\nmcp = MCPServer(\"second-brain\")\n\n@mcp.tool()\nasync def search_notes(query: str, limit: int = 5) -> str:\n    \"\"\"\u041d\u0430\u0439\u0442\u0438 \u0437\u0430\u043c\u0435\u0442\u043a\u0438 \u043f\u043e \u0441\u043c\u044b\u0441\u043b\u043e\u0432\u043e\u043c\u0443 \u0437\u0430\u043f\u0440\u043e\u0441\u0443 (query), \u0432\u0435\u0440\u043d\u0443\u0442\u044c \u043d\u0435 \u0431\u043e\u043b\u044c\u0448\u0435 limit \u0448\u0442\u0443\u043a.\"\"\"\n    rows = await db.search(query, limit=limit)\n    return \"\\n---\\n\".join(r.text for r in rows)\n\nif __name__ == \"__main__\":\n    mcp.run(transport=\"stdio\")\n"}, "hw": [{"t": "\u0421\u0432\u043e\u0439 MCP-\u0441\u0435\u0440\u0432\u0435\u0440 \u04

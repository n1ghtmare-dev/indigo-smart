432\u044b\u0437\u043e\u0432\u0430 \u0432\u0441\u0435\u0445 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432).", "done": "\u0422\u0435\u0441\u0442 \u043f\u0430\u0434\u0430\u0435\u0442, \u0435\u0441\u043b\u0438 \u043a\u0442\u043e-\u0442\u043e \u0441\u043b\u0443\u0447\u0430\u0439\u043d\u043e \u0434\u043e\u0431\u0430\u0432\u0438\u0442 print() \u0432 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442, \u0438 \u0437\u0435\u043b\u0451\u043d\u044b\u0439 \u043d\u0430 \u0447\u0438\u0441\u0442\u043e\u043c \u043a\u043e\u0434\u0435."}], "check": ["\u0427\u0435\u043c MCP tool \u043e\u0442\u043b\u0438\u0447\u0430\u0435\u0442\u0441\u044f \u043e\u0442 \u043e\u0431\u044b\u0447\u043d\u043e\u0433\u043e tool \u0432 function calling, \u0435\u0441\u043b\u0438 \u043c\u043e\u0434\u0435\u043b\u044c \u0432\u0441\u0451 \u0440\u0430\u0432\u043d\u043e \u0432\u044b\u0437\u044b\u0432\u0430\u0435\u0442 \u0435\u0433\u043e \u0447\u0435\u0440\u0435\u0437 \u0442\u043e\u0442 \u0436\u0435 tool_use/tool_calls \u043c\u0435\u0445\u0430\u043d\u0438\u0437\u043c?", "\u041f\u043e\u0447\u0435\u043c\u0443 print() \u0432\u043d\u0443\u0442\u0440\u0438 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 \u043b\u043e\u043c\u0430\u0435\u0442 \u0438\u043c\u0435\u043d\u043d\u043e stdio-\u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0440\u0442, \u0430 \u043d\u0435 HTTP?", "\u041a\u0430\u043a\u043e\u0439 \u0438\u0437 \u0442\u0440\u0451\u0445 \u043f\u0440\u0438\u043c\u0438\u0442\u0438\u0432\u043e\u0432 (tools/resources/prompts) \u0442\u044b \u0432\u044b\u0431\u0435\u0440\u0435\u0448\u044c \u0434\u043b\u044f '\u043e\u0442\u0434\u0430\u0442\u044c \u043c\u043e\u0434\u0435\u043b\u0438 \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u043c\u043e\u0435 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d\u043d\u043e\u0433\u043e \u0444\u0430\u0439\u043b\u0430 \u0431\u0435\u0437 \u0432\u044b\u0437\u043e\u0432\u0430 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430' - \u0438 \u043f\u043e\u0447\u0435\u043c\u0443 \u043d\u0435 tool?", "\u0427\u0442\u043e \u043d\u0443\u0436\u043d\u043e \u043e\u0431\u0440\u0430\u0431\u043e\u0442\u0430\u0442\u044c \u043d\u0430 \u0441\u0442\u043e\u0440\u043e\u043d\u0435 \u043a\u043b\u0438\u0435\u043d\u0442\u0430, \u0447\u0435\u0433\u043e \u043d\u0435 \u0431\u044b\u043b\u043e \u0431\u044b \u043f\u0440\u0438 tool use \u0432 \u043e\u0434\u043d\u043e\u043c \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0435?", "\u041f\u043e\u0447\u0435\u043c\u0443 \u043e\u0434\u0438\u043d \u0438 \u0442\u043e\u0442 \u0436\u0435 MCP-\u0441\u0435\u0440\u0432\u0435\u0440 \u043c\u043e\u0436\u043d\u043e \u043f\u0435\u0440\u0435\u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u044c \u0432 \u0440\u0430\u0437\u043d\u044b\u0445 \u0430\u0433\u0435\u043d\u0442\u0430\u0445 \u0431\u0435\u0437 \u0438\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0439 \u0432 \u0435\u0433\u043e \u043a\u043e\u0434\u0435?"], "quiz": [{"q": "\u0412 \u0447\u0451\u043c \u0433\u043b\u0430\u0432\u043d\u043e\u0435 \u043e\u0442\u043b\u0438\u0447\u0438\u0435 MCP-\u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 \u043e\u0442 \u043e\u0431\u044b\u0447\u043d\u043e\u0433\u043e tool use, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0442\u044b \u043f\u0438\u0441\u0430\u043b \u0440\u0443\u043a\u0430\u043c\u0438 \u0432 w4-fc?", "a": ["MCP-\u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u044b \u043d\u0435 \u0442\u0440\u0435\u0431\u0443\u044e\u0442 JSON Schema, \u043c\u043e\u0434\u0435\u043b\u044c \u0443\u0433\u0430\u0434\u044b\u0432\u0430\u0435\u0442 \u0430\u0440\u0433\u0443\u043c\u0435\u043d\u0442\u044b \u0441\u0430\u043c\u0430", "MCP - \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u0439, \u043d\u0435 JSON-RPC \u043f\u0440\u043e\u0442\u043e\u043a\u043e\u043b \u0441\u043f\u0435\u0446\u0438\u0430\u043b\u044c\u043d\u043e \u0434\u043b\u044f \u043d\u0435\u0439\u0440\u043e\u0441\u0435\u0442\u0435\u0439, \u043d\u0435\u0441\u043e\u0432\u043c\u0435\u0441\u0442\u0438\u043c\u044b\u0439 \u0441 \u043e\u0431\u044b\u0447\u043d\u044b\u043c tool use", "\u041c\u043e\u0434\u0435\u043b\u044c \u043f\u043e-\u043f\u0440\u0435\u0436\u043d\u0435\u043c\u0443 \u0432\u044b\u0437\u044b\u0432\u0430\u0435\u0442 tool \u0447\u0435\u0440\u0435\u0437 \u043e\u0431\u044b\u0447\u043d\u044b\u0439 tool_use/tool_calls \u0446\u0438\u043a\u043b, \u043d\u043e \u0441\u0445\u0435\u043c\u0443 \u0438 \u0438\u0441\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435 \u043e\u0442\u0434\u0430\u0451\u0442 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u0439 \u043f\u0440\u043e\u0446\u0435\u0441\u0441 (\u0441\u0435\u0440\u0432\u0435\u0440) \u043f\u043e \u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u043e\u043c\u0443 \u043f\u0440\u043e\u0442\u043e\u043a\u043e\u043b\u0443, \u0430 \u043d\u0435 \u043a\u043e\u0434 \u0432\u043d\u0443\u0442\u0440\u0438 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u044f", "MCP \u043f\u043e\u043b\u043d\u043e\u0441\u0442\u044c\u044e \u0437\u0430\u043c\u0435\u043d\u044f\u0435\u0442 \u0446\u0438\u043a\u043b \u0430\u0433\u0435\u043d\u0442\u0430 - \u0432\u044b\u0437\u044b\u0432\u0430\u0442\u044c \u043c\u043e\u0434\u0435\u043b\u044c \u0434\u043b\u044f \u043f\u0440\u0438\u043d\u044f\u0442\u0438\u044f \u0440\u0435\u0448\u0435\u043d\u0438\u0439 \u0431\u043e\u043b\u044c\u0448\u0435 \u043d\u0435 \u043d\u0443\u0436\u043d\u043e"], "c": 2, "e": "MCP \u043d\u0435 \u043c\u0435\u043d\u044f\u0435\u0442 \u043c\u0435\u0445\u0430\u043d\u0438\u043a\u0443 function calling - \u043c\u043e\u0434\u0435\u043b\u044c \u0432\u0441\u0451 \u0442\u0430\u043a \u0436\u0435 \u043f\u0440\u043e\u0441\u0438\u0442 \u0432\u044b\u0437\u0432\u0430\u0442\u044c \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442, \u0430 \u043a\u043b\u0438\u0435\u043d\u0442 \u0432\u0441\u0451 \u0442\u0430\u043a \u0436\u0435 \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u0435\u0442 \u0432\u044b\u0437\u043e\u0432 \u0438 \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442. \u041c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0442\u043e, \u0433\u0434\u0435 \u0436\u0438\u0432\u0451\u0442 \u0440\u0435\u0430\u043b\u0438\u0437\u0430\u0446\u0438\u044f \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430: \u0432 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u043c \u0441\u0435\u0440\u0432\u0435\u0440\u0435 \u043f\u043e \u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u043e\u043c\u0443 \u043f\u0440\u043e\u0442\u043e\u043a\u043e\u043b\u0443, \u0430 \u043d\u0435 \u0437\u0430\u0448\u0438\u0442\u043e\u0439 \u0432 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u043b\u043e\u0433\u0438\u043a\u0435."}, {"q": "\u0420\u0430\u0437\u0440\u0430\u0431\u043e\u0442\u0447\u0438\u043a \u0434\u043e\u0431\u0430\u0432\u0438\u043b \u0432 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 stdio-MCP-\u0441\u0435\u0440\u0432\u0435\u0440\u0430 \u0441\u0442\u0440\u043e\u043a\u0443 print(\"debug:\", result) \u0434\u043b\u044f \u043e\u0442\u043b\u0430\u0434\u043a\u0438. \u0427\u0442\u043e \u043f\u0440\u043e\u0438\u0437\u043e\u0439\u0434\u0451\u0442?", "a": ["\u041d\u0438\u0447\u0435\u0433\u043e \u0441\u0442\u0440\u0430\u0448\u043d\u043e\u0433\u043e, print() \u043f\u0440\u043e\u0441\u0442\u043e \u0434\u043e\u0431\u0430\u0432\u0438\u0442 \u043b\u0438\u0448\u043d\u044e\u044e \u0441\u0442\u0440\u043e\u043a\u0443 \u0432 \u043a\u043e\u043d\u0441\u043e\u043b\u044c \u0440\u0430\u0437\u0440\u0430\u0431\u043e\u0442\u0447\u0438\u043a\u0430", "\u0421\u0442\u0440\u043e\u043a\u0430 \u043f\u043e\u043f\u0430\u0434\u0451\u0442 \u0432 stdout, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 stdio-\u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0440\u0442 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442 \u0434\u043b\u044f \u0441\u0430\u043c\u0438\u0445 JSON-RPC \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0439 \u043f\u0440\u043e\u0442\u043e\u043a\u043e\u043b\u0430 - \u044d\u0442\u043e \u0441\u043b\u043e\u043c\u0430\u0435\u0442 \u043f\u0430\u0440\u0441\u0438\u043d\u0433 \u043d\u0430 \u0441\u0442\u043e\u0440\u043e\u043d\u0435 \u043a\u043b\u0438\u0435\u043d\u0442\u0430", "MCP SDK \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u043f\u0435\u0440\u0435\u0445\u0432\u0430\u0442\u0438\u0442 print() \u0438 \u043f\u0435\u0440\u0435\u043d\u0430\u043f\u0440\u0430\u0432\u0438\u0442 \u0435\u0433\u043e \u0432 \u043b\u043e\u0433", "\u042d\u0442\u043e \u0441\u043b\u043e\u043c\u0430\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e HTTP-\u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0440\u0442, stdio \u043a \u0432\u044b\u0432\u043e\u0434\u0443 \u0432 \u043a\u043e\u043d\u0441\u043e\u043b\u044c \u043d\u0435\u0447\u0443\u0432\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u0435\u043d"], "c": 1, "e": "\u0423 stdio-\u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0440\u0442\u0430 stdout - \u043a\u0430\u043d\u0430\u043b \u0441\u0430\u043c\u043e\u0433\u043e \u043f\u0440\u043e\u0442\u043e\u043a\u043e\u043b\u0430, \u0430 \u043d\u0435 \u043a\u043e\u043d\u0441\u043e\u043b\u044c \u0434\u043b\u044f \u0434\u0435\u0431\u0430\u0433\u0430. \u041b\u044e\u0431\u043e\u0439 print() \u0432\u043d\u0443\u0442\u0440\u0438 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 \u043f\u043e\u0434\u043c\u0435\u0448\u0438\u0432\u0430\u0435\u0442 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u043b\u044c\u043d\u044b\u0439 \u0442\u0435\u043a\u0441\u0442 \u0432 \u043f\u043e\u0442\u043e\u043a JSON-RPC \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0439, \u0438 \u043a\u043b\u0438\u0435\u043d\u0442 \u043f\u043e\u043b\u0443\u0447\u0430\u0435\u0442 \u043d\u0435\u0432\u0430\u043b\u0438\u0434\u043d\u044b\u0435 \u0434\u0430\u043d\u043d\u044b\u0435. \u0414\u043b\u044f \u043b\u043e\u0433\u043e\u0432 \u043d\u0443\u0436\u0435\u043d \u043c\u043e\u0434\u0443\u043b\u044c logging, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u043f\u043e \u0443\u043c\u043e\u043b\u0447\u0430\u043d\u0438\u044e \u043f\u0438\u0448\u0435\u0442 \u0432 stderr."}, {"q": "\u041d\u0443\u0436\u043d\u043e \u043e\u0442\u0434\u0430\u0442\u044c \u043c\u043e\u0434\u0435\u043b\u0438 \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u043c\u043e\u0435 \u0442\u0440\u0451\u0445 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d\u043d\u044b\u0445 \u0432 Second Brain \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432 \u0446\u0435\u043b\u0438\u043a\u043e\u043c, \u0431\u0435\u0437 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0432\u044b\u0437\u043e\u0432\u0430 \u0432\u043e \u0432\u0440\u0435\u043c\u044f \u0434\u0438\u0430\u043b\u043e\u0433\u0430. \u041a\u0430\u043a\u043e\u0439 \u043f\u0440\u0438\u043c\u0438\u0442\u0438\u0432 MCP \u0434\u043b\u044f \u044d\u0442\u043e\u0433\u043e \u043f\u0440\u0435\u0434\u043d\u0430\u0437\u043d\u0430\u0447\u0435\u043d?", "a": ["tools - \u043e\u0431\u0435\u0440\u043d\u0443\u0442\u044c \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u044b \u0432 \u0444\u0443\u043d\u043a\u0446\u0438\u044e get_document(id)", "resources - \u0432\u044b\u0441\u0442\u0430\u0432\u0438\u0442\u044c \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u044b \u043a\u0430\u043a \u0447\u0438\u0442\u0430\u0435\u043c\u044b\u0435 \u0434\u0430\u043d\u043d\u044b\u0435, \u0434\u043e\u0441\u0442\u0443\u043f\u043d\u044b\u0435 \u043a\u043b\u0438\u0435\u043d\u0442\u0443 \u043d\u0430\u043f\u0440\u044f\u043c\u0443\u044e", "prompts - \u0441\u043e\u0437\u0434\u0430\u0442\u044c \u0448\u0430\u0431\u043b\u043e\u043d \u043f\u0440\u043e\u043c\u043f\u0442\u0430 \u0441 \u0442\u0435\u043a\u0441\u0442\u043e\u043c \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432 \u0432\u043d\u0443\u0442\u0440\u0438", "\u041d\u0438 \u043e\u0434\u0438\u043d - MCP \u043d\u0435 \u0443\u043c\u0435\u0435\u0442 \u043e\u0442\u0434\u0430\u0432\u0430\u0442\u044c \u0441\u0442\u0430\u0442\u0438\u0447\u043d\u044b\u0435 \u0434\u0430\u043d\u043d\u044b\u0435, \u0442\u043e\u043b\u044c\u043a\u043e \u0432\u044b\u0437\u044b\u0432\u0430\u0442\u044c \u0444\u0443\u043d\u043a\u0446\u0438\u0438"], "c": 1, "e": "Resources - \u0438\u043c\u0435\u043d\u043d\u043e \u043f\u0440\u043e \u0444\u0430\u0439\u043b\u043e\u043f\u043e\u0434\u043e\u0431\u043d\u044b\u0435 \u0434\u0430\u043d\u043d\u044b\u0435, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u043a\u043b\u0438\u0435\u043d\u0442 \u043c\u043e\u0436\u0435\u0442 \u043f\u0440\u043e\u0447\u0438\u0442\u0430\u0442\u044c \u0431\u0435\u0437 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0432\u044b\u0437\u043e\u0432\u0430 \u043c\u043e\u0434\u0435\u043b\u0438 \u0438\u043b\u0438 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430 \u0432 \u0434\u0438\u0430\u043b\u043e\u0433\u0435, \u0432 \u043e\u0442\u043b\u0438\u0447\u0438\u0435 \u043e\u0442 tools, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u0432\u044b\u0437\u044b\u0432\u0430\u044e\u0442\u0441\u044f \u043c\u043e\u0434\u0435\u043b\u044c\u044e \u043f\u043e \u043d\u0435\u043e\u0431\u0445\u043e\u0434\u0438\u043c\u043e\u0441\u0442\u0438."}], "links": [{"t": "MCP: Introduction", "u": "https://modelcontextprotocol.io/introduction"}, {"t": "MCP: Build an MCP server", "u": "https://modelcontextprotocol.io/docs/2026-07-28/develop/build-server"}, {"t": "MCP: Server concepts", "u": "https://modelcontextprotocol.io/docs/2026-07-28/learn/server-concepts"}]}, "w4-patterns": {"why": "'\u041a\u043e\u0433\u0434\u0430 \u0430\u0433\u0435\u043d\u0442 \u043d\u0435 \u043d\u0443\u0436\u0435\u043d' - \u0440\u043e\u0432\u043d\u043e \u0442\u043e, \u0447\u0442\u043e \u043e\u0442\u043b\u0438\u0447\u0430\u0435\u0442 senior \u043e\u0442 \u043c\u0438\u0434\u0434\u043b\u0430 \u043d\u0430 \u044d\u0442\u043e\u0439 \u0442\u0435\u043c\u0435: \u043c\u0438\u0434\u0434\u043b \u0442\u044f\u043d\u0435\u0442 LangGraph \u0442\u0443\u0434\u0430, \u0433\u0434\u0435 \u0445\u0432\u0430\u0442\u0438\u043b\u043e \u0431\u044b if/else \u0438 \u043e\u0434\u043d\u043e\u0433\u043e LLM-\u0432\u044b\u0437\u043e\u0432\u0430, senior \u043d\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u044d\u0442\u043e \u0430\u0440\u0445\u0438\u0442\u0435\u043a\u0442\u0443\u0440\u043d\u043e\u0439 \u043e\u0448\u0438\u0431\u043a\u043e\u0439 \u043d\u0430 code review. Anthropic \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e \u043d\u0430\u043f\u0438\u0441\u0430\u043b\u0438 \u043e\u0431 \u044d\u0442\u043e\u043c \u0441\u0442\u0430\u0442\u044c\u044e \u0438\u043c\u0435\u043d\u043d\u043e \u043f\u043e\u0442\u043e\u043c\u0443, \u0447\u0442\u043e \u044d\u0442\u043e \u0441\u0430\u043c\u0430\u044f \u0447\u0430\u0441\u0442\u0430\u044f \u043e\u0448\u0438\u0431\u043a\u0430 \u0432 \u043f\u0440\u043e\u0434\u0435 2025-2026.", "key": ["ReAct (Reason + Act) - \u043d\u0435 \u0444\u0440\u0435\u0439\u043c\u0432\u043e\u0440\u043a, \u0430 \u043f\u0430\u0442\u0442\u0435\u0440\u043d \u0446\u0438\u043a\u043b\u0430: \u043c\u043e\u0434\u0435\u043b\u044c \u043d\u0430 \u043a\u0430\u0436\u0434\u043e\u043c \u0448\u0430\u0433\u0435 explicitly \u043f\u0440\u043e\u0433\u043e\u0432\u0430\u0440\u0438\u0432\u0430\u0435\u0442 \u0440\u0430\u0441\u0441\u0443\u0436\u0434\u0435\u043d\u0438\u0435 \u043f\u0435\u0440\u0435\u0434 \u0432\u044b\u0437\u043e\u0432\u043e\u043c \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430. \u042d\u0442\u043e \u0442\u043e\u0442 \u0441\u0430\u043c\u044b\u0439 \u0446\u0438\u043a\u043b, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0442\u044b \u043f\u0438\u0441\u0430\u043b \u0440\u0443\u043a\u0430\u043c\u0438 \u0432 w4-fc - 'ReAct' \u043f\u0440\u043e\u0441\u0442\u043e \u0438\u043c\u044f \u0434\u043b\u044f \u0441\u0432\u044f\u0437\u043a\u0438 \u0440\u0430\u0441\u0441\u0443\u0436\u0434\u0435\u043d\u0438\u0435 -> \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435 -> \u043d\u0430\u0431\u043b\u044e\u0434\u0435\u043d\u0438\u0435 -> \u0441\u043d\u043e\u0432\u0430 \u0440\u0430\u0441\u0441\u0443\u0436\u0434\u0435\u043d\u0438\u0435.", "Planner-executor \u0440\u0430\u0437\u0434\u0435\u043b\u044f\u0435\u0442 \u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0441\u0442\u044c \u043d\u0430 \u0434\u0432\u0430 \u0448\u0430\u0433\u0430: \u043e\u0434\u0438\u043d LLM-\u0432\u044b\u0437\u043e\u0432 \u0441\u0442\u0440\u043e\u0438\u0442 \u043f\u043b\u0430\u043d (\u0441\u043f\u0438\u0441\u043e\u043a \u043f\u043e\u0434\u0437\u0430\u0434\u0430\u0447) \u0446\u0435\u043b\u0438\u043a\u043e\u043c \u0437\u0430\u0440\u0430\u043d\u0435\u0435, \u0432\u0442\u043e\u0440\u043e\u0439, \u0431\u043e\u043b\u0435\u0435 \u0434\u0435\u0448\u0451\u0432\u044b\u0439 \u0446\u0438\u043a\u043b \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u0435\u0442 \u0438\u0445 \u043e\u0434\u043d\u0443 \u0437\u0430 \u0434\u0440\u0443\u0433\u043e\u0439 \u0431\u0435\u0437 \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u043e\u0433\u043e \u043f\u043e\u043b\u043d\u043e\u0433\u043e \u0440\u0430\u0441\u0441\u0443\u0436\u0434\u0435\u043d\u0438\u044f \u043e \u0441\u0442\u0440\u0430\u0442\u0435\u0433\u0438\u0438 \u043d\u0430 \u043a\u0430\u0436\u0434\u043e\u043c \u0448\u0430\u0433\u0435. \u041f\u043b\u044e\u0441 - \u043f\u0440\u0435\u0434\u0441\u043a\u0430\u0437\u0443\u0435\u043c\u043e\u0441\u0442\u044c \u0438 \u043f\u043b\u0430\u043d, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u043c\u043e\u0436\u043d\u043e \u043f\u043e\u043a\u0430\u0437\u0430\u0442\u044c \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044e \u0434\u043e \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u044f; \u043c\u0438\u043d\u0443\u0441 - \u043f\u043b\u0430\u043d \u043c\u043e\u0436\u0435\u0442 \u0443\u0441\u0442\u0430\u0440\u0435\u0442\u044c, \u0435\u0441\u043b\u0438 \u043f\u043e \u0445\u043e\u0434\u0443 \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u044f \u0432\u044b\u044f\u0441\u043d\u0438\u043b\u0438\u0441\u044c \u043d\u043e\u0432\u044b\u0435 \u0444\u0430\u043a\u0442\u044b.", "Router - \u0441\u0430\u043c\u044b\u0439 \u0434\u0435\u0448\u0451\u0432\u044b\u0439 \u0438 \u043d\u0435\u0434\u043e\u043e\u0446\u0435\u043d\u0451\u043d\u043d\u044b\u0439 \u043f\u0430\u0442\u0442\u0435\u0440\u043d: \u043e\u0434\u0438\u043d, \u0447\u0430\u0441\u0442\u043e \u043c\u0430\u043b\u0435\u043d\u044c\u043a\u0438\u0439 \u0438 \u0431\u044b\u0441\u0442\u0440\u044b\u0439 LLM-\u0432\u044b\u0437\u043e\u0432 \u043a\u043b\u0430\u0441\u0441\u0438\u0444\u0438\u0446\u0438\u0440\u0443\u0435\u0442 \u0437\u0430\u043f\u0440\u043e\u0441 \u0438 \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442 \u0435\u0433\u043e \u043f\u043e \u043e\u0434\u043d\u043e\u043c\u0443 \u0438\u0437 \u0437\u0430\u0440\u0430\u043d\u0435\u0435 \u043d\u0430\u043f\u0438\u0441\u0430\u043d\u043d\u044b\u0445 \u043f\u0443\u0442\u0435\u0439 (\u043e\u0431\u044b\u0447\u043d\u044b\u0439 RAG-\u043e\u0442\u0432\u0435\u0442, \u0432\u044b\u0437\u043e\u0432 \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u043e\u0433\u043e \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430, \u044d\u0441\u043a\u0430\u043b\u0430\u0446\u0438\u044f \u0447\u0435\u043b\u043e\u0432\u0435\u043a\u0443). \u042d\u0442\u043e \u043d\u0435 \u0430\u0433\u0435\u043d\u0442 \u0432 \u043f\u043e\u043b\u043d\u043e\u043c \u0441\u043c\u044b\u0441\u043b\u0435, \u043f\u043e\u0442\u043e\u043c\u0443 \u0447\u0442\u043e \u0434\u0430\u043b\u044c\u0448\u0435 \u043d\u0435\u0442 \u0446\u0438\u043a\u043b\u0430 \u0441 \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u044b\u043c \u0432\u044b\u0431\u043e\u0440\u043e\u043c \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0439.", "\u041f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u044b\u0435 \u043f\u043e\u0434\u0430\u0433\u0435\u043d\u0442\u044b (orchestrator-workers) - \u0433\u043b\u0430\u0432\u043d\u044b\u0439 \u0430\u0433\u0435\u043d\u0442 \u0440\u0430\u0437\u0431\u0438\u0432\u0430\u0435\u0442 \u0437\u0430\u0434\u0430\u0447\u0443 \u043d\u0430 \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u044b\u0435 \u043f\u043e\u0434\u0437\u0430\u0434\u0430\u0447\u0438 \u0438 \u0440\u0430\u0437\u0434\u0430\u0451\u0442 \u0438\u0445 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u0438\u043c LLM-\u0432\u044b\u0437\u043e\u0432\u0430\u043c \u043e\u0434\u043d\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u043e \u0447\u0435\u0440\u0435\u0437 asyncio.gather, \u0437\u0430\u0442\u0435\u043c \u0441\u0432\u043e\u0434\u0438\u0442 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u043e\u0434\u043d\u0438\u043c \u0444\u0438\u043d\u0430\u043b\u044c\u043d\u044b\u043c \u0432\u044b\u0437\u043e\u0432\u043e\u043c. \u0412\u044b\u0438\u0433\u0440\u044b\u0448 \u0432 latency \u043f\u0440\u044f\u043c\u043e\u0439, \u043d\u043e \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u043f\u043e\u0434\u0437\u0430\u0434\u0430\u0447 \u0434\u043e\u043b\u0436\u043d\u044b \u0431\u044b\u0442\u044c \u0440\u0435\u0430\u043b\u044c\u043d\u043e \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u044b, \u0438\u043d\u0430\u0447\u0435 \u0441\u0432\u0435\u0434\u0435\u043d\u0438\u0435 \u0432 \u043a\u043e\u043d\u0446\u0435 \u043b\u043e\u043c\u0430\u0435\u0442\u0441\u044f.", "Evaluator-optimizer \u0447\u0430\u0441\u0442\u043e \u043f\u0443\u0442\u0430\u044e\u0442 \u0441 \u043e\u0431\u044b\u0447\u043d\u044b\u043c ReAct: \u043e\u0434\u0438\u043d LLM-\u0432\u044b\u0437\u043e\u0432 \u0433\u0435\u043d\u0435\u0440\u0438\u0440\u0443\u0435\u0442 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442, \u0432\u0442\u043e\u0440\u043e\u0439, \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u044b\u0439 \u0438 \u0447\u0430\u0441\u0442\u043e \u0441 \u0434\u0440\u0443\u0433\u0438\u043c \u043f\u0440\u043e\u043c\u043f\u0442\u043e\u043c, \u043a\u0440\u0438\u0442\u0438\u043a\u0443\u0435\u0442 \u0435\u0433\u043e \u043f\u043e \u044f\u0432\u043d\u044b\u043c \u043a\u0440\u0438\u0442\u0435\u0440\u0438\u044f\u043c, \u0446\u0438\u043a\u043b \u043f\u043e\u0432\u0442\u043e\u0440\u044f\u0435\u0442\u0441\u044f, \u043f\u043e\u043a\u0430 \u043a\u0440\u0438\u0442\u0438\u043a \u043d\u0435 \u043e\u0434\u043e\u0431\u0440\u0438\u0442 \u0438\u043b\u0438 \u043d\u0435 \u043a\u043e\u043d\u0447\u0438\u0442\u0441\u044f \u043b\u0438\u043c\u0438\u0442 \u043f\u043e\u043f\u044b\u0442\u043e\u043a. \u042d\u0442\u043e \u0442\u043e, \u0447\u0442\u043e \u0441\u0442\u043e\u0438\u0442 \u0437\u0430 \u0441\u043b\u043e\u0432\u043e\u043c 'self-correcting agent' \u0432 \u0440\u0435\u0437\u044e\u043c\u0435.", "\u041a\u043e\u0433\u0434\u0430 \u0430\u0433\u0435\u043d\u0442 \u043d\u0435 \u043d\u0443\u0436\u0435\u043d: \u0435\u0441\u043b\u0438 \u043f\u043e\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c \u0448\u0430\u0433\u043e\u0432 \u0438\u0437\u0432\u0435\u0441\u0442\u043d\u0430 \u0437\u0430\u0440\u0430\u043d\u0435\u0435 \u0438 \u043d\u0435 \u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u043f\u043e \u0441\u0438\u0442\u0443\u0430\u0446\u0438\u0438 - \u044d\u0442\u043e workflow (\u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0439 \u0433\u0440\u0430\u0444 \u0432\u044b\u0437\u043e\u0432\u043e\u0432), \u0430 \u043d\u0435 \u0430\u0433\u0435\u043d\u0442; \u0435\u0441\u043b\u0438 \u0437\u0430\u0434\u0430\u0447\u0443 \u043c\u043e\u0436\u043d\u043e \u0440\u0435\u0448\u0438\u0442\u044c \u043e\u0434\u043d\u0438\u043c \u0432\u044b\u0437\u043e\u0432\u043e\u043c \u0441 \u0445\u043e\u0440\u043e\u0448\u0438\u043c \u043f\u0440\u043e\u043c\u043f\u0442\u043e\u043c \u0438 structured output, \u0430\u0433\u0435\u043d\u0442 \u044d\u0442\u043e \u043f\u0440\u043e\u0441\u0442\u043e \u043d\u0430 \u043f\u043e\u0440\u044f\u0434\u043e\u043a \u0434\u043e\u0440\u043e\u0436\u0435 \u0438 \u043c\u0435\u0434\u043b\u0435\u043d\u043d\u0435\u0435 \u0431\u0435\u0437 \u0432\u044b\u0438\u0433\u0440\u044b\u0448\u0430 \u0432 \u043a\u0430\u0447\u0435\u0441\u0442\u0432\u0435.", "\u0426\u0435\u043d\u0430 \u0430\u0432\u0442\u043e\u043d\u043e\u043c\u0438\u0438 - \u043d\u0435\u043f\u0440\u0435\u0434\u0441\u043a\u0430\u0437\u0443\u0435\u043c\u043e\u0441\u0442\u044c: \u0447\u0435\u043c \u0431\u043e\u043b\u044c\u0448\u0435 \u0441\u0432\u043e\u0431\u043e\u0434\u044b \u0443 \u0430\u0433\u0435\u043d\u0442\u0430 \u0432 \u0432\u044b\u0431\u043e\u0440\u0435 \u0448\u0430\u0433\u043e\u0432, \u0442\u0435\u043c \u0432\u044b\u0448\u0435 \u0432\u0430\u0440\u0438\u0430\u0442\u0438\u0432\u043d\u043e\u0441\u0442\u044c \u0441\u0442\u043e\u0438\u043c\u043e\u0441\u0442\u0438 \u0438 \u043b\u0430\u0442\u0435\u043d\u0442\u043d\u043e\u0441\u0442\u0438 \u043e\u0434\u043d\u043e\u0433\u043e \u0438 \u0442\u043e\u0433\u043e \u0436\u0435 \u0437\u0430\u043f\u0440\u043e\u0441\u0430 \u043e\u0442 \u0440\u0430\u0437\u0430 \u043a \u0440\u0430\u0437\u0443, \u0438 \u0442\u0435\u043c \u0442\u0440\u0443\u0434\u043d\u0435\u0435 \u043d\u0430\u043f\u0438\u0441\u0430\u0442\u044c eval, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u043b\u043e\u0432\u0438\u0442 \u0440\u0435\u0433\u0440\u0435\u0441\u0441. \u042d\u0442\u043e \u043f\u0440\u044f\u043c\u0430\u044f \u043f\u043b\u0430\u0442\u0430 \u0437\u0430 \u0433\u0438\u0431\u043a\u043e\u0441\u0442\u044c, \u0430 \u043d\u0435 \u0431\u0435\u0441\u043f\u043b\u0430\u0442\u043d\u044b\u0439 \u0430\u043f\u0433\u0440\u0435\u0439\u0434 \u043f\u043e \u0441\u0440\u0430\u0432\u043d\u0435\u043d\u0438\u044e \u0441 workflow."], "code": {"title": "\u041f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u044b\u0435 \u043f\u043e\u0434\u0430\u0433\u0435\u043d\u0442\u044b (orchestrator-workers)", "lang": "python", "body": "async def research(topic: str) -> str:\n    subtopics = await plan_subtopics(topic)  # \u043e\u0434\u0438\u043d LLM-\u0432\u044b\u0437\u043e\u0432 \u0440\u0435\u0436\u0435\u0442 \u0442\u0435\u043c\u0443 \u043d\u0430 N \u043f\u043e\u0434\u0432\u043e\u043f\u0440\u043e\u0441\u043e\u0432\n\n    results = await asyncio.gather(\n        *(run_subagent(q) for q in subtopics), return_exceptions=True\n    )\n    ok = [r for r in results if not isinstance(r, Exception)]\n\n    return await synthesize(topic, ok)  # \u0444\u0438\u043d\u0430\u043b\u044c\u043d\u044b\u0439 LLM-\u0432\u044b\u0437\u043e\u0432 \u0441\u0432\u043e\u0434\u0438\u0442 \u0432\u0441\u0451 \u0432 \u043e\u0434\u0438\u043d \u043e\u0442\u0432\u0435\u0442\n"}, "hw": [{"t": "Router \u043f\u0435\u0440\u0435\u0434 \u0430\u0433\u0435\u043d\u0442\u043e\u043c", "d": "route(query: str) -> Literal[\"rag\", \"tool_direct\", \"agent\"] - \u0434\u0435\u0448\u0451\u0432\u044b\u0439 \u043a\u043b\u0430\u0441\u0441\u0438\u0444\u0438\u0446\u0438\u0440\u0443\u044e\u0449\u0438\u0439 \u0432\u044b\u0437\u043e\u0432 (\u043c\u0430\u043b\u0435\u043d\u044c\u043a\u0430\u044f \u043c\u043e\u0434\u0435\u043b\u044c \u0438\u043b\u0438 \u044d\u0432\u0440\u0438\u0441\u0442\u0438\u043a\u0430), \u0440\u0435\u0448\u0430\u044e\u0449\u0438\u0439, \u043d\u0443\u0436\u0435\u043d \u043b\u0438 \u0432\u043e\u043e\u0431\u0449\u0435 \u043f\u043e\u043b\u043d\u044b\u0439 \u0430\u0433\u0435\u043d\u0442\u043d\u044b\u0439 \u0446\u0438\u043a\u043b, \u0438\u043b\u0438 \u0445\u0432\u0430\u0442\u0438\u0442 \u043f\u0440\u044f\u043c\u043e\u0433\u043e RAG-\u043e\u0442\u0432\u0435\u0442\u0430 \u043b\u0438\u0431\u043e \u043e\u0434\u043d\u043e\u0433\u043e \u0432\u044b\u0437\u043e\u0432\u0430 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430.", "done": "\u041d\u0430 \u043d\u0430\u0431\u043e\u0440\u0435 \u0438\u0437 10 \u0442\u0435\u0441\u0442\u043e\u0432\u044b\u0445 \u0432\u043e\u043f\u0440\u043e\u0441\u043e\u0432 router \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442 \u043c\u0438\u043d\u0438\u043c\u0443\u043c 3 \u0440\u0430\u0437\u043d\u044b\u0445 \u0442\u0438\u043f\u0430 \u0437\u0430\u043f\u0440\u043e\u0441\u043e\u0432 \u043f\u043e \u0440\u0430\u0437\u043d\u044b\u043c \u043f\u0443\u0442\u044f\u043c, \u0447\u0430\u0441\u0442\u044c - \u0432\u043e\u043e\u0431\u0449\u0435 \u0431\u0435\u0437 \u0432\u044b\u0437\u043e\u0432\u0430 \u0430\u0433\u0435\u043d\u0442\u043d\u043e\u0433\u043e \u0446\u0438\u043a\u043b\u0430."}, {"t": "Planner-executor \u043d\u0430 3 \u043f\u043e\u0434\u0437\u0430\u0434\u0430\u0447\u0430\u0445", "d": "\u041e\u0434\u0438\u043d LLM-\u0432\u044b\u0437\u043e\u0432 \u0441\u0442\u0440\u043e\u0438\u0442 \u043f\u043b\u0430\u043d \u0438\u0437 \u043f\u043e\u0434\u0437\u0430\u0434\u0430\u0447 (\u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440, \u0434\u043b\u044f \u0432\u043e\u043f\u0440\u043e\u0441\u0430, \u0442\u0440\u0435\u0431\u0443\u044e\u0449\u0435\u0433\u043e \u0434\u0430\u043d\u043d\u044b\u0445 \u0438\u0437 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u0438\u0445 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432), \u0437\u0430\u0442\u0435\u043c \u0446\u0438\u043a\u043b \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u0435\u0442 \u0438\u0445 \u043f\u043e\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u043d\u043e \u0431\u0435\u0437 \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u043e\u0433\u043e \u043f\u043e\u043b\u043d\u043e\u0433\u043e \u0440\u0430\u0441\u0441\u0443\u0436\u0434\u0435\u043d\u0438\u044f \u043e \u0441\u0442\u0440\u0430\u0442\u0435\u0433\u0438\u0438.", "done": "\u041f\u043b\u0430\u043d \u0432\u0438\u0434\u0435\u043d \u0432 \u043b\u043e\u0433\u0430\u0445 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e \u043e\u0442 \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u044f, \u0447\u0438\u0441\u043b\u043e LLM-\u0432\u044b\u0437\u043e\u0432\u043e\u0432 \u043d\u0430 \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u0435 \u043c\u0435\u043d\u044c\u0448\u0435, \u0447\u0435\u043c \u0431\u044b\u043b\u043e \u0431\u044b \u0443 \u043f\u043e\u043b\u043d\u043e\u0433\u043e ReAct-\u0446\u0438\u043a\u043b\u0430 \u043d\u0430 \u0442\u043e\u0439 \u0436\u0435 \u0437\u0430\u0434\u0430\u0447\u0435."}, {"t": "\u041f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u044b\u0435 \u043f\u043e\u0434\u0430\u0433\u0435\u043d\u0442\u044b", "d": "\u0417\u0430\u0434\u0430\u0447\u0430, \u0440\u0435\u0430\u043b\u044c\u043d\u043e \u0440\u0430\u0437\u0431\u0438\u0432\u0430\u044e\u0449\u0430\u044f\u0441\u044f \u043d\u0430 \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u044b\u0435 \u0447\u0430\u0441\u0442\u0438 (\u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440, \u043e\u0442\u0432\u0435\u0442\u0438\u0442\u044c \u043d\u0430 3 \u0440\u0430\u0437\u043d\u044b\u0445 \u0432\u043e\u043f\u0440\u043e\u0441\u0430 \u043f\u043e 3 \u0440\u0430\u0437\u043d\u044b\u043c \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0430\u043c), \u0432\u044b\u043f\u043e\u043b\u043d\u0438\u0442\u044c \u0447\u0435\u0440\u0435\u0437 asyncio.gather \u0441 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u043c LLM-\u0432\u044b\u0437\u043e\u0432\u043e\u043c \u043d\u0430 \u043a\u0430\u0436\u0434\u0443\u044e \u0447\u0430\u0441\u0442\u044c plus \u043e\u0434\u0438\u043d \u0444\u0438\u043d\u0430\u043b\u044c\u043d\u044b\u0439 \u0432\u044b\u0437\u043e\u0432-\u0441\u0438\u043d\u0442\u0435\u0437.", "done": "\u0417\u0430\u043c\u0435\u0440 \u0432\u0440\u0435\u043c\u0435\u043d\u0438 \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442, \u0447\u0442\u043e \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u044b\u0439 \u0432\u0430\u0440\u0438\u0430\u043d\u0442 \u0437\u0430\u043c\u0435\u0442\u043d\u043e \u0431\u044b\u0441\u0442\u0440\u0435\u0435 \u043f\u043e\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u0446\u0438\u043a\u043b\u0430 \u043d\u0430 \u0442\u0435\u0445 \u0436\u0435 3 \u0432\u043e\u043f\u0440\u043e\u0441\u0430\u0445."}, {"t": "\u041a\u0435\u0439\u0441, \u0433\u0434\u0435 \u0430\u0433\u0435\u043d\u0442 - \u043e\u0432\u0435\u0440\u0438\u043d\u0436\u0438\u043d\u0438\u0440\u0438\u043d\u0433", "d": "\u0412\u0437\u044f\u0442\u044c \u043b\u044e\u0431\u0443\u044e \u0437\u0430\u0434\u0430\u0447\u0443 \u043f\u0440\u043e\u0435\u043a\u0442\u0430, \u0440\u0435\u0448\u0451\u043d\u043d\u0443\u044e (\u0438\u043b\u0438 \u043f\u043e\u0442\u0435\u043d\u0446\u0438\u0430\u043b\u044c\u043d\u043e \u0440\u0435\u0448\u0430\u0435\u043c\u0443\u044e) \u0430\u0433\u0435\u043d\u0442\u043d\u044b\u043c \u0446\u0438\u043a\u043b\u043e\u043c, \u0438 \u043f\u0435\u0440\u0435\u043f\u0438\u0441\u0430\u0442\u044c \u0435\u0451 \u043a\u0430\u043a \u043f\u0440\u043e\u0441\u0442\u043e\u0439 workflow \u0438\u0437 1-2 LLM-\u0432\u044b\u0437\u043e\u0432\u043e\u0432 \u0431\u0435\u0437 \u0446\u0438\u043a\u043b\u0430 \u0438 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432.", "done": "\u041a\u043e\u0440\u043e\u0442\u043a\u0430\u044f \u0437\u0430\u043c\u0435\u0442\u043a\u0430 \u0432 notes/: \u0447\u0442\u043e \u0438\u043c\u0435\u043d\u043d\u043e \u043f\u043e\u0442\u0435\u0440\u044f\u043b\u043e\u0441\u044c \u0432 \u0433\u0438\u0431\u043a\u043e\u0441\u0442\u0438 \u0438 \u043f\u043e\u0447\u0435\u043c\u0443 \u0432 \u044d\u0442\u043e\u043c \u0441\u043b\u0443\u0447\u0430\u0435 \u044d\u0442\u043e \u043f\u0440\u0438\u0435\u043c\u043b\u0435\u043c\u043e (\u0438\u043b\u0438 \u043d\u0430\u043e\u0431\u043e\u0440\u043e\u0442, \u043f\u043e\u0447\u0435\u043c\u0443 \u043d\u0435\u0442)."}], "check": ["\u0427\u0435\u043c planner-executor \u043e\u0442\u043b\u0438\u0447\u0430\u0435\u0442\u0441\u044f \u043e\u0442 ReAct \u043f\u043e \u043a\u043e\u043b\u0438\u0447\u0435\u0441\u0442\u0432\u0443 \u0438 \u0440\u043e\u043b\u0438 LLM-\u0432\u044b\u0437\u043e\u0432\u043e\u0432?", "\u041f\u043e\u0447\u0435\u043c\u0443 router - \u044d\u0442\u043e \u043d\u0435 '\u043d\u0435\u0434\u043e\u0434\u0435\u043b\u0430\u043d\u043d\u044b\u0439 \u0430\u0433\u0435\u043d\u0442', \u0430 \u0441\u0430\u043c\u043e\u0441\u0442\u043e\u044f\u0442\u0435\u043b\u044c\u043d\u044b\u0439 \u043f\u043e\u043b\u0435\u0437\u043d\u044b\u0439 \u043f\u0430\u0442\u0442\u0435\u0440\u043d?", "\u041f\u0440\u0438 \u043a\u0430\u043a\u043e\u043c \u0443\u0441\u043b\u043e\u0432\u0438\u0438 \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u044b\u0435 \u043f\u043e\u0434\u0430\u0433\u0435\u043d\u0442\u044b \u0434\u0430\u044e\u0442 \u0440\u0435\u0430\u043b\u044c\u043d\u044b\u0439 \u0432\u044b\u0438\u0433\u0440\u044b\u0448, \u0430 \u043f\u0440\u0438 \u043a\u0430\u043a\u043e\u043c - \u0442\u043e\u043b\u044c\u043a\u043e \u0441\u043b\u043e\u0436\u043d\u043e\u0441\u0442\u044c \u0431\u0435\u0437 \u0432\u044b\u0438\u0433\u0440\u044b\u0448\u0430?", "\u041a\u0430\u043a evaluator-optimizer \u0441\u043e\u043e\u0442\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u0441 \u043e\u0431\u044b\u0447\u043d\u044b\u043c \u0440\u0435\u0442\u0440\u0430\u0435\u043c '\u043f\u043e\u043f\u0440\u043e\u0431\u0443\u0439 \u0435\u0449\u0451 \u0440\u0430\u0437, \u0435\u0441\u043b\u0438 \u043d\u0435 \u043f\u043e\u043b\u0443\u0447\u0438\u043b\u043e\u0441\u044c'?", "\u041f\u0440\u0438\u0432\u0435\u0434\u0438 \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u044b\u0439 \u043f\u0440\u0438\u043c\u0435\u0440 \u0437\u0430\u0434\u0430\u0447\u0438 \u0438\u0437 \u0441\u0432\u043e\u0435\u0433\u043e \u043f\u0440\u043e\u0435\u043a\u0442\u0430, \u0433\u0434\u0435 \u043f\u043e\u043b\u043d\u043e\u0446\u0435\u043d\u043d\u044b\u0439 \u0430\u0433\u0435\u043d\u0442 - \u043e\u0432\u0435\u0440\u0438\u043d\u0436\u0438\u043d\u0438\u0440\u0438\u043d\u0433, \u0438 \u043e\u0431\u044a\u044f\u0441\u043d\u0438, \u0447\u0435\u043c \u0431\u044b \u0442\u044b \u0435\u0433\u043e \u0437\u0430\u043c\u0435\u043d\u0438\u043b."], "quiz": [{"q": "\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0432\u0441\u0435\u0433\u0434\u0430 \u0434\u043e\u043b\u0436\u043d\u0430 \u043f\u0440\u0438 \u0437\u0430\u0433\u0440\u0443\u0437\u043a\u0435 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0430 \u0432\u044b\u043f\u043e\u043b\u043d\u0438\u0442\u044c (1) \u0440\u0430\u0437\u0431\u0438\u0442\u044c \u043d\u0430 \u0447\u0430\u043d\u043a\u0438, (2) \u043f\u043e\u0441\u0447\u0438\u0442\u0430\u0442\u044c embeddings, (3) \u0437\u0430\u043f\u0438\u0441\u0430\u0442\u044c \u0432 pgvector - \u0441\u0442\u0440\u043e\u0433\u043e \u0432 \u044d\u0442\u043e\u043c \u043f\u043e\u0440\u044f\u0434\u043a\u0435, \u0431\u0435\u0437 \u0438\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0439. \u041a\u0430\u043a \u044d\u0442\u043e \u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u043e \u0440\u0435\u0430\u043b\u0438\u0437\u043e\u0432\u0430\u0442\u044c?", "a": ["\u041f\u043e\u043b\u043d\u043e\u0446\u0435\u043d\u043d\u044b\u0439 \u0430\u0433\u0435\u043d\u0442 \u0441 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u0430\u043c\u0438 chunk/embed/store \u0438 \u0446\u0438\u043a\u043b\u043e\u043c ReAct, \u0447\u0442\u043e\u0431\u044b \u043c\u043e\u0434\u0435\u043b\u044c \u0441\u0430\u043c\u0430 \u0440\u0435\u0448\u0430\u043b\u0430 \u043f\u043e\u0440\u044f\u0434\u043e\u043a", "\u041e\u0431\u044b\u0447\u043d\u044b\u0439 workflow - \u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u0430\u044f \u043f\u043e\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c \u0444\u0443\u043d\u043a\u0446\u0438\u0439 \u0431\u0435\u0437 LLM, \u043f\u0440\u0438\u043d\u0438\u043c\u0430\u044e\u0449\u0435\u0433\u043e \u0440\u0435\u0448\u0435\u043d\u0438\u044f \u043e \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u043c \u0448\u0430\u0433\u0435", "Planner-executor, \u0447\u0442\u043e\u0431\u044b \u043c\u043e\u0434\u0435\u043b\u044c \u043a\u0430\u0436\u0434\u044b\u0439 \u0440\u0430\u0437 \u0441\u0442\u0440\u043e\u0438\u043b\u0430 \u043f\u043b\u0430\u043d \u0438\u0437 \u0442\u0435\u0445 \u0436\u0435 \u0442\u0440\u0451\u0445 \u0448\u0430\u0433\u043e\u0432", "Router, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u043d\u0430 \u043a\u0430\u0436\u0434\u044b\u0439 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442 \u0440\u0435\u0448\u0430\u0435\u0442, \u0432 \u043a\u0430\u043a\u043e\u043c \u043f\u043e\u0440\u044f\u0434\u043a\u0435 \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u0442\u044c \u0448\u0430\u0433\u0438"], "c": 1, "e": "\u041f\u043e\u0440\u044f\u0434\u043e\u043a \u0448\u0430\u0433\u043e\u0432 \u0438\u0437\u0432\u0435\u0441\u0442\u0435\u043d \u0437\u0430\u0440\u0430\u043d\u0435\u0435 \u0438 \u043d\u0435 \u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0432 \u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e\u0441\u0442\u0438 \u043e\u0442 \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u043c\u043e\u0433\u043e - \u044d\u0442\u043e \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0435\u043d\u0438\u0435 workflow, \u0430 \u043d\u0435 \u0437\u0430\u0434\u0430\u0447\u0438 \u0434\u043b\u044f \u0430\u0433\u0435\u043d\u0442\u0430. \u0410\u0433\u0435\u043d\u0442 \u0438\u043b\u0438 planner \u0434\u043e\u0431\u0430\u0432\u0438\u043b\u0438 \u0431\u044b \u0441\u0442\u043e\u0438\u043c\u043e\u0441\u0442\u044c \u0438 \u043d\u0435\u043f\u0440\u0435\u0434\u0441\u043a\u0430\u0437\u0443\u0435\u043c\u043e\u0441\u0442\u044c LLM-\u0432\u044b\u0437\u043e\u0432\u0430 \u0442\u0430\u043c, \u0433\u0434\u0435 \u0440\u0435\u0448\u0435\u043d\u0438\u0435 \u043d\u0438\u043a\u043e\u0433\u0434\u0430 \u043d\u0435 \u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f."}, {"q": "\u0412 \u0447\u0451\u043c \u043a\u043b\u044e\u0447\u0435\u0432\u043e\u0435 \u043e\u0442\u043b\u0438\u0447\u0438\u0435 planner-executor \u043e\u0442 \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u044b\u0445 \u043f\u043e\u0434\u0430\u0433\u0435\u043d\u0442\u043e\u0432 (orchestrator-workers)?", "a": ["\u042d\u0442\u043e \u0434\u0432\u0430 \u043d\u0430\u0437\u0432\u0430\u043d\u0438\u044f \u043e\u0434\u043d\u043e\u0433\u043e \u0438 \u0442\u043e\u0433\u043e \u0436\u0435 \u043f\u0430\u0442\u0442\u0435\u0440\u043d\u0430", "\u0412 planner-executor \u043f\u043e\u0434\u0437\u0430\u0434\u0430\u0447\u0438 \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u044e\u0442\u0441\u044f \u043f\u043e\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u043d\u043e \u043f\u043e \u0437\u0430\u0440\u0430\u043d\u0435\u0435 \u043f\u043e\u0441\u0442\u0440\u043e\u0435\u043d\u043d\u043e\u043c\u0443 \u043f\u043b\u0430\u043d\u0443; \u0432 orchestrator-workers \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u044b\u0435 \u043f\u043e\u0434\u0437\u0430\u0434\u0430\u0447\u0438 \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u044e\u0442\u0441\u044f \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u043e \u0438 \u0441\u0432\u043e\u0434\u044f\u0442\u0441\u044f \u0432 \u043a\u043e\u043d\u0446\u0435", "planner-executor \u043d\u0435 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442 LLM \u0434\u043b\u044f \u043f\u043e\u0441\u0442\u0440\u043e\u0435\u043d\u0438\u044f \u043f\u043b\u0430\u043d\u0430, \u0430 orchestrator-workers \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442", "orchestrator-workers \u043f\u0440\u0438\u043c\u0435\u043d\u0438\u043c \u0442\u043e\u043b\u044c\u043a\u043e \u043a RAG-\u0437\u0430\u0434\u0430\u0447\u0430\u043c, planner-executor - \u0442\u043e\u043b\u044c\u043a\u043e \u043a tool use"], "c": 1, "e": "\u041a\u043b\u044e\u0447\u0435\u0432\u0430\u044f \u043e\u0441\u044c \u0440\u0430\u0437\u043b\u0438\u0447\u0438\u044f - \u043f\u043e\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c \u043f\u0440\u043e\u0442\u0438\u0432 \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u0438 \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u044f \u043f\u043e\u0434\u0437\u0430\u0434\u0430\u0447. Planner-executor \u043d\u0435 \u0442\u0440\u0435\u0431\u0443\u0435\u0442, \u0447\u0442\u043e\u0431\u044b \u043f\u043e\u0434\u0437\u0430\u0434\u0430\u0447\u0438 \u0431\u044b\u043b\u0438 \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u044b (\u0448\u0430\u0433 2 \u043c\u043e\u0436\u0435\u0442 \u0437\u0430\u0432\u0438\u0441\u0435\u0442\u044c \u043e\u0442 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0430 \u0448\u0430\u0433\u0430 1), \u0430 orchestrator-workers \u043a\u0430\u043a \u0440\u0430\u0437 \u043f\u0440\u0435\u0434\u043f\u043e\u043b\u0430\u0433\u0430\u0435\u0442 \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u043e\u0441\u0442\u044c \u043f\u043e\u0434\u0437\u0430\u0434\u0430\u0447, \u0438\u043d\u0430\u0447\u0435 \u043f\u0430\u0440\u0430\u043b\u043b\u0435\u043b\u044c\u043d\u044b\u0439 \u0437\u0430\u043f\u0443\u0441\u043a \u043d\u0435 \u0438\u043c\u0435\u0435\u0442 \u0441\u043c\u044b\u0441\u043b\u0430."}, {"q": "\u0427\u0442\u043e \u0438\u0437 \u043f\u0435\u0440\u0435\u0447\u0438\u0441\u043b\u0435\u043d\u043d\u043e\u0433\u043e - \u0441\u0430\u043c\u044b\u0439 \u043f\u0440\u044f\u043c\u043e\u0439 \u043f\u0440\u0438\u0437\u043d\u0430\u043a \u0442\u043e\u0433\u043e, \u0447\u0442\u043e \u0437\u0430\u0434\u0430\u0447\u0435 \u043d\u0435 \u043d\u0443\u0436\u0435\u043d \u043f\u043e\u043b\u043d\u043e\u0446\u0435\u043d\u043d\u044b\u0439 \u0430\u0432\u0442\u043e\u043d\u043e\u043c\u043d\u044b\u0439 \u0430\u0433\u0435\u043d\u0442, \u0430 \u0445\u0432\u0430\u0442\u0438\u0442 \u043f\u0440\u043e\u0441\u0442\u043e\u0433\u043e workflow?", "a": ["\u0417\u0430\u0434\u0430\u0447\u0430 \u0442\u0440\u0435\u0431\u0443\u0435\u0442 \u0432\u044b\u0437\u043e\u0432\u0430 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u0438\u0445 \u0440\u0430\u0437\u043d\u044b\u0445 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432", "\u041f\u043e\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c \u0448\u0430\u0433\u043e\u0432 \u0438\u0437\u0432\u0435\u0441\u0442\u043d\u0430 \u0437\u0430\u0440\u0430\u043d\u0435\u0435 \u0438 \u043d\u0435 \u0437\u0430\u0432\u0438\u0441\u0438\u0442 \u043e\u0442 \u043f\u0440\u043e\u043c\u0435\u0436\u0443\u0442\u043e\u0447\u043d\u044b\u0445 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u043e\u0432", "\u041e\u0442\u0432\u0435\u0442 \u0434\u043e\u043b\u0436\u0435\u043d \u0431\u044b\u0442\u044c \u0434\u043b\u0438\u043d\u043d\u044b\u043c \u0438 \u043f\u043e\u0434\u0440\u043e\u0431\u043d\u044b\u043c", "\u0412 \u0437\u0430\u0434\u0430\u0447\u0435 \u0443\u0447\u0430\u0441\u0442\u0432\u0443\u0435\u0442 RAG-\u043f\u043e\u0438\u0441\u043a \u043f\u043e \u0431\u0430\u0437\u0435 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432"], "c": 1, "e": "\u0427\u0438\u0441\u043b\u043e \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432, \u0434\u043b\u0438\u043d\u0430 \u043e\u0442\u0432\u0435\u0442\u0430 \u0438 \u043d\u0430\u043b\u0438\u0447\u0438\u0435 RAG \u043d\u0435 \u043f\u0440\u043e \u0442\u043e, \u043d\u0443\u0436\u0435\u043d \u043b\u0438 \u0430\u0433\u0435\u043d\u0442; \u0432\u043e\u043f\u0440\u043e\u0441 \u0432 \u0442\u043e\u043c, \u043d\u0443\u0436\u043d\u043e \u043b\u0438 \u043c\u043e\u0434\u0435\u043b\u0438 \u0441\u0430\u043c\u043e\u0439 \u0440\u0435\u0448\u0430\u0442\u044c, \u0447\u0442\u043e \u0434\u0435\u043b\u0430\u0442\u044c \u0434\u0430\u043b\u044c\u0448\u0435, \u043f\u043e \u0445\u043e\u0434\u0443 \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u044f. \u0415\u0441\u043b\u0438 \u0448\u0430\u0433\u0438 \u043f\u0440\u0435\u0434\u0441\u043a\u0430\u0437\u0443\u0435\u043c\u044b \u0437\u0430\u0440\u0430\u043d\u0435\u0435, \u044d\u0442\u043e workflow, \u0434\u0430\u0436\u0435 \u0441\u043b\u043e\u0436\u043d\u044b\u0439 \u0438 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u044e\u0449\u0438\u0439 \u043c\u043d\u043e\u0433\u043e \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u0432 \u0438 RAG."}], "links": [{"t": "Anthropic: Building effective agents", "u": "https://www.anthropic.com/research/building-effective-ai-agents"}, {"t": "Anthropic: Tool use overview", "u": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview"}]}, "w4-algo": {"why": "'Top-k \u0438\u0437 \u043f\u043e\u0442\u043e\u043a\u0430' \u0438 'k \u0431\u043b\u0438\u0436\u0430\u0439\u0448\u0438\u0445/\u0434\u0435\u0448\u0451\u0432\u044b\u0445 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u043e\u0432' - \u0440\u043e\u0432\u043d\u043e \u0442\u043e\u0442 \u0442\u0438\u043f \u0437\u0430\u0434\u0430\u0447\u0438, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0432 \u0436\u0438\u0432\u044b\u0445 \u0441\u043e\u0431\u0435\u0441\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u044f\u0445 2026 \u0438\u0434\u0451\u0442 \u0432\u043c\u0435\u0441\u0442\u043e \u0437\u0430\u0443\u0447\u0435\u043d\u043d\u043e\u0433\u043e \u043d\u0430\u0431\u043e\u0440\u0430 LeetCode: \u043d\u0435 \u043f\u0440\u043e \u0430\u043b\u0433\u043e\u0440\u0438\u0442\u043c \u043d\u0430\u0438\u0437\u0443\u0441\u0442\u044c, \u0430 \u043f\u0440\u043e \u043f\u043e\u043d\u0438\u043c\u0430\u043d\u0438\u0435, \u043f\u043e\u0447\u0435\u043c\u0443 heap \u0434\u0430\u0451\u0442 O(n log k), \u0430 \u043d\u0435 O(n log n) \u0447\u0435\u0440\u0435\u0437 \u043f\u043e\u043b\u043d\u0443\u044e \u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u043a\u0443.", "key": ["\u041a\u0443\u0447\u0430 (heap) - \u043d\u0435 \u043e\u0442\u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u0430\u044f \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0430, \u0430 \u0434\u0435\u0440\u0435\u0432\u043e \u0441 \u043e\u0434\u043d\u0438\u043c \u0438\u043d\u0432\u0430\u0440\u0438\u0430\u043d\u0442\u043e\u043c: \u0443 min-heap \u043a\u0430\u0436\u0434\u044b\u0439 \u0440\u043e\u0434\u0438\u0442\u0435\u043b\u044c \u003c= \u043e\u0431\u043e\u0438\u0445 \u0434\u0435\u0442\u0435\u0439 (\u0443 max-heap \u043d\u0430\u043e\u0431\u043e\u0440\u043e\u0442). \u0418\u0437 \u044d\u0442\u043e\u0433\u043e \u0441\u043b\u0435\u0434\u0443\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u043e\u0434\u043d\u0430 \u0433\u0430\u0440\u0430\u043d\u0442\u0438\u044f - \u043a\u043e\u0440\u0435\u043d\u044c (\u0438\u043d\u0434\u0435\u043a\u0441 0) \u044d\u0442\u043e \u043c\u0438\u043d\u0438\u043c\u0443\u043c \u0438\u043b\u0438 \u043c\u0430\u043a\u0441\u0438\u043c\u0443\u043c \u0432\u0441\u0435\u0439 \u043a\u0443\u0447\u0438, \u043f\u043e\u0440\u044f\u0434\u043e\u043a \u043e\u0441\u0442\u0430\u043b\u044c\u043d\u044b\u0445 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u043e\u0432 \u043d\u0435 \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u0451\u043d.", "\u0412 Python \u043d\u0435\u0442 max-heap \u0438\u0437 \u043a\u043e\u0440\u043e\u0431\u043a\u0438: \u043c\u043e\u0434\u0443\u043b\u044c heapq \u0440\u0435\u0430\u043b\u0438\u0437\u0443\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e min-heap \u043d\u0430 \u043e\u0431\u044b\u0447\u043d\u043e\u043c list. \u041c\u0430\u043a\u0441\u0438\u043c\u0430\u043b\u044c\u043d\u0443\u044e \u043a\u0443\u0447\u0443 \u043f\u043e\u043b\u0443\u0447\u0430\u044e\u0442, \u0445\u0440\u0430\u043d\u044f \u043e\u0442\u0440\u0438\u0446\u0430\u043d\u0438\u044f \u0447\u0438\u0441\u0435\u043b (heapq.heappush(heap, -x)) \u0438\u043b\u0438 \u043a\u043e\u0440\u0442\u0435\u0436\u0438 (-priority, item), \u0435\u0441\u043b\u0438 \u043d\u0443\u0436\u043d\u0430 \u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u043a\u0430 \u043f\u043e \u043a\u0430\u0441\u0442\u043e\u043c\u043d\u043e\u043c\u0443 \u043a\u043b\u044e\u0447\u0443.", "heappush \u0438 heappop - O(log n) \u043a\u0430\u0436\u0434\u0430\u044f, \u043f\u043e\u0442\u043e\u043c\u0443 \u0447\u0442\u043e \u044d\u0442\u043e \u0432\u044b\u0441\u043e\u0442\u0430 \u043a\u0443\u0447\u0438 \u0438\u0437 n \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u043e\u0432. heapify \u043f\u0440\u0435\u0432\u0440\u0430\u0449\u0430\u0435\u0442 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u043b\u044c\u043d\u044b\u0439 \u0441\u043f\u0438\u0441\u043e\u043a \u0432 \u043a\u0443\u0447\u0443 \u0437\u0430 O(n), \u0430 \u043d\u0435 \u0437\u0430 O(n log n) - \u044d\u0442\u043e \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e \u043e\u043f\u0442\u0438\u043c\u0438\u0437\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0439 \u0430\u043b\u0433\u043e\u0440\u0438\u0442\u043c \u043f\u0440\u043e\u0441\u0435\u0438\u0432\u0430\u043d\u0438\u044f \u0441 \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u044b \u0441\u043f\u0438\u0441\u043a\u0430, \u0430 \u043d\u0435 n \u0440\u0430\u0437 \u0432\u044b\u0437\u0432\u0430\u043d\u043d\u044b\u0439 heappush.", "Top-k \u0438\u0437 \u043f\u043e\u0442\u043e\u043a\u0430, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u043d\u0435 \u043f\u043e\u043c\u0435\u0449\u0430\u0435\u0442\u0441\u044f \u0432 \u043f\u0430\u043c\u044f\u0442\u0438 \u0446\u0435\u043b\u0438\u043a\u043e\u043c \u0438\u043b\u0438 \u043f\u0440\u043e\u0441\u0442\u043e \u0434\u043b\u0438\u043d\u043d\u0435\u0435 k \u043d\u0430 \u043f\u043e\u0440\u044f\u0434\u043a\u0438 - \u043a\u043b\u0430\u0441\u0441\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0437\u0430\u0434\u0430\u0447\u0430 \u043d\u0430 min-heap \u0440\u0430\u0437\u043c\u0435\u0440\u0430 k: \u0434\u0435\u0440\u0436\u0438\u0448\u044c \u043a\u0443\u0447\u0443 \u0438\u0437 k \u043d\u0430\u0438\u0431\u043e\u043b\u044c\u0448\u0438\u0445 \u0432\u0438\u0434\u0435\u043d\u043d\u044b\u0445 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u043e\u0432, \u0434\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u043d\u043e\u0432\u043e\u0433\u043e \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u0430 \u0441\u0440\u0430\u0432\u043d\u0438\u0432\u0430\u0435\u0448\u044c \u0441 \u043c\u0438\u043d\u0438\u043c\u0443\u043c\u043e\u043c \u043a\u0443\u0447\u0438 (heap[0]) \u0438 \u0437\u0430\u043c\u0435\u043d\u044f\u0435\u0448\u044c \u0447\u0435\u0440\u0435\u0437 heapreplace, \u0435\u0441\u043b\u0438 \u043d\u043e\u0432\u044b\u0439 \u0431\u043e\u043b\u044c\u0448\u0435. \u0421\u043b\u043e\u0436\u043d\u043e\u0441\u0442\u044c O(n log k) \u0432\u043c\u0435\u0441\u0442\u043e O(n log n) \u043e\u0442 \u043f\u043e\u043b\u043d\u043e\u0439 \u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u043a\u0438 - \u0440\u0430\u0437\u043d\u0438\u0446\u0430 \u043e\u0433\u0440\u043e\u043c\u043d\u0430\u044f, \u043a\u043e\u0433\u0434\u0430 k \u043c\u043d\u043e\u0433\u043e \u043c\u0435\u043d\u044c\u0448\u0435 n.", "heapq.nlargest(k, iterable) \u0438 nsmallest(k, iterable) \u0440\u0435\u0448\u0430\u044e\u0442 \u0442\u0443 \u0436\u0435 \u0437\u0430\u0434\u0430\u0447\u0443 \u0448\u0442\u0430\u0442\u043d\u044b\u043c\u0438 \u0441\u0440\u0435\u0434\u0441\u0442\u0432\u0430\u043c\u0438 \u0431\u0438\u0431\u043b\u0438\u043e\u0442\u0435\u043a\u0438 - \u043d\u043e \u0434\u043b\u044f \u043d\u0430\u0441\u0442\u043e\u044f\u0449\u0435\u0433\u043e \u043f\u043e\u0442\u043e\u043a\u0430 \u0441 \u043f\u043e\u0441\u0442\u043e\u044f\u043d\u043d\u043e\u0439 \u043f\u0430\u043c\u044f\u0442\u044c\u044e (\u0430 \u043d\u0435 \u0433\u043e\u0442\u043e\u0432\u043e\u0433\u043e \u0441\u043f\u0438\u0441\u043a\u0430) \u043d\u0443\u0436\u043d\u043e \u0443\u043c\u0435\u0442\u044c \u043d\u0430\u043f\u0438\u0441\u0430\u0442\u044c \u0432\u0430\u0440\u0438\u0430\u043d\u0442 \u0441 heap \u0440\u0430\u0437\u043c\u0435\u0440\u0430 k \u0440\u0443\u043a\u0430\u043c\u0438, \u043f\u043e\u0442\u043e\u043c\u0443 \u0447\u0442\u043e \u0438\u043c\u0435\u043d\u043d\u043e \u044d\u0442\u0443 \u043b\u043e\u0433\u0438\u043a\u0443 \u0447\u0430\u0449\u0435 \u0432\u0441\u0435\u0433\u043e \u043f\u0440\u043e\u0441\u044f\u0442 \u043e\u0431\u044a\u044f\u0441\u043d\u0438\u0442\u044c \u043d\u0430 \u0441\u043e\u0431\u0435\u0441\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0438, \u0430 \u043d\u0435 \u043f\u0440\u043e\u0441\u0442\u043e \u0432\u044b\u0437\u0432\u0430\u0442\u044c \u0433\u043e\u0442\u043e\u0432\u0443\u044e \u0444\u0443\u043d\u043a\u0446\u0438\u044e.", "\u041e\u0431\u0445\u043e\u0434 \u0434\u0435\u0440\u0435\u0432\u0430: BFS \u0447\u0435\u0440\u0435\u0437 \u043e\u0447\u0435\u0440\u0435\u0434\u044c (collections.deque) \u0434\u0430\u0451\u0442 \u043e\u0431\u0445\u043e\u0434 \u043f\u043e \u0443\u0440\u043e\u0432\u043d\u044f\u043c - \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0439 \u0432\u044b\u0431\u043e\u0440 \u0434\u043b\u044f '\u043a\u0440\u0430\u0442\u0447\u0430\u0439\u0448\u0438\u0439 \u043f\u0443\u0442\u044c \u043f\u043e \u043d\u0435\u0432\u0437\u0432\u0435\u0448\u0435\u043d\u043d\u043e\u043c\u0443 \u0433\u0440\u0430\u0444\u0443 \u0438\u043b\u0438 \u0434\u0435\u0440\u0435\u0432\u0443' \u0438 \u0434\u043b\u044f 'k \u0431\u043b\u0438\u0436\u0430\u0439\u0448\u0438\u0445 \u0443\u0437\u043b\u043e\u0432'. DFS (\u0440\u0435\u043a\u0443\u0440\u0441\u0438\u0435\u0439 \u0438\u043b\u0438 \u044f\u0432\u043d\u044b\u043c stack) - \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0439 \u0432\u044b\u0431\u043e\u0440 \u0434\u043b\u044f '\u043e\u0431\u043e\u0439\u0442\u0438 \u0432\u0441\u0451 \u043f\u043e\u0434\u0434\u0435\u0440\u0435\u0432\u043e', '\u043f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c \u0441\u0432\u043e\u0439\u0441\u0442\u0432\u043e BST', \u0442\u043e\u043f\u043e\u043b\u043e\u0433\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u0437\u0430\u0434\u0430\u0447.", "\u041a\u0443\u0447\u0430 - \u044d\u0442\u043e \u043d\u0435 \u0431\u0438\u043d\u0430\u0440\u043d\u043e\u0435 \u0434\u0435\u0440\u0435\u0432\u043e \u043f\u043e\u0438\u0441\u043a\u0430: \u0432 BST \u043c\u043e\u0436\u043d\u043e \u0431\u044b\u0441\u0442\u0440\u043e \u043d\u0430\u0439\u0442\u0438 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u043b\u044c\u043d\u044b\u0439 \u044d\u043b\u0435\u043c\u0435\u043d\u0442 (\u0432 \u0441\u0440\u0435\u0434\u043d\u0435\u043c O(log n)) \u0437\u0430 \u0441\u0447\u0451\u0442 \u0438\u043d\u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430 '\u043b\u0435\u0432\u043e\u0435 \u043f\u043e\u0434\u0434\u0435\u0440\u0435\u0432\u043e \u043c\u0435\u043d\u044c\u0448\u0435 \u0443\u0437\u043b\u0430, \u043f\u0440\u0430\u0432\u043e\u0435 \u0431\u043e\u043b\u044c\u0448\u0435', \u0432 heap - \u0442\u043e\u043b\u044c\u043a\u043e \u043c\u0438\u043d\u0438\u043c\u0443\u043c \u0438\u043b\u0438 \u043c\u0430\u043a\u0441\u0438\u043c\u0443\u043c, \u043f\u043e\u0438\u0441\u043a \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u043b\u044c\u043d\u043e\u0433\u043e \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u0430 \u0442\u0430\u043c O(n). \u0427\u0430\u0441\u0442\u0430\u044f \u043f\u0443\u0442\u0430\u043d\u0438\u0446\u0430 \u043d\u0430 \u0441\u043e\u0431\u0435\u0441\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0438: '\u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0430 \u0441 \u043e\u043f\u0435\u0440\u0430\u0446\u0438\u044f\u043c\u0438 \u0437\u0430 O(log n)' \u043d\u0435 \u0437\u043d\u0430\u0447\u0438\u0442 '\u043e\u0434\u043d\u0430 \u0438 \u0442\u0430 \u0436\u0435 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0430'."], "code": {"title": "Top-k \u0438\u0437 \u043f\u043e\u0442\u043e\u043a\u0430 \u0447\u0435\u0440\u0435\u0437 min-heap \u0440\u0430\u0437\u043c\u0435\u0440\u0430 k", "lang": "python", "body": "import heapq\nfrom collections.abc import Iterable\n\ndef top_k_streaming(nums: Iterable[int], k: int) -> list[int]:\n    heap: list[int] = []\n    for n in nums:\n        if len(heap) \u003c k:\n            heapq.heappush(heap, n)\n        elif n > heap[0]:\n            heapq.heapreplace(heap, n)\n    return sorted(heap, reverse=True)\n"}, "hw": [{"t": "Top-k \u0438\u0437 \u043f\u043e\u0442\u043e\u043a\u0430", "d": "top_k_streaming(nums: Iterable[int], k: int) -> list[int] \u0431\u0435\u0437 \u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u043a\u0438 \u0432\u0441\u0435\u0433\u043e \u0432\u0445\u043e\u0434\u0430 - \u0442\u043e\u043b\u044c\u043a\u043e min-heap \u0444\u0438\u043a\u0441\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0433\u043e \u0440\u0430\u0437\u043c\u0435\u0440\u0430 k, \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u0434\u0430\u0436\u0435 \u0435\u0441\u043b\u0438 nums - \u0431\u0435\u0441\u043a\u043e\u043d\u0435\u0447\u043d\u044b\u0439 \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440.", "done": "\u041d\u0430 \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440\u0435 \u0438\u0437 1_000_000 \u0447\u0438\u0441\u0435\u043b \u0441 k=10 \u0444\u0443\u043d\u043a\u0446\u0438\u044f \u0437\u0430\u043c\u0435\u0442\u043d\u043e \u0431\u044b\u0441\u0442\u0440\u0435\u0435, \u0447\u0435\u043c sorted(nums)[-k:] \u043d\u0430 \u0442\u043e\u043c \u0436\u0435 \u0432\u0445\u043e\u0434\u0435, \u0438 \u0434\u0430\u0451\u0442 \u0442\u043e\u0442 \u0436\u0435 \u043d\u0430\u0431\u043e\u0440 \u0447\u0438\u0441\u0435\u043b."}, {"t": "k \u0431\u043b\u0438\u0436\u0430\u0439\u0448\u0438\u0445 \u0442\u043e\u0447\u0435\u043a \u043a \u043d\u0443\u043b\u044e", "d": "\u041a\u043b\u0430\u0441\u0441\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0437\u0430\u0434\u0430\u0447\u0430: \u0434\u0430\u043d \u0441\u043f\u0438\u0441\u043e\u043a \u0442\u043e\u0447\u0435\u043a (x, y), \u0432\u0435\u0440\u043d\u0443\u0442\u044c k \u0431\u043b\u0438\u0436\u0430\u0439\u0448\u0438\u0445 \u043a \u043d\u0430\u0447\u0430\u043b\u0443 \u043a\u043e\u043e\u0440\u0434\u0438\u043d\u0430\u0442 \u0447\u0435\u0440\u0435\u0437 heap, \u0431\u0435\u0437 \u043f\u043e\u043b\u043d\u043e\u0439 \u0441\u043e\u0440\u0442\u0438\u0440\u043e\u0432\u043a\u0438 \u043f\u043e \u0440\u0430\u0441\u0441\u0442\u043e\u044f\u043d\u0438\u044e.", "done": "pytest \u043f\u043e\u043a\u0440\u044b\u0432\u0430\u0435\u0442 \u0441\u043b\u0443\u0447\u0430\u0439 k == len(points) \u0438 k == 1."}, {"t": "BFS \u043f\u043e \u0434\u0435\u0440\u0435\u0432\u0443 \u043d\u0430 \u0443\u0440\u043e\u0432\u043d\u0438", "d": "level_order(root) -> list[list[int]] - \u043e\u0431\u0445\u043e\u0434 \u0431\u0438\u043d\u0430\u0440\u043d\u043e\u0433\u043e \u0434\u0435\u0440\u0435\u0432\u0430 \u043f\u043e \u0443\u0440\u043e\u0432\u043d\u044f\u043c \u0447\u0435\u0440\u0435\u0437 deque, \u0431\u0435\u0437 \u0440\u0435\u043a\u0443\u0440\u0441\u0438\u0438.", "done": "\u0422\u0435\u0441\u0442 \u043d\u0430 \u043d\u0435\u0441\u0431\u0430\u043b\u0430\u043d\u0441\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u043c \u0434\u0435\u0440\u0435\u0432\u0435 (\u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440, \u0442\u043e\u043b\u044c\u043a\u043e \u043b\u0435\u0432\u044b\u0435 \u043f\u043e\u0442\u043e\u043c\u043a\u0438) \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442 \u0432\u0435\u0440\u043d\u0443\u044e \u0433\u0440\u0443\u043f\u043f\u0438\u0440\u043e\u0432\u043a\u0443 \u043f\u043e \u0443\u0440\u043e\u0432\u043d\u044f\u043c."}, {"t": "\u0421\u0432\u043e\u044f min-heap \u0431\u0435\u0437 heapq", "d": "\u0420\u0435\u0430\u043b\u0438\u0437\u043e\u0432\u0430\u0442\u044c \u043a\u043b\u0430\u0441\u044

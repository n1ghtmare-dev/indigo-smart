<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель проектов</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0f12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236b8afd'/><text x='16' y='22' font-family='monospace' font-size='15' fill='%23fff' text-anchor='middle'>IS</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f12; --panel:#15181e; --panel-2:#1b1f26;
    --fg:#e7e9ee; --dim:#8b91a0; --faint:#5b616e;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --accent:#6b8afd; --accent-soft:rgba(107,138,253,.14);
    --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
    --r:12px;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
    font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column}
  a{color:inherit}
  .wrap{width:100%;max-width:76rem;margin:0 auto;padding:clamp(1.5rem,4vw,3rem) clamp(1.1rem,3vw,2.5rem);flex:1}

  .top{display:flex;align-items:center;gap:1rem;margin-bottom:clamp(1.75rem,4vw,2.75rem)}
  .logo{display:flex;align-items:center;gap:.6rem;font-weight:600;letter-spacing:.01em}
  .logo__mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#9b6bfd);
    display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:13px;font-weight:500}
  .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim);
    border:1px solid var(--line);border-radius:999px;padding:.35rem .8rem}

  h1{font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:700;letter-spacing:-.02em;margin:0 0 .4rem}
  .sub{color:var(--dim);margin:0 0 clamp(1.5rem,3vw,2.25rem);font-size:.95rem}

  .controls{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-bottom:1.5rem}
  .search{flex:1;min-width:12rem;display:flex;align-items:center;gap:.55rem;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.55rem 1rem}
  .search:focus-within{border-color:var(--line-2)}
  .search svg{width:15px;height:15px;flex:none;color:var(--faint)}
  .search input{border:0;background:none;color:var(--fg);font-family:var(--sans);font-size:.9rem;width:100%;outline:none}
  .search input::placeholder{color:var(--faint)}
  .filters{display:flex;flex-wrap:wrap;gap:.4rem}
  .chip{font-family:var(--mono);font-size:12px;color:var(--dim);cursor:pointer;
    background:none;border:1px solid var(--line);border-radius:999px;padding:.45rem .85rem;
    transition:border-color .2s,color .2s,background-color .2s}
  .chip:hover{color:var(--fg);border-color:var(--line-2)}
  .chip[aria-pressed="true"]{color:#fff;background:var(--accent-soft);border-color:var(--accent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:1rem}
  .card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:1.15rem 1.15rem 1.25rem;text-decoration:none;color:inherit;
    transition:border-color .2s,background-color .2s,transform .25s cubic-bezier(.16,1,.3,1)}
  .card:hover{border-color:var(--line-2);background:var(--panel-2);transform:translateY(-2px)}
  .card__head{display:flex;align-items:center;gap:.8rem;margin-bottom:.9rem}
  .mono-tile{width:42px;height:42px;flex:none;border-radius:10px;display:grid;place-items:center;
    font-family:var(--mono);font-size:17px;font-weight:500;color:#fff}
  .card__cat{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:.25rem .6rem}
  .card__name{font-weight:600;font-size:1.02rem;letter-spacing:-.01em;margin:0 0 .3rem}
  .card__note{color:var(--dim);font-size:.85rem;margin:0 0 1rem;flex:1}
  .card__foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
    padding-top:.9rem;border-top:1px solid var(--line)}
  .card__path{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .card__go{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);
    display:inline-flex;gap:.4rem;align-items:center}
  .card__go i{font-style:normal;transition:transform .3s cubic-bezier(.16,1,.3,1)}
  .card:hover .card__go i{transform:translateX(4px)}

  .empty{color:var(--faint);font-family:var(--mono);font-size:13px;padding:2rem 0}

  footer{padding:1.25rem clamp(1.1rem,3vw,2.5rem);border-top:1px solid var(--line);
    color:var(--faint);font-family:var(--mono);font-size:11px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="logo"><span class="logo__mark">IS</span> Панель проектов</span>
    <span class="count" id="count"></span>
  </div>

  <h1>Проекты</h1>
  <p class="sub">Сайты, размещённые на этом домене. Откройте нужный.</p>

  <div class="controls">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Поиск по названию…" autocomplete="off">
    </label>
    <div class="filters" id="filters"></div>
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Ничего не найдено.</p>
</div>

<footer>Внутренняя панель · доступ для управления размещёнными сайтами</footer>

<script>
  /* ── Реестр сайтов. Добавить проект = один объект. Темы могут быть любыми. ── */
  const SITES = [
    {
      name: "Школа-студия красоты — тёмный",
      category: "Красота",
      path: "/landing/index.html",
      note: "Тёмный атмосферный лендинг: почти чёрный фон, золото, кинокадры.",
      accent: "#c9a24a"
    },
    {
      name: "Школа-студия красоты — зелёный",
      category: "Красота",
      path: "/landing2/index.html",
      note: "Тёмно-зелёный вариант с реальными фото студии, упор на обучение.",
      accent: "#2f7d5b"
    },
    {
      name: "DarFit — женская фитнес-студия",
      category: "Фитнес",
      path: "/landing3/index.html",
      note: "Спокойный лендинг: гармоничный градиент, пины на фото и перетекающие секции.",
      accent: "#6f8a7b"
    }
  ];

  const grid = document.getElementById("grid");
  const filtersEl = document.getElementById("filters");
  const countEl = document.getElementById("count");
  const emptyEl = document.getElementById("empty");
  const qEl = document.getElementById("q");

  let activeCat = "Все";
  let query = "";

  // Монограмма: первые буквы двух первых слов; токены-тире и вариант после «—» отбрасываем.
  const initials = (s) =>
    s.split(/\s*[—–]\s*/)[0].trim().split(/\s+/).filter(Boolean).slice(0, 2)
      .map(w => w[0]).join("").toUpperCase();

  const plural = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? " сайт"
    : ([2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? " сайта" : " сайтов"));

  const categories = ["Все", ...Array.from(new Set(SITES.map(s => s.category)))];
  filtersEl.innerHTML = categories.map(c =>
    '<button class="chip" data-cat="' + c + '" aria-pressed="' + (c === "Все") + '">' + c + '</button>').join("");

  filtersEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    activeCat = btn.dataset.cat;
    filtersEl.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b === btn));
    render();
  });

  qEl.addEventListener("input", () => { query = qEl.value.trim().toLowerCase(); render(); });

  function render() {
    const list = SITES.filter(s =>
      (activeCat === "Все" || s.category === activeCat) &&
      (!query || s.name.toLowerCase().includes(query) || s.category.toLowerCase().includes(query))
    );
    countEl.textContent = plural(SITES.length);
    emptyEl.hidden = list.length > 0;
    grid.innerHTML = list.map(s =>
      '<a class="card" href="' + s.path + '" target="_blank" rel="noopener">' +
        '<div class="card__head">' +
          '<span class="mono-tile" style="background:' + s.accent + '">' + initials(s.name) + '</span>' +
          '<span class="card__cat">' + s.category + '</span>' +
        '</div>' +
        '<h2 class="card__name">' + s.name + '</h2>' +
        '<p class="card__note">' + s.note + '</p>' +
        '<div class="card__foot">' +
          '<span class="card__path">' + s.path.replace(/\/index\.html$/, "/") + '</span>' +
          '<span class="card__go">Открыть <i aria-hidden="true">→</i></span>' +
        '</div>' +
      '</a>').join("");
  }

  render();
</script>
</body>
</html>

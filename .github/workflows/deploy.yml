name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  BACKEND_PATH: /var/www/indigosmart/data/backend/src/smart_app/
  FRONTEND_PATH: /var/www/indigosmart/data/www/indigosmart.ru/
  PUBLIC_API_URL: https://indigosmart.ru/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smart-board/package-lock.json

      - name: Build frontend
        working-directory: smart-board
        env:
          REACT_APP_API_URL: ${{ env.PUBLIC_API_URL }}
          CI: false
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          # Validate secrets
          missing=()
          [ -z "$SSH_HOST" ] && missing+=("SSH_HOST")
          [ -z "$SSH_USER" ] && missing+=("SSH_USER")
          [ -z "$SSH_PORT" ] && missing+=("SSH_PORT")
          [ -z "$SSH_PRIVATE_KEY" ] && missing+=("SSH_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: missing GitHub Secrets: ${missing[*]}"
            echo "Set them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Sanity-check the key actually parses
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
          # known_hosts via keyscan (non-fatal — StrictHostKeyChecking handles it)
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH ready: ${SSH_USER}@${SSH_HOST}:${SSH_PORT}"

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR -o ConnectTimeout=20 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'whoami && hostname && rsync --version | head -1 && ls -ld ${{ env.FRONTEND_PATH }} ${{ env.BACKEND_PATH }}'

      - name: Rsync frontend build
        run: |
          rsync -rlDzv --delete \
            --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20" \
            smart-board/build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.FRONTEND_PATH }}

      - name: Rsync backend source
        run: |
          rsync -rlDz --delete \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='*.pyc' \
            --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20" \
            smart-app/src/smart_app/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.BACKEND_PATH }}

      - name: Restart backend (pm2)
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR -o ConnectTimeout=20 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; nvm use 22 >/dev/null && pm2 restart indigosmart-api --update-env'

      - name: Smoke test
        run: |
          sleep 3
          curl -sf -m 10 ${{ env.PUBLIC_API_URL }}/ | grep -q IndigoSmart || (echo "API smoke test FAILED"; exit 1)
          curl -sf -m 10 -o /dev/null https://indigosmart.ru/ || (echo "Frontend smoke test FAILED"; exit 1)
          echo "Deploy verified."

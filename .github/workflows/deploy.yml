name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  BACKEND_PATH: /var/www/indigosmart/data/backend/src/smart_app/
  FRONTEND_PATH: /var/www/indigosmart/data/www/indigosmart.ru/
  PUBLIC_API_URL: https://indigosmart.ru/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smart-board/package-lock.json

      - name: Build frontend
        working-directory: smart-board
        env:
          REACT_APP_API_URL: ${{ env.PUBLIC_API_URL }}
          CI: false
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync frontend build
        run: |
          rsync -rlDz --delete \
            --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            smart-board/build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.FRONTEND_PATH }}

      - name: Rsync backend source
        run: |
          rsync -rlDz --delete \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='*.pyc' \
            --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            smart-app/src/smart_app/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.BACKEND_PATH }}

      - name: Restart backend (pm2)
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; nvm use 22 >/dev/null && pm2 restart indigosmart-api --update-env'

      - name: Smoke test
        run: |
          sleep 3
          curl -sf -m 10 ${{ env.PUBLIC_API_URL }}/ | grep -q IndigoSmart || (echo "API smoke test FAILED"; exit 1)
          curl -sf -m 10 -o /dev/null https://indigosmart.ru/ || (echo "Frontend smoke test FAILED"; exit 1)
          echo "Deploy verified."

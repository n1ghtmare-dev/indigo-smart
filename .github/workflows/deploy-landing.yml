name: Deploy landings

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'landing2/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch: {}

# Оба лендинга живут подпутями внутри корня indigosmart.ru.
# Каждый новый подпуть нужно добавить И сюда, И в --exclude в deploy.yml,
# иначе rsync --delete основного сайта его удалит.
env:
  SITE_ROOT: /var/www/indigosmart/data/www/indigosmart.ru

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: landing
            slug: landing
            marker: hero-portrait.webp
          - dir: landing2
            slug: landing2
            marker: Marck+Script

    name: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4

      # Оба лендинга — статика. Сборка запускается только если появится package.json
      - name: Detect build
        id: detect
        run: |
          if [ -f "${{ matrix.dir }}/package.json" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "src=${{ matrix.dir }}/" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.needs_build == 'true'
        with:
          node-version: '22'

      - name: Build
        if: steps.detect.outputs.needs_build == 'true'
        working-directory: ${{ matrix.dir }}
        env:
          CI: false
          PUBLIC_URL: /${{ matrix.slug }}
          BASE_URL: /${{ matrix.slug }}/
        run: |
          npm ci
          npm run build

      - name: Resolve build dir
        if: steps.detect.outputs.needs_build == 'true'
        id: resolve
        run: |
          for d in dist build out; do
            if [ -d "${{ matrix.dir }}/$d" ]; then
              echo "src=${{ matrix.dir }}/$d/" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "ERROR: не найден каталог сборки (dist/ build/ out/) в ${{ matrix.dir }}/"
          exit 1

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          missing=()
          [ -z "$SSH_HOST" ] && missing+=("SSH_HOST")
          [ -z "$SSH_USER" ] && missing+=("SSH_USER")
          [ -z "$SSH_PORT" ] && missing+=("SSH_PORT")
          [ -z "$SSH_PRIVATE_KEY" ] && missing+=("SSH_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: missing GitHub Secrets: ${missing[*]}"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create target dir
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR -o ConnectTimeout=20 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'mkdir -p ${{ env.SITE_ROOT }}/${{ matrix.slug }}'

      - name: Rsync
        env:
          SRC: ${{ steps.resolve.outputs.src || steps.detect.outputs.src }}
        run: |
          echo "Deploying $SRC -> ${{ env.SITE_ROOT }}/${{ matrix.slug }}/"
          rsync -rlDzv --delete \
            --exclude='node_modules/' \
            --exclude='.git/' \
            --exclude='.playwright-mcp/' \
            --exclude='claude.md' \
            --exclude='CLAUDE.md' \
            --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20" \
            "$SRC" \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.SITE_ROOT }}/${{ matrix.slug }}/

      # Проверяем не только код 200, но и что отдаётся именно наша страница:
      # при SPA-fallback в nginx по этому пути вернулся бы дашборд IndigoSmart
      - name: Smoke test
        run: |
          url="https://indigosmart.ru/${{ matrix.slug }}/"
          body=$(curl -sfL -m 15 "$url") || { echo "FAILED: $url недоступен"; exit 1; }
          if ! printf '%s' "$body" | grep -q '${{ matrix.marker }}'; then
            echo "FAILED: по адресу $url отдаётся не та страница."
            echo "Не найден маркер '${{ matrix.marker }}'. Похоже на SPA-fallback в nginx —"
            echo "нужен блок: location /${{ matrix.slug }}/ { try_files \$uri \$uri/ =404; }"
            exit 1
          fi
          echo "OK: $url отдаёт свою страницу"

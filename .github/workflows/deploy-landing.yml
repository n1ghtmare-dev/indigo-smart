name: Deploy landings

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'landing2/**'
      - 'landing3/**'
      - 'landing4/**'
      - 'cosmograph/**'
      - 'landing-root/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch: {}

# Весь сайт indigosmart.ru отдаётся FastAPI-бэкендом (uvicorn:8000) через
# catch-all в main.py: файл из docroot отдаётся как есть, для каталога — index.html.
# nginx лишь проксирует всё на :8000. Поэтому:
#   - хаб живёт в docroot/index.html (страница-выбор шаблонов),
#   - лендинги — в docroot/<slug>/, доступны по /<slug>/index.html,
#   - «голый» /<slug>/ отдаёт index.html этого каталога (проверено на проде),
#     поэтому канонические адреса вида /cosmograph/ рабочие.
# Бэкенд обязан работать, иначе сайт вернёт 502. Он сохранён в `pm2 save`.
env:
  SITE_ROOT: /var/www/indigosmart/data/www/indigosmart.ru

jobs:
  landings:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1   # деплой по одному: сервер иногда роняет пачку одновременных SSH
      matrix:
        include:
          - dir: landing
            slug: landing
            marker: hero-portrait.webp
          - dir: landing2
            slug: landing2
            marker: Marck+Script
          - dir: landing3
            slug: landing3
            marker: DarFit
          - dir: landing4
            slug: landing4
            marker: New home
          - dir: cosmograph
            slug: cosmograph
            marker: knowledge planet
    name: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          missing=()
          [ -z "$SSH_HOST" ] && missing+=("SSH_HOST")
          [ -z "$SSH_USER" ] && missing+=("SSH_USER")
          [ -z "$SSH_PORT" ] && missing+=("SSH_PORT")
          [ -z "$SSH_PRIVATE_KEY" ] && missing+=("SSH_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: missing GitHub Secrets: ${missing[*]}"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create target dir
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR -o ConnectTimeout=20 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'mkdir -p ${{ env.SITE_ROOT }}/${{ matrix.slug }}'

      - name: Rsync landing
        run: |
          rsync -rlDzv --delete \
            --exclude='.git/' --exclude='.playwright-mcp/' \
            --exclude='claude.md' --exclude='CLAUDE.md' \
            --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20" \
            ${{ matrix.dir }}/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.SITE_ROOT }}/${{ matrix.slug }}/

      # Лендинг живёт по /<slug>/index.html (голый каталог отдаёт хаб).
      - name: Smoke test
        run: |
          url="https://indigosmart.ru/${{ matrix.slug }}/index.html"
          body=$(curl -sfL -m 15 "$url") || { echo "FAILED: $url недоступен (бэкенд лежит?)"; exit 1; }
          if ! printf '%s' "$body" | grep -q '${{ matrix.marker }}'; then
            echo "FAILED: по $url не найден маркер '${{ matrix.marker }}' — отдалась не та страница."
            exit 1
          fi
          echo "OK: $url"

  # Страница-хаб в корне домена (docroot/index.html). Без --delete, чтобы не
  # снести React-статику, лендинги и бэкап рядом.
  hub:
    needs: landings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync hub -> docroot root (no delete)
        run: |
          rsync -rlDzv \
            --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=20" \
            landing-root/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.SITE_ROOT }}/

      # Корень закрыт basic-auth на уровне бэкенда, поэтому проверяем не содержимое
      # страницы, а что защита на месте и файлы хаба доехали.
      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 https://indigosmart.ru/)
          [ "$code" = "401" ] || { echo "FAILED: корень отдал $code вместо 401 — панель должна быть под паролем"; exit 1; }
          curl -sI -m 15 https://indigosmart.ru/ | grep -qi 'www-authenticate: *basic'             || { echo "FAILED: нет заголовка WWW-Authenticate — браузер не покажет окно логина"; exit 1; }
          curl -sf -m 15 -o /dev/null https://indigosmart.ru/thumbs/cosmograph.webp             || { echo "FAILED: файлы хаба не доехали"; exit 1; }
          echo "OK: корень под basic-auth, файлы хаба на месте"
